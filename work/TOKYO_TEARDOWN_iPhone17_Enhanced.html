const SRCMUL ={wpn:1,   collapse:1.5, fire:1.5, chain:2,  domino:3,   nuke:0};
const SRCNAME={wpn:'直撃', collapse:'倒壊', fire:'延焼', chain:'誘爆', domino:'巻き込み', nuke:'核･破壊球'};
const TALLY={wpn:0, collapse:0, fire:0, chain:0, domino:0, nuke:0};
function tallyKill(n,sc,src,bid,combo){
  if(!SRCMUL.hasOwnProperty(src)) src='wpn';
  if(src==='domino' && bid===domSelf) src='collapse';
  TALLY[src]+=n;
  if(window.__tallyHook) window.__tallyHook(src,n);
  const mul=SRCMUL[src];
  if(mul>0){
    S.score+=Math.round(sc*mul*S.combo);
    if(combo){ S.comboHits+=n; S.comboT=1.0; }
  }
  return src;
}
/* 技巧率：壊した総量に対する平均倍率（0〜3）。ランクはこれで決まる */
function styleRatio(){
  let tot=0, pts=0;
  for(const k in TALLY){ tot+=TALLY[k]; pts+=TALLY[k]*SRCMUL[k]; }
  return tot>0 ? pts/tot : 0;
}
function resetTally(){ for(const k in TALLY) TALLY[k]=0; KSRC='wpn'; domSelf=-1; chunkSrc='collapse'; }

/* ══════════ 建物の生成（詳細版） ══════════
   グリッドに余白(MG)を持たせ、袖看板・ベランダ・外階段・屋上設備を実際に張り出させる */
const MG=4;
function mkBuilding(fx,fz,fw,fd,H,style,seed,opt){
  const W=fw+MG*2, D=fd+MG*2, HH=H+9;
  const vox=new Uint8Array(W*HH*D), hpv=new Uint16Array(W*HH*D);
  let live=0;
  const at=(x,y,z)=>x+W*(y+HH*z);
  const set=(x,y,z,m)=>{
    if(!m||!(x>=0&&y>=0&&z>=0&&x<W&&y<HH&&z<D)) return;
    const i=at(x,y,z); if(!vox[i]) live++;
    vox[i]=m; hpv[i]=MATS[m].hp;
  };
  const fill=(x0,y0,z0,x1,y1,z1,m)=>{
    for(let z=z0;z<=z1;z++) for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) set(x,y,z,m);
  };
  let rs=(seed*2654435761)>>>0;
  const R=()=>{ rs=(rs*1664525+1013904223)>>>0; return rs/4294967296; };
  const RI=(a,b)=>a+((R()*(b-a+1))|0);

  /* ── 様式ごとの素材 ── */
  // NEON は上部で共通宣言
  const warm=R()<.55;
  const winLit=warm?3:4, litRate=.42+R()*.4;
  let wallM, baseM, floorM=1;
  const WALLS={
    zakkyo:[12,24,23,1,22,14],
    apart :[12,13,22,24,23],
    office:[13,25,26,23,22],
    shop  :[6,24,12,23],
    tower :[5,25,26],
  };
  const pick=WALLS[style]||[1,23];
  wallM=pick[(R()*pick.length)|0];
  baseM=(style==='shop'||style==='zakkyo')?14:(R()<.4?26:1);
  const mainNeon=NEON[(R()*NEON.length)|0];   // ビルごとの基調色（1階から使う）

  /* ── 階の刻み ── */
  const g1=(style==='shop'||style==='zakkyo')?7:6;      // 1階は高い
  const fh=(style==='apart')?6:(style==='office'?6:4);  // 標準階高
  const lv=[0]; { let y=g1; while(y<H-1){ lv.push(y); y+=fh; } }
  const nlv=lv.length;
  const lvOf=(y)=>{ for(let i=nlv-1;i>=0;i--) if(y>=lv[i]) return i; return 0; };

  /* ── セットバック（上層が後退する） ── */
  const stepped=(style==='office'||style==='tower');
  const inset=(y)=>{
    if(!stepped) return 0;
    if(y>H*.78) return Math.min(2,(fw>>2));
    if(y>H*.52) return Math.min(1,(fw>>3));
    return 0;
  };

  /* ── 躯体：外壁・窓・床スラブ ── */
  for(let y=0;y<H;y++){
    const ins=inset(y);
    const X0=MG+ins, X1=MG+fw-1-ins, Z0=MG+ins, Z1=MG+fd-1-ins;
    if(X1<X0||Z1<Z0) break;
    const li=lvOf(y), yl=y-lv[li];
    const ground=(y<g1);
    const isSlab=(y===lv[li]);
    if(isSlab) fill(X0,y,Z0,X1,y,Z1,floorM);          // 床スラブ
    for(let z=Z0;z<=Z1;z++) for(let x=X0;x<=X1;x++){
      if(x!==X0&&x!==X1&&z!==Z0&&z!==Z1) continue;    // 外周のみ
      let m;
      if(ground){
        // 実際の歌舞伎町の1階は、閉じたシャッターより
        // 電飾された店舗入口・立て看板・のぼりが並ぶ
        if(y===g1-1) m=1;                              // 庇の下端
        else if(style==='zakkyo'||style==='shop'){
          const xf2=(x===X0||x===X1);
          const al2=xf2?(z-Z0):(x-X0);
          const cell=((al2+ (y*3))%7);
          if(cell===0) m=5;                            // 店舗を仕切る柱
          else if(y===g1-2) m=(R()<.62)?mainNeon:11;   // 入口上の電飾帯
          else if(R()<.30) m=baseM;                    // 一部はシャッター
          else m=(R()<.55)?3:((R()<.5)?mainNeon:NEON[(R()*NEON.length)|0]);
        }
        else m=baseM;
      } else {
        const xf=(x===X0||x===X1);
        const along=xf?(z-Z0):(x-X0);
        const sash=(along%3===0);
        const winRow=(yl>=1&&yl<=fh-2);
        if(winRow&&!sash&&!isSlab){
          const fl=((li*37+seed*11)%100)/100;          // 階ごとの傾向
          if(fl<.11) m=2;                              // 空きフロア：真っ暗
          else {
            const room=((x-X0)>>1)*7+((z-Z0)>>1)*13+(li*5);
            const rl=(room%97)/97;
            const th=fl>.86 ? .95 : litRate*(.55+fl);  // 全灯フロアが時々ある
            if(rl>=th) m=2;
            else if(rl<.09) m=(warm?28:27);            // 数室だけ色が違う
            else m=winLit;
          }
        } else m = isSlab?1:(sash?15:wallM);
      }
      set(x,y,z,m);
    }
    // 隅柱
    set(X0,y,Z0,5); set(X1,y,Z0,5); set(X0,y,Z1,5); set(X1,y,Z1,5);
    // 内部柱
    if(fw>7&&fd>7&&(y%1===0)){
      set(MG+(fw>>1),y,MG+(fd>>1),5);
    }
  }
  // 屋根スラブ
  { const ins=inset(H-1);
    fill(MG+ins,H,MG+ins,MG+fw-1-ins,H,MG+fd-1-ins,1); }

  /* ── 街路に面した「顔」（複数可） ── */
  const faces=(opt&&opt.faces&&opt.faces.length)?opt.faces:[RI(0,3)];
  const face=faces[0];
  const dense=(opt&&opt.dense!=null)?opt.dense:.5;
  const fX0=MG, fX1=MG+fw-1, fZ0=MG, fZ1=MG+fd-1;
  // mainNeon は baseM の直後で宣言済み

  /* ── ② 壁面看板：実際の歌舞伎町は外壁が見えないほど看板に覆われる ── */
  if(style==='zakkyo'||style==='shop'){
    for(let fi=0;fi<faces.length;fi++){
      const f=faces[fi];
      if(R()>dense*0.92) continue;
      for(let li=1;li<nlv-1;li++){
        if(R()>0.80) continue;
        const y0=lv[li]+1, y1=Math.min(H-2, lv[Math.min(nlv-1,li+RI(1,2))]);
        if(y1<=y0) continue;
        const nm=(R()<.5)?mainNeon:NEON[(R()*NEON.length)|0];
        // 外側1マスに貼るだけでなく、壁面そのものも看板に置き換える。
        // 実際の歌舞伎町は外壁が見えないほど覆われている
        if(f===0){
          fill(fX0-1,y0,fZ0+1,fX0-1,y1,fZ1-1,nm);
          fill(fX0,  y0,fZ0+1,fX0,  y1,fZ1-1,nm);
        } else if(f===1){
          fill(fX1+1,y0,fZ0+1,fX1+1,y1,fZ1-1,nm);
          fill(fX1,  y0,fZ0+1,fX1,  y1,fZ1-1,nm);
        } else if(f===2){
          fill(fX0+1,y0,fZ0-1,fX1-1,y1,fZ0-1,nm);
          fill(fX0+1,y0,fZ0,  fX1-1,y1,fZ0,  nm);
        } else {
          fill(fX0+1,y0,fZ1+1,fX1-1,y1,fZ1+1,nm);
          fill(fX0+1,y0,fZ1,  fX1-1,y1,fZ1,  nm);
        }
      }
    }
  }
  /* ── 袖看板：歌舞伎町の主役。面する街路すべてに、ほぼ全階へ ── */
  for(let fi=0;fi<faces.length;fi++){
    const f=faces[fi];
    for(let li=1;li<nlv;li++){
      if(R()>dense) continue;
      const nm=(R()<.55)?mainNeon:NEON[(R()*NEON.length)|0];
      const y=lv[li]+1, d=RI(3,5), hh=(R()<.4)?3:2;
      const a=Math.min(3,Math.max(1,fd-2)), b=Math.min(3,Math.max(1,fw-2));
      if(f===0)      fill(fX0-d,y,fZ0+1,fX0-1,y+hh,fZ0+a,nm);
      else if(f===1) fill(fX1+1,y,fZ0+1,fX1+d,y+hh,fZ0+a,nm);
      else if(f===2) fill(fX0+1,y,fZ0-d,fX0+b,y+hh,fZ0-1,nm);
      else           fill(fX0+1,y,fZ1+1,fX0+b,y+hh,fZ1+d,nm);
    }
    /* 大型看板：数階ぶんを覆う平看板 */
    if(nlv>3&&R()<dense+.25){
      const li=RI(1,nlv-2), y0=lv[li], y1=Math.min(H-2,y0+RI(5,9));
      const nm=(R()<.5)?mainNeon:NEON[(R()*NEON.length)|0];
      if(f===0)      fill(fX0-1,y0,fZ0+1,fX0-1,y1,fZ1-1,nm);
      else if(f===1) fill(fX1+1,y0,fZ0+1,fX1+1,y1,fZ1-1,nm);
      else if(f===2) fill(fX0+1,y0,fZ0-1,fX1-1,y1,fZ0-1,nm);
      else           fill(fX0+1,y0,fZ1+1,fX1-1,y1,fZ1+1,nm);
    }
    /* 1階の電飾帯 */
    { const y=Math.max(1,g1-2), nm=(R()<.5)?17:mainNeon;
      if(f===0)      fill(fX0-1,y,fZ0,fX0-1,y,fZ1,nm);
      else if(f===1) fill(fX1+1,y,fZ0,fX1+1,y,fZ1,nm);
      else if(f===2) fill(fX0,y,fZ0-1,fX1,y,fZ0-1,nm);
      else           fill(fX0,y,fZ1+1,fX1,y,fZ1+1,nm);
    }
  }
  /* ── ④ 巨大縦看板：地上から屋上まで一気に届く電照看板。
        歌舞伎町の写真で最も目立つ要素 ── */
  if((style==='zakkyo'||style==='shop') && H>12 && R()<dense*0.55){
    const f=faces[(R()*faces.length)|0];
    const nm=(R()<.6)?mainNeon:NEON[(R()*NEON.length)|0];
    const y0=g1, y1=H-1;
    const wdt=RI(2,3);                  // 看板の幅
    const d=RI(3,5);                    // 街路へのせり出し
    // 支持する鉄骨
    if(f===0||f===1){
      const zc=fZ0+((fd/2)|0);
      const bx=(f===0)?fX0-1:fX1+1;
      for(let y=y0;y<=y1;y+=4)
        for(let k=1;k<=d;k++) set((f===0)?bx-k+1:bx+k-1, y, zc, 5);
      // 看板本体
      if(f===0) fill(fX0-d,y0,zc-wdt, fX0-1,y1,zc+wdt, nm);
      else      fill(fX1+1,y0,zc-wdt, fX1+d,y1,zc+wdt, nm);
      // 縁の電飾
      for(let y=y0;y<=y1;y+=3){
        if(f===0){ set(fX0-d,y,zc-wdt,16); set(fX0-d,y,zc+wdt,16); }
        else     { set(fX1+d,y,zc-wdt,16); set(fX1+d,y,zc+wdt,16); }
      }
    } else {
      const xc=fX0+((fw/2)|0);
      for(let y=y0;y<=y1;y+=4)
        for(let k=1;k<=d;k++) set(xc, y, (f===2)?fZ0-k+1:fZ1+k-1, 5);
      if(f===2) fill(xc-wdt,y0,fZ0-d, xc+wdt,y1,fZ0-1, nm);
      else      fill(xc-wdt,y0,fZ1+1, xc+wdt,y1,fZ1+d, nm);
      for(let y=y0;y<=y1;y+=3){
        if(f===2){ set(xc-wdt,y,fZ0-d,16); set(xc+wdt,y,fZ0-d,16); }
        else     { set(xc-wdt,y,fZ1+d,16); set(xc+wdt,y,fZ1+d,16); }
      }
    }
  }
  /* ── 縦看板 ── */
  if(H>17&&R()<.55){
    const nm=NEON[(R()*NEON.length)|0];
    const y0=RI(4,Math.max(5,H-14)), hh=RI(7,13);
    const zc=fZ0+((fd/2)|0), xc=fX0+((fw/2)|0), y1s=Math.min(H-1,y0+hh);
    if(face===0)      fill(fX0-3,y0,zc-1,fX0-1,y1s,zc+1,nm);
    else if(face===1) fill(fX1+1,y0,zc-1,fX1+3,y1s,zc+1,nm);
    else if(face===2) fill(xc-1,y0,fZ0-3,xc+1,y1s,fZ0-1,nm);
    else              fill(xc-1,y0,fZ1+1,xc+1,y1s,fZ1+3,nm);
  }
  /* ── 1階の看板帯 ── */
  { const nm=NEON[(R()*NEON.length)|0], y=g1-1;
    if(face===0)      fill(fX0-1,y,fZ0,fX0-1,y,fZ1,nm);
    else if(face===1) fill(fX1+1,y,fZ0,fX1+1,y,fZ1,nm);
    else if(face===2) fill(fX0,y,fZ0-1,fX1,y,fZ0-1,nm);
    else              fill(fX0,y,fZ1+1,fX1,y,fZ1+1,nm);
  }
  /* ── 1階の庇（商店・雑居ビルの顔） ── */
  if(style==='shop'||style==='zakkyo'){
    const y=g1-1, aw=RI(2,3);
    for(let fi=0;fi<faces.length;fi++){
      const f=faces[fi];
      if(f===0)      fill(fX0-aw,y,fZ0,fX0-1,y,fZ1,14);
      else if(f===1) fill(fX1+1,y,fZ0,fX1+aw,y,fZ1,14);
      else if(f===2) fill(fX0,y,fZ0-aw,fX1,y,fZ0-1,14);
      else           fill(fX0,y,fZ1+1,fX1,y,fZ1+aw,14);
    }
  }
  /* ── 窓台：窓帯の下に1ボクセル張り出す ── */
  if(style!=='tower'){
    for(let li=1;li<nlv;li+=2){          // 全階に付けると面数が嵩むので1階おき
      const y=lv[li]+1;
      if(y>=H-1) break;
      for(let fi=0;fi<faces.length;fi++){
        const f=faces[fi];
        if(f===0)      fill(fX0-1,y,fZ0+1,fX0-1,y,fZ1-1,1);
        else if(f===1) fill(fX1+1,y,fZ0+1,fX1+1,y,fZ1-1,1);
        else if(f===2) fill(fX0+1,y,fZ0-1,fX1-1,y,fZ0-1,1);
        else           fill(fX0+1,y,fZ1+1,fX1-1,y,fZ1+1,1);
      }
    }
  }
  /* ── ベランダ（マンション） ── */
  if(style==='apart'){
    const bf=(face+2)%4;
    for(let li=1;li<nlv;li++){
      const y=lv[li];
      // 手すりは支柱＋笠木で隙間を作る（格子が細かくなったので表現できる）
      const RAIL=(a0,a1,ax,fixed,yy)=>{
        for(let t=a0;t<=a1;t++){
          const post=(t%2===0);
          if(ax===0){ set(fixed,yy+2,t,18); if(post) set(fixed,yy+1,t,18); }
          else      { set(t,yy+2,fixed,18); if(post) set(t,yy+1,fixed,18); }
        }
      };
      if(bf===0){ fill(fX0-3,y,fZ0+1,fX0-1,y,fZ1-1,1); RAIL(fZ0+1,fZ1-1,0,fX0-3,y); }
      else if(bf===1){ fill(fX1+1,y,fZ0+1,fX1+3,y,fZ1-1,1); RAIL(fZ0+1,fZ1-1,0,fX1+3,y); }
      else if(bf===2){ fill(fX0+1,y,fZ0-3,fX1-1,y,fZ0-1,1); RAIL(fX0+1,fX1-1,1,fZ0-3,y); }
      else { fill(fX0+1,y,fZ1+1,fX1-1,y,fZ1+3,1); RAIL(fX0+1,fX1-1,1,fZ1+3,y); }
    }
  }
  /* ── 外階段（雑居ビル・マンション） ── */
  if((style==='zakkyo'||style==='apart')&&R()<.62){
    const sf=(face+1)%4;
    for(let y=0;y<H;y++){
      const land=(y%fh===0);
      if(sf===0){ set(fX0-1,y,fZ1-1,5); set(fX0-2,y,fZ1-1,5);
                  if(land) fill(fX0-2,y,fZ1-2,fX0-1,y,fZ1-1,5); }
      else if(sf===1){ set(fX1+1,y,fZ1-1,5); set(fX1+2,y,fZ1-1,5);
                  if(land) fill(fX1+1,y,fZ1-2,fX1+2,y,fZ1-1,5); }
      else if(sf===2){ set(fX1-1,y,fZ0-1,5); set(fX1-1,y,fZ0-2,5);
                  if(land) fill(fX1-2,y,fZ0-2,fX1-1,y,fZ0-1,5); }
      else { set(fX1-1,y,fZ1+1,5); set(fX1-1,y,fZ1+2,5);
                  if(land) fill(fX1-2,y,fZ1+1,fX1-1,y,fZ1+2,5); }
    }
  }
  /* ── 縦配管 ── */
  if(R()<.7){
    const px=(R()<.5)?fX0:fX1, pz=RI(fZ0+1,fZ1-1);
    for(let y=1;y<H;y++) set(px===fX0?px-1:px+1,y,pz,20);
  }
  /* ── 室外機（外壁に張り付く） ── */
  if(R()<.75){
    for(let k=0;k<RI(2,6);k++){
      const y=(nlv>1?lv[RI(1,nlv-1)]:RI(1,Math.max(1,H-3)))+1;
      if(face===0) set(fX0-1,y,RI(fZ0+1,fZ1-1),20);
      else if(face===1) set(fX1+1,y,RI(fZ0+1,fZ1-1),20);
      else if(face===2) set(RI(fX0+1,fX1-1),y,fZ0-1,20);
      else set(RI(fX0+1,fX1-1),y,fZ1+1,20);
    }
  }
  /* ── 自動販売機（路面） ── */
  if(R()<.42){
    const vx=RI(fX0+1,Math.max(fX0+1,fX1-1)), vz=RI(fZ0+1,Math.max(fZ0+1,fZ1-1));
    if(face===0) fill(fX0-1,0,vz,fX0-1,1,vz,19);
    else if(face===1) fill(fX1+1,0,vz,fX1+1,1,vz,19);
    else if(face===2) fill(vx,0,fZ0-1,vx,1,fZ0-1,19);
    else fill(vx,0,fZ1+1,vx,1,fZ1+1,19);
  }

  /* ── 屋上 ── */
  const ins=inset(H-1);
  const rX0=MG+ins, rX1=MG+fw-1-ins, rZ0=MG+ins, rZ1=MG+fd-1-ins;
  if(rX1>rX0&&rZ1>rZ0){
    // パラペット
    for(let x=rX0;x<=rX1;x++){ set(x,H+1,rZ0,18); set(x,H+1,rZ1,18); }
    for(let z=rZ0;z<=rZ1;z++){ set(rX0,H+1,z,18); set(rX1,H+1,z,18); }
    // 塔屋
    if(rX1-rX0>=3&&rZ1-rZ0>=3&&R()<.8){
      const tx=RI(rX0+1,rX1-2), tz=RI(rZ0+1,rZ1-2);
      fill(tx,H+1,tz,tx+1,H+3,tz+1,1);
    }
    // 給水タンク（脚付き）
    if(rX1-rX0>=3&&rZ1-rZ0>=3&&R()<.72){
      const tx=RI(rX0+1,rX1-2), tz=RI(rZ0+1,rZ1-2);
      set(tx,H+1,tz,5); set(tx+1,H+1,tz,5); set(tx,H+1,tz+1,5); set(tx+1,H+1,tz+1,5);
      fill(tx,H+2,tz,tx+1,H+3,tz+1,20);
    }
    // 室外機
    for(let k=0;k<RI(1,5);k++) set(RI(rX0,rX1),H+1,RI(rZ0,rZ1),20);
    // アンテナ
    if(R()<.5){
      const ax=RI(rX0,rX1), az=RI(rZ0,rZ1);
      for(let y=H+1;y<H+1+RI(3,7);y++) set(ax,y,az,5);
    }
    /* ⑥ 屋上広告塔：実際の歌舞伎町は屋上に鉄骨の櫓を組んで
       巨大な看板を立てる。上空から見た時の情報量を決める要素 */
    if((style==='zakkyo'||style==='shop'||style==='office') && R()<dense*0.92){
      const nm=(R()<.5)?mainNeon:NEON[(R()*NEON.length)|0];
      const kind=R();
      if(kind<0.45){
        // 縦長の塔：櫓を組んで、その上に細長い看板
        const tx=RI(rX0,Math.max(rX0,rX1-1)), tz=RI(rZ0,Math.max(rZ0,rZ1-1));
        const th=RI(6,12);
        for(let y=H+1;y<H+th;y++){          // 鉄骨の櫓
          set(tx,y,tz,5); set(tx+1,y,tz,5);
          if(y%3===0){ set(tx,y,tz+1,5); set(tx+1,y,tz+1,5); }
        }
        fill(tx-1,H+th,tz,tx+2,H+th+RI(3,6),tz,nm);
      } else if(kind<0.78){
        // 横長の看板：屋上の一辺いっぱいに立てる
        const th=RI(4,8), side=(R()<.5);
        for(let x=rX0;x<=rX1;x+=2)          // 支柱
          for(let y=H+1;y<H+3;y++) set(x,y,side?rZ0:rZ1,5);
        if(side) fill(rX0,H+3,rZ0,rX1,H+3+th,rZ0,nm);
        else     fill(rX0,H+3,rZ1,rX1,H+3+th,rZ1,nm);
      } else {
        // 箱型の広告塔：屋上に立方体を載せ、4面すべてが看板
        const bx=RI(rX0,Math.max(rX0,rX1-3)), bz=RI(rZ0,Math.max(rZ0,rZ1-3));
        const bw=Math.min(4,rX1-bx), bd=Math.min(4,rZ1-bz), bh=RI(4,9);
        if(bw>0&&bd>0){
          for(let y=H+1;y<=H+bh;y++)
            for(let z=bz;z<=bz+bd;z++) for(let x=bx;x<=bx+bw;x++){
              const edge=(x===bx||x===bx+bw||z===bz||z===bz+bd);
              if(edge) set(x,y,z, (y===H+1||y===H+bh)?5:nm);
            }
        }
      }
      // 広告塔の脇に赤い航空障害灯
      if(R()<.35) set(RI(rX0,rX1),H+2,RI(rZ0,rZ1),19);
    }
  }

  const b={ id:blds.length, ox:fx-MG*VOX, oy:0, oz:fz-MG*VOX,
            W:W,H:HH,D:D, vox:vox, hp:hpv, code:mkCode(vox,hpv),
            live:live, init:live, dirty:false, mdirty:false, mesh:null, style:style };
  b.tint=randTint();
  computeBase(b);
  remesh(b); blds.push(b); totalVox+=live;
  return b;
}

const SECH=34;                              // メッシュを分ける高さ（ボクセル）
/* ボクセルの変化を区画に伝える。境界の行では隣の区画が持つ面（天面・AO）も変わるので一緒に落とす */
function markSec(b,y){
  if(!b.sec) return;
  const si=(y/SECH)|0, s=b.sec[si];
  if(!s) return;
  s.dirty=true;
  if(si>0 && y===s.y0) b.sec[si-1].dirty=true;
  if(si<b.sec.length-1 && y===s.y1-1) b.sec[si+1].dirty=true;
}
function remeshSec(b,i){
  const s=b.sec[i];
  s.dirty=false;                 // ※空になった区画でも必ず落とす。
                                 //   ここを geo の判定より後に置くと、全滅した区画が
                                 //   永久に dirty のまま残り、その建物が毎フレーム
                                 //   再生成の枠を占有して「他が一切更新されない」
  geoBudget-=(s.y1-s.y0)*b.W*b.D;
  const geo=buildGeo(b.code,b.W,b.H,b.D,false,b.tint,s.y0,s.y1,i===b.sec.length-1);
  if(s.mesh){ scene.remove(s.mesh); s.mesh.geometry.dispose(); s.mesh=null; }
  if(!geo) return;
  const m=new THREE.Mesh(geo,MAT_SOLID);
  m.position.set(b.ox,b.oy,b.oz);
  if(b.culled) m.visible=false;
  scene.add(m); s.mesh=m;
  if(b.toppling) bldPose(b,b.toppling.ang);
}
function disposeBld(b){
  if(b.sec) for(const s of b.sec) if(s.mesh){ scene.remove(s.mesh); s.mesh.geometry.dispose(); s.mesh=null; }
  if(b.mesh){ scene.remove(b.mesh); b.mesh.geometry.dispose(); b.mesh=null; }
}
let deferMesh=false, meshQ=[];
function remesh(b){
  // 起動時は実際のメッシュ生成を後回しにする。
  // 街の骨格（ボクセル）だけ先に作り、見た目は数フレームかけて追いつかせる
  if(deferMesh){ if(meshQ.indexOf(b)<0) meshQ.push(b); return; }
  refreshHalos(b);
  const nsec=Math.max(1,Math.ceil(b.H/SECH));
  if(!b.sec||b.sec.length!==nsec){
    disposeBld(b);
    b.sec=[];
    for(let i=0;i<nsec;i++)
      b.sec.push({y0:i*SECH, y1:Math.min(b.H,(i+1)*SECH), mesh:null, dirty:false});
  }
  for(let i=0;i<nsec;i++) remeshSec(b,i);
}

/* ③ ゴジラヘッド：新宿東宝ビル8階のテラスから突き出す。
   実物は全長約12m。VOX=1.4 なので 9マス弱だが、
   見上げた時の存在感を出すため 14×13×16 で作る */
function stampGodzilla(set,fill,ox,oy,oz){
  fill(ox,oy,oz,ox+13,oy,oz+8,1);                  // テラスの台座
  // ── 首（テラスから斜めに立ち上がる） ──
  for(let k=0;k<5;k++)
    fill(ox+4,oy+1+k,oz+1+k, ox+9,oy+3+k,oz+3+k, 21);
  // ── 頭蓋（後頭部が広く、鼻先へ絞る） ──
  fill(ox+3,oy+5,oz+4, ox+10,oy+10,oz+9, 21);      // 本体
  fill(ox+4,oy+6,oz+9, ox+9,oy+10,oz+11, 21);      // 中ほど
  fill(ox+5,oy+6,oz+11, ox+8,oy+9,oz+13, 21);      // 鼻梁
  fill(ox+5,oy+7,oz+13, ox+8,oy+8,oz+15, 21);      // 鼻先
  // ── 顎と歯 ──
  fill(ox+4,oy+5,oz+9, ox+9,oy+5,oz+14, 21);       // 下顎
  for(let z=oz+10;z<=oz+14;z+=2){                  // 牙（白く光る）
    set(ox+4,oy+6,z,17); set(ox+9,oy+6,z,17);
  }
  fill(ox+5,oy+6,oz+14, ox+8,oy+6,oz+14, 17);      // 前歯
  // ── 目（赤く光る。落ち窪んだ位置に） ──
  fill(ox+3,oy+9,oz+9, ox+3,oy+9,oz+10, 19);
  fill(ox+10,oy+9,oz+9, ox+10,oy+9,oz+10, 19);
  set(ox+2,oy+9,oz+9,21); set(ox+11,oy+9,oz+9,21); // 眼窩の縁
  // ── 眉の隆起 ──
  fill(ox+2,oy+10,oz+7, ox+11,oy+11,oz+10, 21);
  // ── 背びれ（後頭部から3列） ──
  for(let k=0;k<4;k++){
    const h=3-Math.floor(k/2);
    fill(ox+6,oy+11+k,oz+2+k, ox+7,oy+11+k+h,oz+3+k, 21);
  }
  // ── 首の鱗（縦の凹凸） ──
  for(let z=oz+2;z<=oz+6;z+=2){
    set(ox+3,oy+4,z,21); set(ox+10,oy+4,z,21);
  }
  // ── テラスの手すりと照明 ──
  for(let x=ox;x<=ox+13;x+=2) set(x,oy+1,oz,18);
  for(let x=ox+1;x<=ox+12;x+=4) set(x,oy+1,oz+8,16);
}
/* 新宿東宝ビル：低層部の屋上テラスにゴジラ */
/* 新宿東宝ビル（2015開業）
   実測：高さ130m / 地上30階
   特徴：低層(1-7F)は劇場の幕をモチーフにした外装。
        高層部(8-30F)はホテルで「1枚のモノリス」を立てたイメージ。
        客室の明滅する明かりをスクリーンのピクセルに見立てる。
        8階テラスに全長12mのゴジラヘッド（地上52m） */
function mkToho(fx,fz){
  const W=32, D=26;
  const H=93;                        // 130m ÷ VOX(1.4)
  const POD=17;                      // 8階テラス（地上約24m）
  const HH=H+14;
  return mkProp(fx,fz,W,HH,D,'toho',(set,fill)=>{
    const seedN=77;
    // ── 低層部（1-7F）：劇場の幕をモチーフに、縦の襞が走る ──
    for(let y=0;y<POD;y++){
      for(let z=1;z<D-1;z++) for(let x=1;x<W-1;x++){
        const edge=(x===1||x===W-2||z===1||z===D-2);
        if(!edge && y%4!==0) continue;
        let m;
        if(y<4) m=(y===3)?1:3;                     // 1-2階は店舗
        else if(y%4===0) m=1;
        else if(edge){
          // 幕の襞：3マス周期で凹凸を色で表現
          const along=(x===1||x===W-2)?z:x;
          m = (along%3===0) ? 26 : ((along%3===1) ? 13 : 12);
        } else m=0;
        set(x,y,z,m);
      }
      for(const cx2 of [1,W-2]) for(const cz2 of [1,D-2]) set(cx2,y,cz2,5);
    }
    // 低層部の屋上＝8階テラス
    fill(1,POD,1,W-2,POD,D-2,1);
    // ── 高層部：南側に寄せた「1枚のモノリス」 ──
    const MX0=3, MX1=W-4, MZ0=D-13, MZ1=D-3;
    for(let y=POD+1;y<H;y++){
      for(let z=MZ0;z<=MZ1;z++) for(let x=MX0;x<=MX1;x++){
        const edge=(x===MX0||x===MX1||z===MZ0||z===MZ1);
        if(!edge && y%4!==0) continue;
        let m;
        if(y%4===0) m=1;
        else if(edge){
          // 客室の窓が「スクリーンのピクセル」のように明滅する
          m = officeWin(x,y,z,seedN,4);
        } else m=0;
        set(x,y,z,m);
      }
      for(const cx2 of [MX0,MX1]) for(const cz2 of [MZ0,MZ1]) set(cx2,y,cz2,5);
    }
    fill(MX0,H,MZ0,MX1,H,MZ1,1);
    // 屋上の設備とアンテナ
    fill(MX0+4,H+1,MZ0+3,MX0+9,H+4,MZ0+7,25);
    for(let y=H+1;y<H+10;y++) set(MX1-3,y,MZ1-3,5);
    set(MX1-3,H+10,MZ1-3,19);
    // ── 8階テラスのゴジラヘッド（北側の空いた部分） ──
    stampGodzilla(set,fill, 6, POD, 2);
    // ── 低層部の大型看板（正面） ──
    for(let y=6;y<POD-2;y+=5)
      fill(2,y,0, W-3,y+2,0, (y%10===6)?7:11);
  });
}
/* 超高層タワー。鉄骨ラーメンでセットバックし、頂部に尖塔と航空障害灯 */
function mkMegaTower(fx,fz,fw,fd,H,seed){
  const seedN=(seed*0.83)%100;
  const M2=4;
  const W=fw+M2*2, D=fd+M2*2, HH=H+18;
  const vox=new Uint8Array(W*HH*D), hpv=new Uint16Array(W*HH*D);
  let live=0;
  const at=(x,y,z)=>x+W*(y+HH*z);
  const set=(x,y,z,m)=>{ if(!m||!(x>=0&&y>=0&&z>=0&&x<W&&y<HH&&z<D)) return;
    const i=at(x,y,z); if(!vox[i]) live++; vox[i]=m; hpv[i]=MATS[m].hp; };
  const fill=(x0,y0,z0,x1,y1,z1,m)=>{ for(let z=z0;z<=z1;z++) for(let y=y0;y<=y1;y++)
    for(let x=x0;x<=x1;x++) set(x,y,z,m); };
  let rs=(seed*2654435761)>>>0;
  const R=()=>{ rs=(rs*1664525+1013904223)>>>0; return rs/4294967296; };
  const ins=(y)=>{
    if(y>H*.86) return (fw>>2)+2;
    if(y>H*.68) return (fw>>3)+2;
    if(y>H*.44) return 2;
    return 0;
  };
  for(let y=0;y<H;y++){
    const q=ins(y);
    const X0=M2+q, X1=M2+fw-1-q, Z0=M2+q, Z1=M2+fd-1-q;
    if(X1<=X0||Z1<=Z0) break;
    const fl=(y%6===0);
    if(fl) fill(X0,y,Z0,X1,y,Z1,1);
    for(let z=Z0;z<=Z1;z++) for(let x=X0;x<=X1;x++){
      if(x!==X0&&x!==X1&&z!==Z0&&z!==Z1) continue;
      let m;
      if(y<7) m=(y===6)?1:5;
      else{
        const xf=(x===X0||x===X1), along=xf?(z-Z0):(x-X0);
        if(fl||along%4===0) m=5;
        else m=officeWin(x,y,z,seedN,3);
      }
      set(x,y,z,m);
    }
    set(X0,y,Z0,5); set(X1,y,Z0,5); set(X0,y,Z1,5); set(X1,y,Z1,5);
    const cx0=M2+(fw>>1)-1, cz0=M2+(fd>>1)-1;
    fill(cx0,y,cz0,cx0+2,y,cz0+2,5);
    if(y%22===12){ set(X0,y,Z0,19); set(X1,y,Z1,19); }
  }
  const q2=ins(H-1);
  fill(M2+q2,H,M2+q2,M2+fw-1-q2,H,M2+fd-1-q2,1);
  const cx=M2+(fw>>1), cz=M2+(fd>>1);
  fill(cx-3,H+1,cz-3,cx+3,H+4,cz+3,1);
  for(let y=H+1;y<H+16;y++) fill(cx-1,y,cz-1,cx+1,y,cz+1,5);
  for(let y=H+5;y<H+16;y+=4){ set(cx,y,cz-2,19); set(cx,y,cz+2,19); }
  fill(cx-1,H+16,cz-1,cx+1,H+17,cz+1,19);
  if(R()<.8) fill(M2+q2,H+2,M2+q2,M2+fw-1-q2,H+4,M2+q2,7);
  roofGear(set,fill,W,D,H,seed);        // ④ 冷却塔・ヘリポート・航空障害灯
  const b={ id:blds.length, ox:fx-M2*VOX, oy:0, oz:fz-M2*VOX, W:W,H:HH,D:D,
            vox:vox, hp:hpv, code:mkCode(vox,hpv), live:live, init:live,
            dirty:false, mdirty:false, mesh:null, style:'tower' };
  b.tint=randTint();
  computeBase(b);
  remesh(b); blds.push(b); totalVox+=live;
  return b;
}
/* 汎用の小物ビルダー。街路に置く独立オブジェクト用 */
function mkProp(fx,fz,W,HH,D,style,paint){
  const vox=new Uint8Array(W*HH*D), hpv=new Uint16Array(W*HH*D);
  let live=0;
  const set=(x,y,z,m)=>{ if(!m||!(x>=0&&y>=0&&z>=0&&x<W&&y<HH&&z<D)) return;
    const i=x+W*(y+HH*z); if(!vox[i]) live++; vox[i]=m; hpv[i]=MATS[m].hp; };
  const fill=(x0,y0,z0,x1,y1,z1,m)=>{ for(let z=z0;z<=z1;z++) for(let y=y0;y<=y1;y++)
    for(let x=x0;x<=x1;x++) set(x,y,z,m); };
  paint(set,fill);
  if(!live) return null;
  const b={ id:blds.length, ox:fx, oy:0, oz:fz, W:W,H:HH,D:D,
            vox:vox, hp:hpv, code:mkCode(vox,hpv), live:live, init:live,
            dirty:false, mdirty:false, mesh:null, style:style };
  b.tint=[1,1,1];
  computeBase(b);
  remesh(b); blds.push(b); totalVox+=live;
  return b;
}
/* 乗用車。along=1 で南北向き、0 で東西向き */
function mkCar(fx,fz,along,seed){
  const CB=[33,34,35,36,35,33,34];
  const sd=Math.abs(seed|0);
  const body=CB[sd%CB.length];
  const kind=sd%7;                       // 0-4:乗用車 5:バン 6:トラック
  const van=(kind===5), truck=(kind===6);
  // 実寸に近い比率：全長4.5m前後＝VOX1.4mなので12マス、全幅5マス
  const L= truck?16 : (van?14:12), Wd=5, H= truck?9 : (van?9:7);
  const W = along? Wd : L, D = along? L : Wd;
  return mkProp(fx,fz,W,H,D,'car',(set,fill)=>{
    const ax=(a2,b2)=>along?[b2,a2]:[a2,b2];
    const S2=(i,y,j,m)=>{ const c=ax(i,j); set(c[0],y,c[1],m); };
    const F2=(i0,y0,j0,i1,y1,j1,m)=>{
      for(let i=i0;i<=i1;i++) for(let y=y0;y<=y1;y++) for(let j=j0;j<=j1;j++) S2(i,y,j,m);
    };
    // ── タイヤ（車体より内側に、地面から浮かせない）──
    const wheelAt=(i)=>{
      for(let y=0;y<2;y++){ S2(i,y,0,35); S2(i,y,Wd-1,35); S2(i+1,y,0,35); S2(i+1,y,Wd-1,35); }
    };
    wheelAt(1); wheelAt(L-3);
    if(truck) wheelAt(L-6);
    // ── 床とサイドパネル（車体は地上2マスから）──
    F2(0,2,0, L-1,2, Wd-1, body);
    F2(0,3,0, L-1,3, 0, body);

function mkAlleyBuildings(x0,z0,x1,z1,seed){
  // 区画を2列に割り、その間に幅1.5マスの路地を通す
  const w=x1-x0, d=z1-z0;
  if(w<30||d<30) return false;
  const vertical=(w>d);
  const n=vertical? Math.max(2,Math.round(d/22)) : Math.max(2,Math.round(w/22));
  for(let side=0;side<2;side++){
    for(let k=0;k<n;k++){
      const fw=Math.max(5,Math.min(11, vertical? ((w/2-6)/VOX)|0 : ((w/n-3)/VOX)|0));
      const fd=Math.max(5,Math.min(11, vertical? ((d/n-3)/VOX)|0 : ((d/2-6)/VOX)|0));
      const px = vertical ? (side? x0+w/2+3 : x0+2) : (x0 + k*(w/n) + 1.5);
      const pz = vertical ? (z0 + k*(d/n) + 1.5) : (side? z0+d/2+3 : z0+2);
      const H=RI2(10,18);
      mkBuilding(px, pz, fw, fd, H, (Math.random()<.7)?'zakkyo':'shop',
                 (seed*13+k*7+side)|0,
                 {faces:[ vertical?(side?1:0):(side?3:2) ], dense:.98});
    }
  }
  return true;
}

function fillLot(x0,z0,x1,z1){

  const nx=Math.max(1,Math.round(w/27)), nz=Math.max(1,Math.round(d/27));

/* 新宿NSビル：中央が吹き抜けの巨大アトリウム（130m） */
function mkNS(fx,fz,H){
  const W=36, D=36, HH=H+14;
  return mkProp(fx,fz,W,HH,D,'tower',(set,fill)=>{
    const seedN=(fx*0.41+fz*0.83)%100;
    const IN=11;                       // 吹き抜けの内側
    for(let y=0;y<H;y++){
      for(let z=1;z<D-1;z++) for(let x=1;x<W-1;x++){
        const outer=(x===1||x===W-2||z===1||z===D-2);
        const inner=(x>=IN&&x<W-IN&&z>=IN&&z<D-IN);
        if(inner) continue;            // 中央は吹き抜け
        const innerEdge=(x===IN-1||x===W-IN||z===IN-1||z===D-IN);
        if(!outer&&!innerEdge&&y%6!==0) continue;
        let m;
        if(y<6) m=(y===5)?1:5;
        else if(y%6===0) m=1;
        else if(outer) m=(x%3===1||z%3===1)?25:officeWin(x,y,z,seedN,3);
        else if(innerEdge) m=3;        // アトリウム側は全面ガラス
        else m=0;
        set(x,y,z,m);
      }
      for(const cx2 of [1,W-2]) for(const cz2 of [1,D-2]) set(cx2,y,cz2,5);
    }
    // ガラスの大屋根
    for(let z=1;z<D-1;z++) for(let x=1;x<W-1;x++){
      const inner=(x>=IN&&x<W-IN&&z>=IN&&z<D-IN);
      set(x,H,z, inner?3:1);
    }
    for(let y=H+1;y<H+9;y++) set(W>>1,y,D>>1,5);
    set(W>>1,H+9,D>>1,19);
  });
}

/* モード学園コクーンタワー：繭形の曲面に斜めの網目（204m） */
function mkCocoon(fx,fz,H){
  const W=30, D=30, HH=H+12;
  return mkProp(fx,fz,W,HH,D,'tower',(set,fill)=>{
    const cx=W/2-.5, cz=D/2-.5;
    for(let y=0;y<H;y++){
      // 中央が膨らみ上下が絞れる「繭」
      const t=y/H;
      const R=6.5+Math.sin(t*Math.PI)*6.0;
      for(let z=0;z<D;z++) for(let x=0;x<W;x++){
        const d=Math.hypot(x-cx,z-cz);
        if(d>R) continue;
        const shell=(d>R-1.3);
        if(!shell && y%8!==0) continue;
        let m;
        if(y<6) m=(y===5)?1:5;
        else if(y%8===0) m=1;
        else {
          // 斜めの網目（コクーンの外装）
          const a=Math.atan2(z-cz,x-cx);
          const mesh=(Math.abs(((a*7+y*0.55)%2.0)) < 0.55);
          m = mesh ? 26 : 3;
        }
        set(x,y,z,m);
      }
    }
    for(let z=0;z<D;z++) for(let x=0;x<W;x++)
      if(Math.hypot(x-cx,z-cz)<=7) set(x,H,z,1);
    for(let y=H;y<H+9;y++) set(cx|0,y,cz|0,5);
    set(cx|0,H+9,cz|0,19);
  });
}

/* ⑦ 新宿中央公園：壊せる木と池、遊歩道 */
function mkPark(cx,cz,halfW,halfD){

  // 地面（芝）と池
  mkProp(cx-halfW, cz-halfD, W, 4, D, 'park',(set,fill)=>{
    const px=W*0.32, pz=D*0.58, pr=Math.min(W,D)*0.18;
    for(let z=0;z<D;z++) for(let x=0;x<W;x++){
      const d=Math.hypot(x-px,z-pz);
      if(d<pr) set(x,0,z,41);            // 池
      else if(Math.abs(d-pr)<1.6) set(x,0,z,1);
      else {
        // 遊歩道が斜めに走る
        const path=Math.abs((x*0.6+z*0.8)%14)<2.2;
        set(x,0,z, path?9:43);
      }
    }
  });
  // 樹木を散らす
  for(let k=0;k<40;k++){
    const a=Math.random()*6.283, r=Math.random();
    const tx=cx+Math.cos(a)*halfW*0.85*r, tz=cz+Math.sin(a)*halfD*0.85*r;
    mkTree(tx, tz, (tx+tz)|0);
  }

/* ② 耐爆構造のビル。
   すべてが同じように壊れると10棟目には飽きる。
   何発も要る代わりに、壊した時の手応えと得点が大きい建物を混ぜる */
function mkHardened(fx,fz,fw,fd,H,seed){
  const M2=3, W=fw+M2*2, HH=H+8, D=fd+M2*2;
  return mkProp(fx-M2*VOX, fz-M2*VOX, W, HH, D, 'hard',(set,fill)=>{
    const seedN=(seed*0.71)%100;
    const X0=M2, X1=M2+fw-1, Z0=M2, Z1=M2+fd-1;
    for(let y=0;y<H;y++){
      for(let z=Z0;z<=Z1;z++) for(let x=X0;x<=X1;x++){
        const edge=(x===X0||x===X1||z===Z0||z===Z1);
        // 内部にも格子状の耐力壁が通る（ただ厚いだけでなく構造で耐える）
        const inner=((x-X0)%5===0)||((z-Z0)%5===0);
        if(!edge && !inner && y%4!==0) continue;
        let m;
        if(y<6) m=42;                          // 基壇は全て耐爆躯体
        else if(y%4===0) m=42;                 // 床スラブ
        else if(edge){
          // 外壁：厚い躯体に細い窓（スリット）
          const along=(x===X0||x===X1)?z:x;
          m = (along%4===2 && y%4===2) ? 2 : 42;
        }
        else m=42;
      set(x,y,z,m);
      }
      // 四隅は特に太い
      for(const cx2 of [X0,X0+1,X1-1,X1]) for(const cz2 of [Z0,Z0+1,Z1-1,Z1]) set(cx2,y,cz2,42);
    }
    fill(X0,H,Z0,X1,H,Z1,42);
    // 屋上：厚い庇と航空障害灯
    fill(X0-1,H+1,Z0-1,X1+1,H+2,Z1+1,42);
    set(X0,H+3,Z0,19); set(X1,H+3,Z1,19);
    // 目印になる赤いストライプ（狙う価値がある建物だと分かる）
    for(let y=8;y<H-2;y+=9)
      for(let x=X0;x<=X1;x++){ set(x,y,Z0-1,7); set(x,y,Z1+1,7); }
  });
}
/* ① 超高層の足元。実際の西新宿はタワーが地面から直接生えておらず、
   2〜4階の基壇（低層部）と人工地盤が周囲を巡る */
function mkPodium(cx,cz,halfW,halfD,seed){
  const W=Math.ceil(halfW*2/VOX)+8, D=Math.ceil(halfD*2/VOX)+8;

        const edge=(x===0||x===W-1||z===0||z===D-1);
        if(!edge && y%3!==0) continue;
        let m;
        if(y===0) m=1;
        else if(y<3) m=(x%4===0||z%4===0)?5:3;     // 1階はガラスと柱
        else if(y%3===0) m=1;
        else m=(edge)?((x+z+y)%5<3?13:2):0;
        set(x,y,z,m);
      }
    }
    fill(0,H,0,W-1,H,D-1,1);                       // 屋上＝人工地盤
    // 手すり
    for(let x=0;x<W;x++){ set(x,H+1,0,18); set(x,H+1,D-1,18); }
    for(let z=0;z<D;z++){ set(0,H+1,z,18); set(W-1,H+1,z,18); }
    // 植栽と設備
    for(let k=0;k<8;k++){
      const px=2+((Math.random()*(W-4))|0), pz=2+((Math.random()*(D-4))|0);
      set(px,H+1,pz,20);
    }
  });
}
/* ④ 屋上設備。冷却塔・ヘリポート・航空障害灯 */
function roofGear(set,fill,W,D,H,seed){
  const cx=W>>1, cz=D>>1;
  // 冷却塔（箱が数個並ぶ）
  const n=2+((seed|0)%3);
  for(let k=0;k<n;k++){
    const px=3+k*5, pz=3+((k*7)%Math.max(1,D-8));
    if(px+3>=W||pz+3>=D) continue;
    fill(px,H+1,pz,px+3,H+4,pz+3,25);
    for(let x=px;x<=px+3;x++) set(x,H+5,pz+1,5);   // ファンの覆い
  }
  // ヘリポート：円形の縁とH
  const R=Math.min(7, Math.min(W,D)/2-3);
  if(R>=5){
    const hx=W-R-3, hz=D-R-3;
    for(let a=0;a<64;a++){
      const th=a/64*6.283;
      const x=(hx+Math.cos(th)*R)|0, z=(hz+Math.sin(th)*R)|0;
      if(x>0&&x<W&&z>0&&z<D) set(x,H+1,z,16);

/* オフィスビルの窓明かり。
   実際の夜景は「点いている階」と「消えている階」がまとまって現れ、
   同じ階でも部屋ごとに欠ける。ボクセル単位の乱数だと均一に光って嘘になる */
function officeWin(x,y,z,seed,floorH){
  const fl=Math.floor(y/(floorH||3));
  // フロアごとの点灯率（0〜1）。階によって大きく変わる
  const fs=Math.sin(fl*12.9898+seed*78.233)*43758.5453;
  const lit=(fs-Math.floor(fs));
  if(lit<0.42) return 2;                      // この階は消灯
  const density = lit<0.62 ? 0.30 : (lit<0.84 ? 0.55 : 0.78);
  // 同じ階の中でも部屋単位で欠ける
  const rs=Math.sin((x*3.1+z*7.7+fl*5.3)*12.9898+seed)*43758.5453;
  return ((rs-Math.floor(rs)) < density) ? 4 : 2;
}

/* 東京都庁 第一本庁舎：243m。途中で2つの塔に分かれるのが特徴 */
/* 東京都庁 第一本庁舎（丹下健三・1990）
   実測：高さ243.4m / 48階 / 幅110m
   特徴：地上150m地点で二手に分かれる双塔。
        上部の塔は低層部に対して45度交差する。
        四隅に非常階段やダクトが入るシャフト（スーパー柱）。
        外装は2種類の水磨き花崗岩によるコンピュータチップ状の市松 */
function mkMetroGov(fx,fz){
  const W=48, D=34;
  const H=174;                       // 243m ÷ VOX(1.4)
  const SPLIT=107;                   // 150m地点で分岐
  const HH=H+26;
  return mkProp(fx,fz,W,HH,D,'tower',(set,fill)=>{
    const seedN=(fx*0.13+fz*0.59)%100;
    const cx=W/2, cz=D/2;
    // ── 低層部（分岐まで）──
    for(let y=0;y<SPLIT;y++){
      for(let z=2;z<D-2;z++) for(let x=2;x<W-2;x++){
        const edge=(x===2||x===W-3||z===2||z===D-3);
        if(!edge && y%8!==0) continue;
        let m;
        if(y<10) m=(y===9)?1:5;                    // ピロティ
        else if(y%8===0) m=1;                      // 床スラブ
        else {
          // コンピュータチップ状の市松（3マス角の升目）
          const gx=Math.floor((x-2)/3), gz=Math.floor((z-2)/3), gy=Math.floor(y/8);
          m = ((gx+gz+gy)%2===0) ? 26 : officeWin(x,y,z,seedN,8);
        }
        set(x,y,z,m);
      }
      // 四隅のスーパー柱（シャフト）
      for(const px of [2,3,W-4,W-3]) for(const pz of [2,3,D-4,D-3]) set(px,y,pz,26);
    }
    // ── 上部の双塔（低層部に対して45度交差）──
    // 45度回転した矩形を、回転座標で判定して積む
    const towers=[[-11,0],[11,0]];               // 中心から左右に離れた2本
    const half=7.5;                              // 塔の半幅
    for(let y=SPLIT;y<H;y++){
      for(const t of towers){
        for(let z=0;z<D;z++) for(let x=0;x<W;x++){
          // 45度回転した座標系での位置
          const dx=x-cx-t[0], dz=z-cz-t[1];
          const rx=(dx+dz)*0.7071, rz=(dz-dx)*0.7071;
          if(Math.abs(rx)>half||Math.abs(rz)>half) continue;
          const edge=(Math.abs(rx)>half-1.3||Math.abs(rz)>half-1.3);
          if(!edge && y%8!==0) continue;
          let m;
          if(y%8===0) m=1;
          else {
            const gy=Math.floor(y/8);
            const gx2=Math.floor((rx+half)/2.5), gz2=Math.floor((rz+half)/2.5);
            m = ((gx2+gz2+gy)%2===0) ? 26 : officeWin(x,y,z,seedN,8);
          }
          set(x,y,z,m);
        }
      }
    }
    // ── 45階の展望室（両塔）──
    for(const t of towers){
      const oy=H-14;
      for(let y=oy;y<oy+5;y++)
        for(let z=0;z<D;z++) for(let x=0;x<W;x++){
          const dx=x-cx-t[0], dz=z-cz-t[1];
          const rx=(dx+dz)*0.7071, rz=(dz-dx)*0.7071;
          if(Math.abs(rx)>half+1||Math.abs(rz)>half+1) continue;
          if(Math.abs(rx)>half||Math.abs(rz)>half) set(x,y,z,3);   // 張り出したガラス
        }
    }
    // ── 塔頂とアンテナ ──
    for(const t of towers){
      const px=Math.round(cx+t[0]), pz=Math.round(cz+t[1]);
      for(let z=pz-5;z<=pz+5;z++) for(let x=px-5;x<=px+5;x++){
        const dx=x-px, dz=z-pz;
        const rx=(dx+dz)*0.7071, rz=(dz-dx)*0.7071;
        if(Math.abs(rx)>half||Math.abs(rz)>half) continue;
        set(x,H,z,1);
      }
      for(let y=H;y<H+18;y++){ set(px,y,pz,5); set(px+1,y,pz,5); }
      for(let y=H+6;y<H+18;y+=4){ set(px,y,pz-1,19); set(px+1,y,pz+1,19); }
      set(px,H+18,pz,19); set(px+1,H+18,pz,19);
    }
    // ── 双塔を繋ぐ空中の渡り廊下 ──
    for(let k=0;k<3;k++){
      const by=SPLIT+Math.floor((H-SPLIT)*(0.20+k*0.28));
      fill(Math.round(cx-9),by,Math.round(cz-2), Math.round(cx+9),by+2,Math.round(cz+2), 5);

      }
    }
  });
}

/* SHIBUYA109（1979開業）
   実測：地下2階〜地上8階
   特徴：道玄坂と文化村通りの分岐点に建つ「鋭角の角地」。

function mk109(fx,fz){
  const W=30, D=30, H=30, HH=H+22;

    // 鋭角の角地：2本の道が作る楔形。角は丸める
    const inShape=(x,z,shrink)=>{
      const s2=shrink||0;
      // 道玄坂側(西)と文化村通り側(南東)の2辺、そして背面
      const a1 = (x*0.95 + z*0.30);            // 一辺
      const a2 = (x*0.20 - z*0.98);            // もう一辺
      if(a1 < 6+s2) return false;
      if(a2 < -22+s2) return false;
      if(x > W-3-s2) return false;
      if(z > D-3-s2) return false;
      // 先端の角を丸める
      const tipx=8, tipz=D-9;
      const d=Math.hypot(x-tipx, z-tipz);
      if(x<12 && z>D-13 && d>7-s2) return false;
      return true;
    };
    for(let y=0;y<H;y++){
      for(let z=0;z<D;z++) for(let x=0;x<W;x++){
        if(!inShape(x,z,0)) continue;
        const shell=!inShape(x,z,1.4);
        if(!shell && y%4!==0) continue;
        let m;
        if(y<5) m=(y===4)?1:3;                 // 1階は全面ガラス
        else if(y%4===0) m=1;
        else {
          // 白い帯と窓が水平に交互（109の外観）
          m = (Math.floor(y/4)%2===0) ? 12 : 3;
        }
        set(x,y,z,m);
      }
    }
    // 屋上
    for(let z=0;z<D;z++) for(let x=0;x<W;x++) if(inShape(x,z,0)) set(x,H,z,1);
    // 先端に立つシリンダー広告塔（109の象徴）
    const tipx=9, tipz=D-10, R=5;
    for(let y=H+1;y<H+16;y++)
      for(let z=tipz-R;z<=tipz+R;z++) for(let x=tipx-R;x<=tipx+R;x++){
        const d=Math.hypot(x-tipx,z-tipz);
        if(d>R||d<R-1.5) continue;
        set(x,y,z, (y<H+13)?7:16);
      }
    // シリンダーの天面と航空障害灯
    for(let z=tipz-R;z<=tipz+R;z++) for(let x=tipx-R;x<=tipx+R;x++)
      if(Math.hypot(x-tipx,z-tipz)<=R) set(x,H+16,z,1);
    for(let y=H+17;y<H+21;y++) set(tipx,y,tipz,5);
    set(tipx,H+21,tipz,19);
    // 壁面のシリンダー広告（交差点側）
    for(let y=6;y<H-2;y+=6)
      for(let z=D-14;z<D-4;z++)

/* ③ 街路樹。西新宿の中央通りは銀杏並木、渋谷にもケヤキがある */
function mkTree(fx,fz,seed){
  const W=7, D=7, H=13;
  return mkProp(fx,fz,W,H,D,'tree',(set,fill)=>{
    const cx=3, cz=3;
    // 幹
    for(let y=0;y<7;y++) set(cx,y,cz,44);
    set(cx,3,cz+1,44); set(cx,5,cz-1,44);
    // 樹冠：縦長の楕円（銀杏の形）
    const sd=Math.abs(seed|0)%3;
    const rx=2.2+sd*0.3, ry=3.6, rz=2.2+sd*0.3;
    for(let y=6;y<12;y++) for(let z=0;z<D;z++) for(let x=0;x<W;x++){
      const dx=(x-cx)/rx, dy=(y-9)/ry, dz=(z-cz)/rz;
      if(dx*dx+dy*dy+dz*dz>1) continue;
      if(Math.random()<0.18) continue;      // 葉に隙間を作る
      set(x,y,z,43);
    }
  });
}

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
/* 街の生成。seed を渡せば同じ街になる（「同じ街に再挑戦」）。省略すると新しい seed */

/* 路面に落ちる光。街灯とネオンの足元を1枚のメッシュで照らす */
let glowFloor=null, glowMat=null;
function buildGlowFloor(){
  if(glowFloor){ scene.remove(glowFloor); glowFloor.geometry.dispose(); glowFloor=null; }
  const P=[],C=[],U=[],I=[];
  const add=(x,z,r,cr,cg,cb)=>{
    const b=P.length/3;
    P.push(x-r,.34,z-r, x+r,.34,z-r, x+r,.34,z+r, x-r,.34,z+r);
    U.push(0,0, 1,0, 1,1, 0,1);
    for(let k=0;k<4;k++) C.push(cr,cg,cb);
    I.push(b,b+1,b+2, b,b+2,b+3);
  };
  for(let i=0;i<lampPos.length;i+=3) add(lampPos[i],lampPos[i+2],30,.55,.44,.26);
  // ネオンの多いビルの足元を、その基調色で照らす
  for(let k=0;k<blds.length;k++){
    const b=blds[k];
    if(b.style==='pole'||b.style==='rail') continue;
    let best=0,bc=0;
    const tally={};
    for(let i=0;i<b.vox.length;i++){
      const m=b.vox[i];
      if(m===7||m===8||m===11||m===16||m===17){ tally[m]=(tally[m]||0)+1; }
    }
    for(const m in tally) if(tally[m]>bc){ bc=tally[m]; best=+m; }
    if(bc<14) continue;
    const M=MATS[best], f=Math.min(.42,bc*.0022);
    add(b.ox+b.W*VOX/2, b.oz+b.D*VOX/2, Math.max(b.W,b.D)*VOX*.85,
        M.r*f, M.g*f, M.b*f);
  }
  if(!P.length) return;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));
  g.setIndex(I); g.computeBoundingSphere();
  if(!glowMat) glowMat=new THREE.MeshBasicMaterial({
    map:radialTex('255,255,255',true), vertexColors:true, transparent:true,
    blending:THREE.AdditiveBlending, depthWrite:false, fog:true});
  glowFloor=new THREE.Mesh(g,glowMat);
  scene.add(glowFloor);
}
/* 電線：電柱の間に張る */
let wires=null;
function buildWires(){
  if(wires){ scene.remove(wires); wires.geometry.dispose(); wires.material.dispose(); wires=null; }
  const pts=[];
  const n=lampPos.length/3;
  for(let i=0;i<n;i++){
    const ax=lampPos[i*3], ay=lampPos[i*3+1], az=lampPos[i*3+2];
    for(let j=i+1;j<n;j++){
      const bx=lampPos[j*3], by=lampPos[j*3+1], bz=lampPos[j*3+2];
      const d=Math.hypot(bx-ax,bz-az);
      if(d>150||d<20) continue;
      if(Math.abs(bx-ax)>12 && Math.abs(bz-az)>12) continue;   // 直線的に並ぶ電柱だけ
      const SEG=6, sag=d*.055;
      for(let k=0;k<SEG;k++){
        const t0=k/SEG, t1=(k+1)/SEG;
        const y0=ay-Math.sin(t0*Math.PI)*sag, y1=ay-Math.sin(t1*Math.PI)*sag;
        pts.push(ax+(bx-ax)*t0, y0, az+(bz-az)*t0,
                 ax+(bx-ax)*t1, y1, az+(bz-az)*t1);
      }
    }
  }
  if(!pts.length) return;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  g.computeBoundingSphere();
  wires=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x0a0c10,fog:true}));
  scene.add(wires);
}
/* ネオンの光暈。発光ボクセルを4×4×4の塊にまとめ、1枚のPointsで柔らかく光らせる */
let haloObj=null, haloGeo=null, haloCol=null, haloSize=null, halos=[], haloOfBld={}, haloMat=null;
const HCB=4;
function buildHalos(){
  if(haloObj){ scene.remove(haloObj); haloObj.geometry.dispose(); haloObj=null; }
  halos=[]; haloOfBld={};
  const P=[],C=[],S2=[];
  for(let k=0;k<blds.length;k++){
    const b=blds[k];
    const map=new Map();
    for(let z=0;z<b.D;z++) for(let y=0;y<b.H;y++){
      const row=b.W*(y+b.H*z);
      for(let x=0;x<b.W;x++){
        const m=b.vox[row+x];
        if(!m||!MATS[m].emis) continue;
        const key=((x/HCB)|0)*1e6+((y/HCB)|0)*1e3+((z/HCB)|0)+m*1e9;
        let e=map.get(key);
        if(!e){ e={n:0,sx:0,sy:0,sz:0,m:m,cx:(x/HCB)|0,cy:(y/HCB)|0,cz:(z/HCB)|0}; map.set(key,e); }
        e.n++; e.sx+=x; e.sy+=y; e.sz+=z;
      }
    }
    const list=[];
    map.forEach(e=>{
      const M=MATS[e.m], idx=halos.length;
      P.push(b.ox+(e.sx/e.n+.5)*VOX, (e.sy/e.n+.5)*VOX, b.oz+(e.sz/e.n+.5)*VOX);
      const f=Math.min(1,.30+e.n*.075);
      C.push(M.r*f,M.g*f,M.b*f);
      S2.push(7+Math.min(20,e.n*1.7));
      halos.push({b:b,cx:e.cx,cy:e.cy,cz:e.cz,m:e.m,n0:e.n,r:M.r,g:M.g,bl:M.b});
      list.push(idx);
    });
    if(list.length) haloOfBld[b.id]=list;
  }
  if(!P.length) return;
  haloCol=new Float32Array(C); haloSize=new Float32Array(S2);
  haloGeo=new THREE.BufferGeometry();
  haloGeo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  haloGeo.setAttribute('acolor',new THREE.BufferAttribute(haloCol,3));
  haloGeo.setAttribute('size',new THREE.BufferAttribute(haloSize,1));

/* 建物が壊れたら、その建物ぶんの光暈だけ数え直す */
function refreshHalos(b){
  const list=haloOfBld[b.id];
  if(!list||!haloCol) return;
  for(let i=0;i<list.length;i++){
    const h=halos[list[i]];
    let n=0;
    const x0=h.cx*HCB, y0=h.cy*HCB, z0=h.cz*HCB;
    for(let z=z0;z<z0+HCB&&z<b.D;z++) for(let y=y0;y<y0+HCB&&y<b.H;y++){
      const row=b.W*(y+b.H*z);
      for(let x=x0;x<x0+HCB&&x<b.W;x++) if(b.vox[row+x]===h.m) n++;
    }
    const f=n?Math.min(1,.30+n*.075):0;
    const j=list[i]*3;
    haloCol[j]=h.r*f; haloCol[j+1]=h.g*f; haloCol[j+2]=h.bl*f;
  }
  haloGeo.attributes.acolor.needsUpdate=true;
}

let blackout=false;
function empBlackout(){
  if(blackout) return 0;
  blackout=true;
  cityPowerT=0.22;                   // 路面の光も落ちる
  let n=0;
  // ① 街灯
  if(lampObj&&lampPos.length){
    const col=lampObj.geometry.attributes.color || lampObj.geometry.attributes.acolor;
    if(col){
      for(let i=0;i<col.array.length;i++) col.array[i]=0;
      col.needsUpdate=true;
      n+=lampPos.length/3;
    }
  }
  // ② ネオンの光暈
  if(haloCol&&haloGeo){
    for(let i=0;i<haloCol.length;i++) haloCol[i]=0;
    haloGeo.attributes.acolor.needsUpdate=true;
    n+=haloCol.length/3;
  }
  // ③ 路面に落ちる光
  if(glowFloor) glowFloor.visible=false;
  // ④ 発光ボクセル自体を消す（窓・ネオン・看板が黒くなる）
  for(let k=0;k<blds.length;k++){
    const b=blds[k];
    let touched=false;
    for(let i=0;i<b.vox.length;i++){
      const m=b.vox[i];
      if(!m||!MATS[m].emis) continue;
      // 消灯した窓＝暗い窓(2)に置き換える。壊さない
      b.vox[i]=2; b.hp[i]=MATS[2].hp;
      const nc=codeOf(2,b.hp[i]);
      if(nc!==b.code[i]){ b.code[i]=nc; touched=true; n++; }
    }
    if(touched){
      b.mdirty=true;
      if(b.sec) for(const sc of b.sec) sc.dirty=true;
    }
  }
  return n;
}
function killLampsNear(x,z,rad){
  if(!lampObj||!lampPos.length) return;
  // 街灯は PointsMaterial + vertexColors なので属性名は 'color'
  const col=lampObj.geometry.attributes.color || lampObj.geometry.attributes.acolor;
  if(!col) return;
  let hit=false;
  for(let i=0;i<lampPos.length;i+=3){
    const dx=lampPos[i]-x, dz=lampPos[i+2]-z;
    if(dx*dx+dz*dz>rad*rad) continue;
    if(col.array[i]===0&&col.array[i+1]===0&&col.array[i+2]===0) continue;
    col.array[i]=0; col.array[i+1]=0; col.array[i+2]=0;
    hit=true;
  }
  if(hit){ col.needsUpdate=true; flashDom(.05); }
}

  { const im=g.getImageData(0,0,S,S), d=im.data;

/* ══════════ ワールド照会（空間グリッド） ══════════ */
const GC=64, GX0=-1200, GZ0=-1200, GNX=Math.ceil(2400/GC), GNZ=Math.ceil(2400/GC);
let sgrid=null;
function buildGrid(){
  sgrid=new Array(GNX*GNZ);
  for(let k=0;k<blds.length;k++){
    const b=blds[k];
    const x0=Math.max(0,((b.ox-GX0)/GC)|0), x1=Math.min(GNX-1,((b.ox+b.W*VOX-GX0)/GC)|0);
    const z0=Math.max(0,((b.oz-GZ0)/GC)|0), z1=Math.min(GNZ-1,((b.oz+b.D*VOX-GZ0)/GC)|0);
    for(let z=z0;z<=z1;z++) for(let x=x0;x<=x1;x++){
      const i=x+z*GNX; if(!sgrid[i]) sgrid[i]=[]; sgrid[i].push(b);
    }
  }
}
function cellAt(wx,wz){
  const x=((wx-GX0)/GC)|0, z=((wz-GZ0)/GC)|0;
  if(x<0||z<0||x>=GNX||z>=GNZ) return null;
  return sgrid[x+z*GNX];
}
function bldAt(wx,wy,wz){
  if(wy<0) return null;
  const list=cellAt(wx,wz); if(!list) return null;
  for(let k=0;k<list.length;k++){
    const b=list[k];
    if(wx<b.ox||wz<b.oz) continue;
    const lx=((wx-b.ox)/VOX)|0, ly=(wy/VOX)|0, lz=((wz-b.oz)/VOX)|0;
    if(lx>=b.W||ly>=b.H||lz>=b.D) continue;
    if(b.vox[lx+b.W*(ly+b.H*lz)]) return {b:b,x:lx,y:ly,z:lz};
  }
  return null;
}
function solidAt(wx,wy,wz){ return !!bldAt(wx,wy,wz); }

function killVoxel(b,x,y,z,quiet){
  const i=x+b.W*(y+b.H*z), m=b.vox[i];

  markSec(b,y);
  { // 欠けた縁：隣のボクセルを損傷段階1まで傷める。穴や切断面の周りに「割れた帯」ができ、素材と壊れ方が読める
    const W=b.W, Hh=b.H, hp=b.hp, vx=b.vox, cd=b.code, WH=W*Hh;

      else if(k===2){ if(y===0) continue; j=i-W; } else if(k===3){ if(y===Hh-1) continue; j=i+W; }
      else if(k===4){ j=i-WH; if(j<0) continue; } else { j=i+WH; if(j>=vx.length) continue; }
      const mm=vx[j]; if(!mm||M_EMIS[mm]) continue;
      const lim=(MATS[mm].hp*0.70)|0;

    if(L0) b.lean=[L0.dx,L0.dz,L0.mag];

      efx('ball',px,py,pz, 2, 26, .22, 0x9fe8ff, .9);

                  t:9+Math.random()*10, r:7+Math.random()*7, src:(KSRC==='nuke'?'nuke':'fire')});
      for(let q=0;q<10 && gxA.length<650;q++)

      for(let q=0;q<6 && fx.length<FXCAP-20;q++)

  // 窓ガラスは砕けて、回転しながらきらめく板になる
  if(!quiet && (m===2||m===3||m===4) && Math.random()<.16){
    const px=b.ox+x*VOX+VOX/2, py=y*VOX+VOX/2, pz=b.oz+z*VOX+VOX/2;
    spawnDebris(px,py,pz,MATS[2],1.1); spawnDebris(px,py,pz,MATS[2],.8);

}
function hitVoxel(b,x,y,z,dmg){
  const i=x+b.W*(y+b.H*z), m=b.vox[i];
  if(!m) return 0;
  const h=b.hp[i]-dmg;
  if(h<=0) return killVoxel(b,x,y,z);

function candNear(wx,wz,rad){
  if(!sgrid) return blds;
  const gx0=Math.max(0,((wx-rad-GX0)/GC)|0), gx1=Math.min(GNX-1,((wx+rad-GX0)/GC)|0);
  const gz0=Math.max(0,((wz-rad-GZ0)/GC)|0), gz1=Math.min(GNZ-1,((wz+rad-GZ0)/GC)|0);
  if(gx1<gx0||gz1<gz0) return blds;
  // 範囲が広すぎる時は全件のほうが速い
  if((gx1-gx0+1)*(gz1-gz0+1) > GNX*GNZ*0.5) return blds;
  _candBuf.length=0; _candMark.clear();
  for(let gz=gz0;gz<=gz1;gz++) for(let gx=gx0;gx<=gx1;gx++){
    const cell=sgrid[gx+gz*GNX];
    if(!cell) continue;
    for(let q=0;q<cell.length;q++){
      const b=cell[q];
      if(_candMark.has(b.id)) continue;
      _candMark.add(b.id); _candBuf.push(b);
    }
  }
  return _candBuf;
}
function damageSphere(wx,wy,wz,rad,pow,cand,inner,falloff){
  let n=0;
  const arr=cand||candNear(wx,wz,rad);
  const fr=falloff||rad;
  for(let k=0;k<arr.length;k++){
    const b=arr[k];
    const bw=b.W*VOX, bh=b.H*VOX, bd=b.D*VOX;
    if(wx+rad<b.ox||wx-rad>b.ox+bw) continue;
    if(wz+rad<b.oz||wz-rad>b.oz+bd) continue;
    if(wy+rad<0||wy-rad>bh) continue;
    if(inner){   // 衝撃波の内側に丸ごと入った建物は済んでいるので飛ばす
      const fx=Math.max(Math.abs(wx-b.ox),Math.abs(wx-(b.ox+bw)));
      const fy=Math.max(Math.abs(wy),Math.abs(wy-bh));
      const fz=Math.max(Math.abs(wz-b.oz),Math.abs(wz-(b.oz+bd)));
      if(fx*fx+fy*fy+fz*fz < inner*inner) continue;
    }
    const x0=Math.max(0,((wx-rad-b.ox)/VOX)|0), x1=Math.min(b.W-1,((wx+rad-b.ox)/VOX)|0);
    const y0=Math.max(0,((wy-rad)/VOX)|0),       y1=Math.min(b.H-1,((wy+rad)/VOX)|0);
    const z0=Math.max(0,((wz-rad-b.oz)/VOX)|0), z1=Math.min(b.D-1,((wz+rad-b.oz)/VOX)|0);
    for(let z=z0;z<=z1;z++) for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
      const i=x+b.W*(y+b.H*z); if(!b.vox[i]) continue;
      const dx=b.ox+x*VOX+1-wx, dy=y*VOX+1-wy, dz=b.oz+z*VOX+1-wz;
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d>rad || (inner&&d<inner)) continue;
      n+=hitVoxel(b,x,y,z,pow*Math.max(.12,1-d/fr)*(.72+grnd()*.56));
    }
  }
  return n;
}
function damageColumn(wx,wz,rad,pow,y0,y1){
  let n=0;
  for(let k=0;k<blds.length;k++){
    const b=blds[k];
    if(wx+rad<b.ox||wx-rad>b.ox+b.W*VOX) continue;
    if(wz+rad<b.oz||wz-rad>b.oz+b.D*VOX) continue;
    const x0=Math.max(0,((wx-rad-b.ox)/VOX)|0), x1=Math.min(b.W-1,((wx+rad-b.ox)/VOX)|0);
    const z0=Math.max(0,((wz-rad-b.oz)/VOX)|0), z1=Math.min(b.D-1,((wz+rad-b.oz)/VOX)|0);
    const ya=Math.max(0,(y0/VOX)|0), yb=Math.min(b.H-1,(y1/VOX)|0);
    for(let z=z0;z<=z1;z++) for(let x=x0;x<=x1;x++){
      const dx=b.ox+x*VOX+1-wx, dz=b.oz+z*VOX+1-wz;
      if(Math.sqrt(dx*dx+dz*dz)>rad) continue;
      for(let y=ya;y<=yb;y++) n+=hitVoxel(b,x,y,z,pow);
    }
  }
  return n;
}
/* 面切断：カメラと2本の視線で決まる平面のうち、なぞった扇形の範囲だけを断ち切る */
function damagePlane(ox,oy,oz,dA,dB,maxR,thick){
  let nx=dA[1]*dB[2]-dA[2]*dB[1], ny=dA[2]*dB[0]-dA[0]*dB[2], nz=dA[0]*dB[1]-dA[1]*dB[0];
  const nl=Math.hypot(nx,ny,nz);
  if(nl<1e-4) return 0;
  nx/=nl; ny/=nl; nz/=nl;
  // 扇形の境界：wA は dB 側、wB は dA 側を向く
  const wAx=ny*dA[2]-nz*dA[1], wAy=nz*dA[0]-nx*dA[2], wAz=nx*dA[1]-ny*dA[0];
  const wBx=dB[1]*nz-dB[2]*ny, wBy=dB[2]*nx-dB[0]*nz, wBz=dB[0]*ny-dB[1]*nx;
  const N=[nx,ny,nz], WA=[wAx,wAy,wAz], WB=[wBx,wBy,wBz], O=[ox,oy,oz];
  // 法線の支配軸を選び、残る2軸を走査して支配軸は「解く」
  // （全ボクセル走査だと1棟あたり数万回になるので、平面が通る数セルだけ見る）
  const an=[Math.abs(nx),Math.abs(ny),Math.abs(nz)];
  const d=(an[1]>=an[0]&&an[1]>=an[2])?1:((an[0]>=an[2])?0:2);
  const u=(d+1)%3, v=(d+2)%3;
  const nU=N[u], nV=N[v], nD=N[d], invND=1/nD;
  const aU=WA[u], aV=WA[v], aD=WA[d];
  const bU=WB[u], bV=WB[v], bD=WB[d];
  const half=thick/(VOX*an[d])+1.25;
  const R2=maxR*maxR;
  let n=0;
  for(let k=0;k<blds.length;k++){
    const b=blds[k];
    const bw=b.W*VOX, bh=b.H*VOX, bd=b.D*VOX;
    const ccx=b.ox+bw/2-ox, ccy=bh/2-oy, ccz=b.oz+bd/2-oz;
    const dpc=ccx*nx+ccy*ny+ccz*nz;
    const rr=(bw/2)*an[0]+(bh/2)*an[1]+(bd/2)*an[2];
    if(Math.abs(dpc)>thick+rr) continue;                       // 平面スラブと交わらない
    if(ccx*ccx+ccy*ccy+ccz*ccz > (maxR+rr)*(maxR+rr)) continue;
    const base=[b.ox,0,b.oz], dim=[b.W,b.H,b.D], St=[1,b.W,b.W*b.H];
    const baseU=base[u], baseV=base[v], baseD=base[d];
    const dimU=dim[u], dimV=dim[v], dimD=dim[d];
    const stU=St[u], stV=St[v], stD=St[d];
    const oU=O[u], oV=O[v], oD=O[d];
    for(let iu=0;iu<dimU;iu++){
      const pu=baseU+iu*VOX+1-oU, nupu=nU*pu;
      const iuB=iu*stU;
      for(let iv=0;iv<dimV;iv++){
        const pv=baseV+iv*VOX+1-oV;
        const pdOnPlane=-(nupu+nV*pv)*invND;                    // 平面上の支配軸成分
        const cd=(pdOnPlane+oD-baseD-1)/VOX;
        let a=Math.floor(cd-half), e=Math.ceil(cd+half);
        if(a<0) a=0;
        if(e>dimD-1) e=dimD-1;
        if(a>e) continue;
        const ib=iuB+iv*stV;
        for(let id=a;id<=e;id++){
          const i=ib+id*stD;
          if(!b.vox[i]) continue;
          const pd=baseD+id*VOX+1-oD;
          const dp=nupu+nV*pv+nD*pd;
          if(dp>thick||dp<-thick) continue;
          const l2=pu*pu+pv*pv+pd*pd;
          if(l2>R2) continue;
          const tol=-0.05*Math.sqrt(l2);
          if(aU*pu+aV*pv+aD*pd < tol) continue;
          if(bU*pu+bV*pv+bD*pd < tol) continue;
          let X,Y,Z;
          if(d===0){ X=id; Y=iu; Z=iv; }
          else if(d===1){ X=iv; Y=id; Z=iu; }
          else { X=iu; Y=iv; Z=id; }
          n+=killVoxel(b,X,Y,Z,true);
        }
      }
    }
  }
  // 落下中の塊も切る
  for(let k=0;k<chunks.length;k++){
    const c=chunks[k];
    const vx=c.p[0]-ox, vy=c.p[1]-oy, vz=c.p[2]-oz;
    const dp=vx*nx+vy*ny+vz*nz;
    const rad=Math.hypot(c.h[0],c.h[1],c.h[2]);
    if(Math.abs(dp)>thick+rad) continue;
    if(vx*wAx+vy*wAy+vz*wAz < -rad) continue;
    if(vx*wBx+vy*wBy+vz*wBz < -rad) continue;
    damageChunk(c, ox+vx-dp*nx, oy+vy-dp*ny, oz+vz-dp*nz, rad*.9, 9999);
  }
  return n;
}
/* 水平スラブ切断（FIREボタン用の簡易版） */
function damageSlab(wy,thick,cx,cz,rad){
  let n=0;
  for(let k=0;k<blds.length;k++){
    const b=blds[k];
    if(cx+rad<b.ox||cx-rad>b.ox+b.W*VOX) continue;
    if(cz+rad<b.oz||cz-rad>b.oz+b.D*VOX) continue;
    const ya=Math.max(0,((wy-thick/2)/VOX)|0), yb=Math.min(b.H-1,((wy+thick/2)/VOX)|0);
    if(yb<ya) continue;
    for(let y=ya;y<=yb;y++) for(let z=0;z<b.D;z++) for(let x=0;x<b.W;x++){
      const dx=b.ox+x*VOX-cx, dz=b.oz+z*VOX-cz;
      if(dx*dx+dz*dz>rad*rad) continue;
      n+=killVoxel(b,x,y,z,true);
    }
  }
  return n;
}
/* 爆風で広範囲の窓だけが割れる（構造は無事でも街区一帯が真っ暗になる） */
const GLASSM=new Uint8Array(64);
GLASSM[2]=1; GLASSM[3]=1; GLASSM[4]=1; GLASSM[27]=1; GLASSM[28]=1;
function shatterGlass(wx,wy,wz,rad){
  let n=0;
  const r2=rad*rad;
  for(let k=0;k<blds.length;k++){
    const b=blds[k];
    const bw=b.W*VOX, bh=b.H*VOX, bd=b.D*VOX;
    if(wx+rad<b.ox||wx-rad>b.ox+bw) continue;
    if(wz+rad<b.oz||wz-rad>b.oz+bd) continue;
    if(wy+rad<0||wy-rad>bh) continue;
    const x0=Math.max(0,((wx-rad-b.ox)/VOX)|0), x1=Math.min(b.W-1,((wx+rad-b.ox)/VOX)|0);
    const y0=Math.max(0,((wy-rad)/VOX)|0),       y1=Math.min(b.H-1,((wy+rad)/VOX)|0);
    const z0=Math.max(0,((wz-rad-b.oz)/VOX)|0), z1=Math.min(b.D-1,((wz+rad-b.oz)/VOX)|0);
    for(let z=z0;z<=z1;z++) for(let y=y0;y<=y1;y++){
      const row=b.W*(y+b.H*z);
      for(let x=x0;x<=x1;x++){
        const m=b.vox[row+x];
        if(!m||!GLASSM[m]) continue;
        const dx=b.ox+x*VOX+1-wx, dy=y*VOX+1-wy, dz=b.oz+z*VOX+1-wz;
        if(dx*dx+dy*dy+dz*dz>r2) continue;
        n+=killVoxel(b,x,y,z,1);
        if(gxA.length<700 && Math.random()<.05)
          gxA.push({x:b.ox+x*VOX,y:y*VOX,z:b.oz+z*VOX,
            vx:rf(-16,16),vy:rf(-4,16),vz:rf(-16,16),
            r:.8+Math.random()*1.6, life:1, dec:.03, c:[.72,.92,1]});
      }
    }
  }
  return n;
}
/* レールガン：光線に沿った円柱トンネル */
function damageBeam(ox,oy,oz,dx,dy,dz,len,rad,pow){
  const cand=[], hit={};
  for(let t=0;t<len;t+=GC*.5){
    const l=cellAt(ox+dx*t,oz+dz*t);
    if(l) for(let k=0;k<l.length;k++) if(!hit[l[k].id]){ hit[l[k].id]=1; cand.push(l[k]); }
  }
  if(!cand.length) return 0;
  let n=0;
  const st=Math.max(rad*.7,VOX*1.1), steps=Math.ceil(len/st);
  for(let s=0;s<steps;s++){
    const t=s*st;
    n+=damageSphere(ox+dx*t,oy+dy*t,oz+dz*t,rad,pow,cand);
  }
  return n;
}

/* ══════════ 支持判定 → 剥離 ══════════ */
const seenBuf={a:null,n:0};
function ensureSeen(n){ if(!seenBuf.a||seenBuf.n<n){ seenBuf.a=new Uint8Array(n); seenBuf.n=n; } return seenBuf.a; }
function detachBuilding(b,noGround){
  const {W,H,D,vox}=b, N=W*H*D;
  const seen=ensureSeen(N); seen.fill(0,0,N);
  const q=[];
  if(!noGround){
    for(let z=0;z<D;z++) for(let x=0;x<W;x++){
      const i=x+W*(0+H*z);
      if(vox[i]){ seen[i]=1; q.push(i); }
    }
  }
  for(let k=0;k<q.length;k++){
    const i=q[k], x=i%W, y=((i/W)|0)%H, z=(i/(W*H))|0;
    if(x>0   && vox[i-1]     && !seen[i-1])     { seen[i-1]=1;     q.push(i-1); }
    if(x<W-1 && vox[i+1]     && !seen[i+1])     { seen[i+1]=1;     q.push(i+1); }
    if(y>0   && vox[i-W]     && !seen[i-W])     { seen[i-W]=1;     q.push(i-W); }
    if(y<H-1 && vox[i+W]     && !seen[i+W])     { seen[i+W]=1;     q.push(i+W); }
    if(z>0   && vox[i-W*H]   && !seen[i-W*H])   { seen[i-W*H]=1;   q.push(i-W*H); }
    if(z<D-1 && vox[i+W*H]   && !seen[i+W*H])   { seen[i+W*H]=1;   q.push(i+W*H); }
  }
  const comps=[];
  for(let i=0;i<N;i++){
    if(!vox[i]||seen[i]) continue;
    const c=[], q2=[i]; seen[i]=1;
    for(let k=0;k<q2.length;k++){
      const j=q2[k], x=j%W, y=((j/W)|0)%H, z=(j/(W*H))|0;
      c.push(j);
      if(x>0   && vox[j-1]   && !seen[j-1])   { seen[j-1]=1;   q2.push(j-1); }
      if(x<W-1 && vox[j+1]   && !seen[j+1])   { seen[j+1]=1;   q2.push(j+1); }
      if(y>0   && vox[j-W]   && !seen[j-W])   { seen[j-W]=1;   q2.push(j-W); }
      if(y<H-1 && vox[j+W]   && !seen[j+W])   { seen[j+W]=1;   q2.push(j+W); }
      if(z>0   && vox[j-W*H] && !seen[j-W*H]) { seen[j-W*H]=1; q2.push(j-W*H); }
      if(z<D-1 && vox[j+W*H] && !seen[j+W*H]) { seen[j+W*H]=1; q2.push(j+W*H); }
    }
    comps.push(c);
  }
  return comps;
}
/* 各層の耐力と、その上に載る質量を比べる。足りない層は座屈して崩れる */
/* 建物ごとに「無傷時の最悪比」を測り、そこからどれだけ余力を失ったかで判定する。
   損傷したボクセルは耐力も比例して落ちるので、爆風で殴るだけでも構造が弱る。 */
const SAFETY=1.45;                 // 断面の約31%を失うと座屈
let _cnt=null, _mass=null;
function scanLoad(b){
  const {W,H,D,vox,hp}=b;
  if(!_cnt||_cnt.length<H){ _cnt=new Float32Array(H); _mass=new Float32Array(H); }
  _cnt.fill(0,0,H); _mass.fill(0,0,H);
  for(let z=0;z<D;z++) for(let y=0;y<H;y++){
    const row=W*(y+H*z);
    for(let x=0;x<W;x++){
      const i=row+x, m=vox[i];
      if(!m) continue;
      _mass[y]+=1;
      const M=MATS[m];
      if(M.ld) _cnt[y]+=M.ld*(hp[i]/M.hp);      // 傷んだ柱は支えられない
    }
  }
}
function computeBase(b){
  scanLoad(b);
  let above=0, mx=0;
  for(let y=b.H-1;y>=0;y--){
    if(_cnt[y]>0.5) { const r=above/_cnt[y]; if(r>mx) mx=r; }
    above+=_mass[y];
  }
  b.capLimit=Math.max(24,mx)*SAFETY;
}
/* ── 転倒判定 ──
   現実の建物は「重心が支持面の外に出たら倒れる」。
   従来は鉛直方向の力（層の断面が足りるか）しか見ていなかったので、
   片側だけ深く抉られてもL字型のまま平然と立っていた。
   ここでは残存質量の重心と、地面に接している範囲を比べ、
   重心が支持範囲から外れたらその方向へ倒す */
function checkTopple(b){
  if(b.toppled) return 0;
  if(b.style==='pole'||b.style==='gate'||b.style==='rail'||b.style==='car') return 0;
  if(b.live<40) return 0;
  const {W,H,D,vox}=b;
  // ① 残っている質量の重心（XZ）と、高さの分布
  let mx=0, mz=0, my=0, n=0;
  for(let z=0;z<D;z++) for(let y=0;y<H;y++){
    const row=W*(y+H*z);
    for(let x=0;x<W;x++){
      if(!vox[row+x]) continue;
      mx+=x; mz+=z; my+=y; n++;
    }
  }
  if(!n) return 0;
  const cgx=mx/n, cgz=mz/n, cgy=my/n;
  // ② 地面に接している範囲（下から3層ぶんを支持面とみなす）
  const base=Math.min(H-1, 3);
  let bx0=1e9,bx1=-1e9,bz0=1e9,bz1=-1e9, bn=0;
  for(let z=0;z<D;z++) for(let y=0;y<=base;y++){
    const row=W*(y+H*z);
    for(let x=0;x<W;x++){
      if(!vox[row+x]) continue;
      if(x<bx0) bx0=x; if(x>bx1) bx1=x;
      if(z<bz0) bz0=z; if(z>bz1) bz1=z;
      bn++;
    }
  }
  if(bn<8) return 0;                        // 地面と繋がっていない＝別処理に任せる
  // ③ 支持面の「重心」を求める。
  //    最外周の矩形で測ると、隅に柱が1本残るだけで支持範囲が広く出てしまう。
  //    実際に接地しているボクセルの重心と広がりで判定する
  let sx=0, sz=0;
  for(let z=0;z<D;z++) for(let y=0;y<=base;y++){
    const row=W*(y+H*z);
    for(let x=0;x<W;x++){ if(vox[row+x]){ sx+=x; sz+=z; } }
  }
  const spx=sx/bn, spz=sz/bn;               // 支持面の重心
  // 支持面の「広がり」（分散の平方根）＝実効的な半径
  let vxx=0, vzz=0;
  for(let z=0;z<D;z++) for(let y=0;y<=base;y++){
    const row=W*(y+H*z);
    for(let x=0;x<W;x++){
      if(!vox[row+x]) continue;
      vxx+=(x-spx)*(x-spx); vzz+=(z-spz)*(z-spz);
    }
  }
  const rx=Math.sqrt(vxx/bn)*1.9, rz=Math.sqrt(vzz/bn)*1.9;   // ≒ 支持半径
  // ④ 重心が支持面の重心からどれだけ離れているか
  const ox=(cgx-spx)/Math.max(1.2, rx);
  const oz=(cgz-spz)/Math.max(1.2, rz);
  const over=Math.hypot(ox,oz);
  // 細長い建物ほど倒れやすい（重心が高いと僅かな偏りで転倒する）
  const slender=Math.min(2.4, cgy/Math.max(2,(rx+rz)/2));
  const need=Math.max(0.30, 0.72-slender*0.20);
  if(over < need) return 0;                 // まだ支持面の内側
  // ④ 転倒：重心が外れている方向へ倒す
  b.toppled=1;
  // ⑤ 大きな建物が傾き始めた瞬間を見せ場にする。一瞬止めてからスローモーション、画角を少し引く
  { const hgt=H*VOX;
    if(hgt>=60 || b.init>=6000){
      const k=Math.min(1,(hgt-40)/160);
      slowMo(.7+k*1.1);
      hitStop(.05); fovPunch(3+k*4);
    } }
  const l=Math.hypot(ox,oz)||1;
  // 重心は「残った側」に寄るが、建物は支点を軸にして支えを失った側（＝抉られた側）へ倒れ込む
  const tx=-ox/l, tz=-oz/l;
  // 支点：倒れる方向の反対側の足元の縁（そこを軸に回る）
  const pvx=b.ox+(spx+.5)*VOX - tx*Math.max(1.2,rx*0.9)*VOX;
  const pvz=b.oz+(spz+.5)*VOX - tz*Math.max(1.2,rz*0.9)*VOX;
  const big=H*VOX>=40 || b.init>=2500;

  for(let k=0;k<blds.length;k++){

    const bx=b.ox+b.W*VOX/2, bz=b.oz+b.D*VOX/2, bh=b.H*VOX;
    const d=Math.hypot(bx-cx,bz-cz);

/* ══ 瓦礫の堆積：眠った塊を1枚の静的メッシュに焼き込んで残す ══
   物理から外れるので同時演算の上限を圧迫せず、街に積み上がっていく */
let rubP=[], rubC=[], rubU=[], rubM=[], rubI=[], rubTris=0, rubMeshes=[], rubT=0;
const RUB_MAX_MESH=16, RUB_MAX_TRI=150000, RUB_FLUSH_TRI=14000,
      RUB_MIN_FLUSH=900, RUB_FLUSH_T=1.0;
const _rm=new THREE.Matrix4(), _rq=new THREE.Quaternion(),
      _rv=new THREE.Vector3(), _rone=new THREE.Vector3(1,1,1);
function retireChunk(c){
  if(rubTris>=RUB_MAX_TRI || rubMeshes.length>=RUB_MAX_MESH){ removeChunk(c); return; }
  const g=c.geo;
  if(!g||!g.index){ removeChunk(c); return; }
  const P=g.attributes.position.array, C=g.attributes.color.array, I=g.index.array;
  const U=g.attributes.uv?g.attributes.uv.array:null, Mt=g.attributes.aM?g.attributes.aM.array:null;
  _rq.set(c.q[0],c.q[1],c.q[2],c.q[3]);
  _rv.set(c.p[0],c.p[1],c.p[2]);
  _rm.compose(_rv,_rq,_rone);
  const base=rubP.length/3;
  for(let i=0;i<P.length;i+=3){
    _rv.set(P[i],P[i+1],P[i+2]).applyMatrix4(_rm);
    rubP.push(_rv.x,_rv.y,_rv.z);
  }
  for(let i=0;i<C.length;i+=3){
    // 発光ボクセル（印付き）は壊れて消灯した暗い色に。印を残すと瓦礫が光ってしまう
    const cls=Math.floor(Math.min(C[i],C[i+1],C[i+2])*0.5+0.001);
    if(cls>0){
      // 印を外す。発光は壊れて消灯した暗い色、ガラスは埃をかぶった色に
      const o=cls*EM_OFS, k=(cls===4)?.70:.22;
      rubC.push((C[i]-o)*k,(C[i+1]-o)*k,(C[i+2]-o)*k);
    }
    else rubC.push(C[i]*.70,C[i+1]*.70,C[i+2]*.70);      // 瓦礫は埃をかぶって暗い
  }
  if(U) for(let i=0;i<U.length;i++) rubU.push(U[i]);
  else  for(let i=0;i<P.length/3;i++) rubU.push(0,0);
  if(Mt) for(let i=0;i<Mt.length;i++) rubM.push(Math.min(63,Mt[i]%64)+3*64);   // 瓦礫は最も損傷した段階で描く
  else  for(let i=0;i<P.length/3;i++) rubM.push(0);
  for(let i=0;i<I.length;i++) rubI.push(base+I[i]);
  rubTris+=I.length/3;
  removeChunk(c);
  if(rubI.length/3>RUB_FLUSH_TRI) flushRubble();
}
function flushRubble(){
  if(!rubI.length) return;
  if(rubMeshes.length>=RUB_MAX_MESH){ rubP=[]; rubC=[]; rubU=[]; rubM=[]; rubI=[]; return; }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(rubP,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(rubC,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(rubU,2));
  g.setAttribute('aM',new THREE.Float32BufferAttribute(rubM,1));
  g.setIndex(rubI);
  g.computeBoundingSphere();
  const m=new THREE.Mesh(g,MAT_SOLID);
  scene.add(m); rubMeshes.push(m);
  rubP=[]; rubC=[]; rubU=[]; rubM=[]; rubI=[];
}
function clearRubble(){
  flushRubble();
  for(const m of rubMeshes){ scene.remove(m); m.geometry.dispose(); }
  rubMeshes=[]; rubP=[]; rubC=[]; rubU=[]; rubM=[]; rubI=[]; rubTris=0;
}
function removeChunk(c,silent){
  const i=chunks.indexOf(c); if(i>=0) chunks.splice(i,1);
  if(c.mesh){ scene.remove(c.mesh); }
  if(c.geo) c.geo.dispose();
  c.dead=true;
  if(!silent){
    let _bake=0, _bn=0;
    for(let k=0;k<c.vox.length;k++) if(c.vox[k]){
      killedVox++; _bake+=MATS[c.vox[k]].sc*6; _bn++;
    }
    tallyKill(_bn,_bake,c.src||'collapse',-1,false); pushVox(_bn);
  }
}
function chunkRemesh(c){
  c.dirty=false;
  geoBudget-=c.W*c.H*c.D;
  const geo=buildGeo(c.code,c.W,c.H,c.D,true,c.tint);
  scene.remove(c.mesh); c.geo.dispose();
  if(!geo){ const i=chunks.indexOf(c); if(i>=0) chunks.splice(i,1); c.dead=true; return; }
  c.geo=geo;
  c.mesh=new THREE.Mesh(geo,MAT_SOLID);
  c.mesh.position.set(c.p[0],c.p[1],c.p[2]);
  c.mesh.quaternion.set(c.q[0],c.q[1],c.q[2],c.q[3]);
  scene.add(c.mesh);
}
/* 塊の内部ボクセルを削る（ローカル球） */
function damageChunk(c,wx,wy,wz,rad,pow){
  const inv=qConj(c.q);
  const lx=wx-c.p[0], ly=wy-c.p[1], lz=wz-c.p[2];
  const L=qRot(inv,lx,ly,lz);
  const gx=(L[0]+c.h[0])/VOX, gy=(L[1]+c.h[1])/VOX, gz=(L[2]+c.h[2])/VOX;
  const r=rad/VOX;
  const x0=Math.max(0,Math.floor(gx-r)), x1=Math.min(c.W-1,Math.ceil(gx+r));
  const y0=Math.max(0,Math.floor(gy-r)), y1=Math.min(c.H-1,Math.ceil(gy+r));
  const z0=Math.max(0,Math.floor(gz-r)), z1=Math.min(c.D-1,Math.ceil(gz+r));
  let n=0;
  for(let z=z0;z<=z1;z++) for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const i=x+c.W*(y+c.H*z), m=c.vox[i]; if(!m) continue;
    const dx=x+.5-gx, dy=y+.5-gy, dz=z+.5-gz;
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz); if(d>r) continue;
    const h=c.hp[i]-pow*(1-d/r)*(.7+grnd()*.6);
    if(h<=0){
      c.vox[i]=0; c.code[i]=0; c.live--; killedVox++; n++;
      tallyKill(1,MATS[m].sc*10,c.src||'collapse',-1,true); pushVox(1);
      if(Math.random()<.18){
        const wp=qRot(c.q,(x+.5)*VOX-c.h[0],(y+.5)*VOX-c.h[1],(z+.5)*VOX-c.h[2]);
        spawnDebris(c.p[0]+wp[0],c.p[1]+wp[1],c.p[2]+wp[2],MATS[m],.8);
      }
    } else { c.hp[i]=h; c.code[i]=codeOf(m,h); }
  }
  if(n>0){ c.dirty=true; c.lost+=n; if(c.lost>Math.max(4,c.live*.22)) c.split=true; }
  return n;
}
/* 連結成分ごとに割る */
function splitChunk(c){
  if(c.dead) return;
  if(geoBudget<=0) return;          // 予算切れ：次フレームに持ち越す（c.split は立てたまま）
  c.split=false; c.lost=0;
  geoBudget-=c.W*c.H*c.D;
  const {W,H,D,vox}=c, N=W*H*D;
  const seen=ensureSeen(N); seen.fill(0,0,N);
  const comps=[];
  for(let i=0;i<N;i++){
    if(!vox[i]||seen[i]) continue;
    const list=[], q2=[i]; seen[i]=1;
    for(let k=0;k<q2.length;k++){
      const j=q2[k], x=j%W, y=((j/W)|0)%H, z=(j/(W*H))|0;
      list.push(j);
      if(x>0   && vox[j-1]   && !seen[j-1])   { seen[j-1]=1;   q2.push(j-1); }
      if(x<W-1 && vox[j+1]   && !seen[j+1])   { seen[j+1]=1;   q2.push(j+1); }
      if(y>0   && vox[j-W]   && !seen[j-W])   { seen[j-W]=1;   q2.push(j-W); }
      if(y<H-1 && vox[j+W]   && !seen[j+W])   { seen[j+W]=1;   q2.push(j+W); }
      if(z>0   && vox[j-W*H] && !seen[j-W*H]) { seen[j-W*H]=1; q2.push(j-W*H); }
      if(z<D-1 && vox[j+W*H] && !seen[j+W*H]) { seen[j+W*H]=1; q2.push(j+W*H); }
    }
    comps.push(list);
  }
  if(comps.length<=1){ if(c.dirty) chunkRemesh(c); return; }
  comps.sort((a,b)=>b.length-a.length);   // 大きい破片を優先して実体化
  const q=[c.q[0],c.q[1],c.q[2],c.q[3]], qq=new THREE.Quaternion(q[0],q[1],q[2],q[3]);
  const P=c.p, V=c.v, Wv=c.w, gen=c.gen;
  const _csrc=c.src||'collapse', _cbid=c.bid;
  chunkSrc=_csrc;
  let left=false;
  // 最大の成分（comps[0]）は元の塊に残す。他の成分を新しい塊へ移す
  for(let k=1;k<comps.length;k++){
    const list=comps[k];
    if(list.length<3){                       // ごく小さな欠片は粉砕
      let _sp=0;
      for(let j=0;j<list.length;j++){ const i=list[j]; killedVox++; _sp+=MATS[c.vox[i]].sc*6; c.vox[i]=0; c.code[i]=0; c.live--; }
      tallyKill(list.length,_sp,_csrc,-1,false); pushVox(list.length);
      continue;
    }
    if(chunks.length>=MAXCHUNK || geoBudget<=0 || spawnBudget<=0){ left=true; continue; }   // 予算切れ：元の塊に残して次フレームへ
    let x0=1e9,y0=1e9,z0=1e9,x1=-1e9,y1=-1e9,z1=-1e9;
    for(let j=0;j<list.length;j++){
      const i=list[j], x=i%W, y=((i/W)|0)%H, z=(i/(W*H))|0;
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; if(z<z0)z0=z; if(z>z1)z1=z;
    }
    const nW=x1-x0+1,nH=y1-y0+1,nD=z1-z0+1;
    const nv=new Uint8Array(nW*nH*nD), nh=new Uint16Array(nW*nH*nD);
    for(let j=0;j<list.length;j++){
      const i=list[j], x=i%W, y=((i/W)|0)%H, z=(i/(W*H))|0;
      const t=(x-x0)+nW*((y-y0)+nH*(z-z0));
      nv[t]=c.vox[i]; nh[t]=c.hp[i];
    }
    // 元の塊のローカル中心 → 新しい塊の中心（ワールド）
    const lcx=(x0+nW/2)*VOX-c.h[0], lcy=(y0+nH/2)*VOX-c.h[1], lcz=(z0+nD/2)*VOX-c.h[2];
    const wr=qRot(q,lcx,lcy,lcz);
    const nc=addChunk(nv,nh,nW,nH,nD,P[0]+wr[0],P[1]+wr[1],P[2]+wr[2],
      V[0]+(Math.random()-.5)*5, V[1]+(Math.random()-.5)*3, V[2]+(Math.random()-.5)*5, gen+1, qq, c.tint);
    for(let j=0;j<list.length;j++){ const i=list[j]; if(c.vox[i]){ c.vox[i]=0; c.code[i]=0; c.live--; } }   // 移した分を元から抜く（粉砕された場合も集計済み）
    if(nc){ nc.w=[Wv[0]+(Math.random()-.5)*.6, Wv[1]+(Math.random()-.5)*.6, Wv[2]+(Math.random()-.5)*.6]; nc.bid=_cbid; }
  }
  c.split=left;                             // 残った成分があれば次フレームにもう一度割る
  c.dirty=true;
  if(geoBudget>0) chunkRemesh(c); else c.dirty=true;
}

/* ══════════ 剛体演算 ══════════ */
function qConj(q){ return [-q[0],-q[1],-q[2],q[3]]; }
function qRot(q,x,y,z){
  const a=q[0],b=q[1],c=q[2],d=q[3];
  const tx=2*(b*z-c*y), ty=2*(c*x-a*z), tz=2*(a*y-b*x);
  return [x+d*tx+(b*tz-c*ty), y+d*ty+(c*tx-a*tz), z+d*tz+(a*ty-b*tx)];
}
function impulse(c,ix,iy,iz,rx,ry,rz){
  c.v[0]+=ix*c.invM; c.v[1]+=iy*c.invM; c.v[2]+=iz*c.invM;
  c.w[0]+=c.invI*(ry*iz-rz*iy);
  c.w[1]+=c.invI*(rz*ix-rx*iz);
  c.w[2]+=c.invI*(rx*iy-ry*ix);
  const wl=Math.hypot(c.w[0],c.w[1],c.w[2]);
  if(wl>MAXW){ const s=MAXW/wl; c.w[0]*=s; c.w[1]*=s; c.w[2]*=s; }
}
function contact(c,cx,cy,cz,nx,ny,nz,pen,e,mu){
  const rx=cx-c.p[0], ry=cy-c.p[1], rz=cz-c.p[2];
  if(pen>0){ c.p[0]+=nx*pen*.34; c.p[1]+=ny*pen*.34; c.p[2]+=nz*pen*.34; }
  let vx=c.v[0]+c.w[1]*rz-c.w[2]*ry;
  let vy=c.v[1]+c.w[2]*rx-c.w[0]*rz;
  let vz=c.v[2]+c.w[0]*ry-c.w[1]*rx;
  const vn=vx*nx+vy*ny+vz*nz;
  if(vn>0) return 0;
  const rnx=ry*nz-rz*ny, rny=rz*nx-rx*nz, rnz=rx*ny-ry*nx;
  const dn=c.invM+c.invI*(rnx*rnx+rny*rny+rnz*rnz);
  let jn=-(1+e)*vn/dn; if(jn<0) jn=0;
  impulse(c,jn*nx,jn*ny,jn*nz,rx,ry,rz);
  vx=c.v[0]+c.w[1]*rz-c.w[2]*ry;
  vy=c.v[1]+c.w[2]*rx-c.w[0]*rz;
  vz=c.v[2]+c.w[0]*ry-c.w[1]*rx;
  const vn2=vx*nx+vy*ny+vz*nz;
  let tx=vx-vn2*nx, ty=vy-vn2*ny, tz=vz-vn2*nz;
  const tl=Math.hypot(tx,ty,tz);
  if(tl>1e-5){
    tx/=tl;ty/=tl;tz/=tl;
    const rtx=ry*tz-rz*ty, rty=rz*tx-rx*tz, rtz=rx*ty-ry*tx;
    const dt2=c.invM+c.invI*(rtx*rtx+rty*rty+rtz*rtz);
    let jt=-tl/dt2; const lim=mu*jn;
    if(jt<-lim)jt=-lim; else if(jt>lim)jt=lim;
    impulse(c,jt*tx,jt*ty,jt*tz,rx,ry,rz);
  }
  return jn;
}
function stepChunk(c,dt){
  if(c.sleep) return;
  c.age+=dt;
  c.v[1]-=GRAV*dt;
  if(chance(.14)&&c.live>60){ const cs=Math.cbrt(c.live)*VOX*.6;                              // 落ちる塊は白い粉塵の尾を引く
    vfxSmoke(c.p[0]+rf(-1,1),c.p[1]+rf(0,2),c.p[2]+rf(-1,1),cs*rf(.5,.9),rf(2,3.5),c.v[0]*.25,c.v[1]*.15+2,c.v[2]*.25,-1); }
  { const dv=dampK(.9985), dw=dampK(.993);
    c.v[0]*=dv; c.v[1]*=dv; c.v[2]*=dv;
    c.w[0]*=dw; c.w[1]*=dw; c.w[2]*=dw; }
  const sp=Math.hypot(c.v[0],c.v[1],c.v[2]);
  const maxStep=VOX*1.6;
  const sub=Math.min(4,Math.max(1,Math.ceil(sp*dt/maxStep)));
  const h=dt/sub;
  let bigHit=0;
  for(let s=0;s<sub;s++){
    c.p[0]+=c.v[0]*h; c.p[1]+=c.v[1]*h; c.p[2]+=c.v[2]*h;
    const q=c.q,w=c.w;
    const d0=.5*( w[0]*q[3]+w[1]*q[2]-w[2]*q[1]);
    const d1=.5*(-w[0]*q[2]+w[1]*q[3]+w[2]*q[0]);
    const d2=.5*( w[0]*q[1]-w[1]*q[0]+w[2]*q[3]);
    const d3=.5*(-w[0]*q[0]-w[1]*q[1]-w[2]*q[2]);
    q[0]+=d0*h; q[1]+=d1*h; q[2]+=d2*h; q[3]+=d3*h;
    const l=Math.hypot(q[0],q[1],q[2],q[3])||1;
    q[0]/=l;q[1]/=l;q[2]/=l;q[3]/=l;
    bigHit=Math.max(bigHit, solveGround(c), solveWorld(c));
  }
  const sp2=Math.hypot(c.v[0],c.v[1],c.v[2]), sw=Math.hypot(c.w[0],c.w[1],c.w[2]);
  // 遅い塊は速度を積極的に殺す。接触が多いと微振動が延々と続くため
  if(sp2<3.0){ const a=dampK(.90), b2=dampK(.94); c.v[0]*=a; c.v[1]*=b2; c.v[2]*=a; }
  if(sw<1.2){ const a=dampK(.88); c.w[0]*=a; c.w[1]*=a; c.w[2]*=a; }
  c.age2=(c.age2||0)+dt;
  if(sp2<1.1 && sw<.7){ c.rest+=dt; if(c.rest>.5){ c.sleep=true; c.v=[0,0,0]; c.w=[0,0,0]; } }
  else c.rest=0;
  // 保険：長く漂っている塊は地面付近なら強制的に静止させる
  if(!c.sleep && c.age2>7 && c.p[1]<c.h[1]*1.6+4){ c.sleep=true; c.v=[0,0,0]; c.w=[0,0,0]; }
  // 保険2：12秒以上動き続けている塊は、どこにいても強制的に止める
  else if(!c.sleep && c.age2>12){ c.sleep=true; c.v=[0,0,0]; c.w=[0,0,0]; }
  return bigHit;
}
function solveGround(c){
  let maxJ=0;
  for(let it=0;it<3;it++){
    for(let s=0;s<8;s++){
      const r=qRot(c.q,(s&1?1:-1)*c.h[0],(s&2?1:-1)*c.h[1],(s&4?1:-1)*c.h[2]);
      const wy=c.p[1]+r[1];
      if(wy>=0) continue;
      const j=contact(c,c.p[0]+r[0],wy,c.p[2]+r[2],0,1,0,(-wy)/3,.04,.66);
      if(j>maxJ) maxJ=j;
    }
  }
  if(maxJ>0 && !c.hitGround){
    c.hitGround=true;
    const E=maxJ;
    if(E>140){
      dustAt(c.p[0],Math.max(2,c.p[1]-c.h[1]),c.p[2], Math.min(40,7+E*.03), 2.1);
      if(E>420) collapseDust(c.p[0],c.p[2], Math.min(900,E*.5));
      shake(Math.min(1.5,E*.0022));
      Snd.thud(Math.min(.5,E*.0016),c.p[0],c.p[1],c.p[2]);
      if(E>420) Snd.rubble(c.p[0],c.p[1],c.p[2],c.live);
      { const gy=Math.max(1,c.p[1]-c.h[1]); for(let i=0;i<2;i++) vfxSmoke(c.p[0]+rf(-3,3),gy+1,c.p[2]+rf(-3,3),Math.min(30,8+E*.02),rf(2.5,4),rf(-4,4),rf(1,3),rf(-4,4),-1); }   // 接地点から土煙
      damageChunk(c, c.p[0], Math.max(0,c.p[1]-c.h[1]*.7), c.p[2], c.h[1]*.42+7, E*.12);
    }
  } else if(maxJ===0) c.hitGround=false;
  return maxJ;
}
/* 塊 × 建物ボクセル */
function solveWorld(c){
  let maxJ=0, hits=0, hx=0,hy=0,hz=0;
  for(let s=0;s<8;s++){
    const r=qRot(c.q,(s&1?1:-1)*c.h[0],(s&2?1:-1)*c.h[1],(s&4?1:-1)*c.h[2]);
    const wx=c.p[0]+r[0], wy=c.p[1]+r[1], wz=c.p[2]+r[2];
    if(wy<0) continue;
    const hit=bldAt(wx,wy,wz);
    if(!hit) continue;
    hits++; hx+=wx; hy+=wy; hz+=wz;
    // 押し戻し方向＝塊の中心へ向かう向き
    let nx=c.p[0]-wx, ny=c.p[1]-wy, nz=c.p[2]-wz;
    const nl=Math.hypot(nx,ny,nz)||1; nx/=nl; ny/=nl; nz/=nl;
    const j=contact(c,wx,wy,wz,nx,ny,nz,VOX*.5,.02,.7);
    if(j>maxJ) maxJ=j;
  }
  if(hits){
    hx/=hits; hy/=hits; hz/=hits;
    const E=maxJ;
    // 壊すのは「ぶつかった」時だけ。屋上に載って静止している塊が毎フレーム建物を削り続け、
    // 連鎖が勝手に止まらなくなるのを防ぐ（速度が無ければ接触の押し戻しだけ）
    const spd=Math.hypot(c.v[0],c.v[1],c.v[2]);
    if(E>60 && spd>5.5){
      // 落ちてきた塊が別の建物を壊す＝「巻き込み」。出身ビル自身への衝突は倒壊扱い
      const _ps=KSRC, _pd=domSelf;
      KSRC=(c.src==='nuke')?'nuke':(c.src==='fire'?'fire':'domino'); domSelf=(c.bid===undefined)?-1:c.bid;
      damageSphere(hx,hy,hz, 6+Math.min(34,E*.022), 40+Math.min(340,E*.15));

varying vec3 vC;
void main(){

        const dx=b.ox+x*VOX+VOX/2-wx, dy=y*VOX+VOX/2-wy, dz=b.oz+z*VOX+VOX/2-wz;
        const d2=dx*dx+dy*dy+dz*dz; if(d2>rr) continue;
        const f=1-Math.sqrt(d2)/rad;
        if(hitVoxel(b,x,y,z,pow*f*(.6+grnd()*.8))){
          n++;
          if(gxA.length<680 && Math.random()<.25)
            gxA.push({x:wx+dx, y:wy+dy, z:wz+dz, vx:rf(-4,4), vy:rf(6,18), vz:rf(-4,4),
              r:.8+Math.random()*1.6, life:1, dec:.02+Math.random()*.02, c:[1,.55+Math.random()*.3,.12]});
        }
      }
    }
  }
  return n;
}
/* 火元から近くの建物へ燃え移る。燃えるものが無ければ移らない */
function fireSpreadFrom(f){
  if(fires.length>=FIRECAP || f.t<2.5) return;
  const a=Math.random()*6.283, d=f.r*rf(.9,1.9);
  const px=f.x+Math.cos(a)*d, pz=f.z+Math.sin(a)*d, py=rf(2,14);
  const h=bldAt(px,py,pz);
  if(!h || h.b.style==='pole' || h.b.style==='rail') return;
  const m=h.b.vox[h.x+h.b.W*(h.y+h.b.H*h.z)];
  const wood=!!h.b.wood;
  // 木造へは必ず移る。同じ建物の中は上階へ這い上がる。別のコンクリート建物へ飛び火するのは稀
  let p;
  if(wood) p=1;
  else if(f.bid!==undefined && h.b.id===f.bid) p=BURNM[m]?.6:.15;
  else p=BURNM[m]?.10:.03;
  if(grnd()>p) return;
  fires.push({x:px, y:py, z:pz, t: wood?rf(14,22):rf(6,11), r: wood?rf(9,14):rf(5,9), bid:h.b.id, src:f.src});
  efx('ball',px,py,pz, 1.6, 10, .3, 0xff8a30, .6);
  if(wood && Math.random()<.5) Snd.crumble(.12);
}
/* 破壊率が上がるほど、壊れた街のあちこちから新しい火の手が上がる */
let spreadT=0;
function spreadFire(dt){
  const p=killedVox/totalVox;
  if(p<0.06) return;
  spreadT-=dt;
  if(spreadT>0) return;
  spreadT=Math.max(.5, 3.2-p*3.0);          // 壊れているほど頻繁に
  if(fires.length>26) return;
  // 損傷している建物の足元から出火させる
  const cand=[];
  for(let k=0;k<blds.length;k++){
    const b=blds[k];
    if(b.style==='pole') continue;
    if(b.live<b.init*0.92 && b.live>0) cand.push(b);
  }
  if(!cand.length) return;
  const b=cand[(grnd()*cand.length)|0];
  const fx0=b.ox+rf(0,b.W*VOX), fz0=b.oz+rf(0,b.D*VOX);
  fires.push({x:fx0, y:2+Math.random()*10, z:fz0, t:6+Math.random()*8, r:8+Math.random()*14, src:(b.lastSrc==='nuke'?'nuke':'fire')});
  if(Math.random()<.5) efx('ball',fx0,4,fz0, 2, 14, .3, 0xff8a30, .7);
}
/* ══════════ 火災旋風 ══════════
   火災が密集すると上昇気流が渦を作り、周囲の炎を吸い上げて自立する。
   核や大規模破壊のあとに街が「燃え続ける」余韻を作る */
let storms=[], stormT=0;
function checkFirestorm(dt){
  stormT-=dt;
  if(stormT>0) return;
  stormT=1.2;
  // 旋風は「大規模破壊の後」にだけ起きる。延焼で火が増えただけでは起きない
  if(fires.length<10 || storms.length>=2 || killedVox/totalVox<0.18) return;
  // 火災が密集している場所を探す
  for(let i=0;i<fires.length;i++){
    const a=fires[i];
    let n=0, sx=0, sz=0, nk=0;
    for(let j=0;j<fires.length;j++){
      const b=fires[j];
      if(Math.hypot(b.x-a.x, b.z-a.z)>110) continue;
      n++; sx+=b.x; sz+=b.z; if(b.src==='nuke') nk++;
    }
    if(n<9) continue;
    const cx=sx/n, cz=sz/n;
    // すでに近くに旋風があるなら作らない
    let dup=false;
    for(const st of storms) if(Math.hypot(st.x-cx, st.z-cz)<160) dup=true;
    if(dup) continue;
    storms.push({x:cx, z:cz, t:0, life:16+Math.random()*10, r:26, spin:Math.random()<.5?-1:1, src:(nk*2>n?'nuke':'fire')});
    banner('火災発生','FIRE');
    Snd.rumble();
    break;
  }
}
function updStorms(dt){
  for(let i=storms.length-1;i>=0;i--){
    const S2=storms[i];
    S2.t+=dt; S2.life-=dt;
    if(S2.life<=0){ storms.splice(i,1); continue; }
    // 育つほど太くなる
    S2.r=Math.min(70, 26+S2.t*3.5);
    // 渦の炎柱
    for(let k=0,kn=nK(5);k<kn && gxA.length<680;k++){
      const h=Math.random();
      const rr=S2.r*(1-h*0.55)*(0.5+Math.random()*0.5);
      const a2=Math.random()*6.283 + S2.t*2.4*S2.spin;
      gxA.push({x:S2.x+Math.cos(a2)*rr, y:2+h*190, z:S2.z+Math.sin(a2)*rr,
        vx:-Math.sin(a2)*S2.spin*26, vy:38+Math.random()*54, vz:Math.cos(a2)*S2.spin*26,
        r:2.5+Math.random()*5, life:1, dec:.020+Math.random()*.016,
        c:[1,.46+Math.random()*.24,.10]});
    }
    // 巻き上げられる煙
    for(let k=0,kn=nK(3);k<kn && fx.length<FXCAP-30;k++){
      const a2=Math.random()*6.283 + S2.t*2.0*S2.spin;
      const rr=S2.r*(0.7+Math.random()*0.6);
      fx.push({t:'smoke', x:S2.x+Math.cos(a2)*rr, y:6+Math.random()*60, z:S2.z+Math.sin(a2)*rr,
        vx:-Math.sin(a2)*S2.spin*20, vy:26+Math.random()*30, vz:Math.cos(a2)*S2.spin*20,
        r:rf(8,20), gr:rf(2,6), life:1, dec:.0035, c:[.30,.25,.24]});
    }
    // 周囲の火を吸い寄せ、燃焼を長引かせる
    for(const f of fires){
      const dx=S2.x-f.x, dz=S2.z-f.z;
      const d=Math.hypot(dx,dz);
      if(d>190||d<2) continue;
      f.x+=dx/d*14*dt; f.z+=dz/d*14*dt;
      f.t+=dt*0.6;                        // 消えにくくなる
    }
    // 瓦礫を巻き上げる
    for(const c of chunks){
      const dx=S2.x-c.p[0], dz=S2.z-c.p[2];
      const d=Math.hypot(dx,dz);
      if(d>S2.r*2.6||d<1) continue;
      c.sleep=false; c.rest=0; c.sleepT=0;
      const f2=1-d/(S2.r*2.6);
      c.v[0]+=(dx/d*24 - dz/d*S2.spin*34)*f2*dt;
      c.v[2]+=(dz/d*24 + dx/d*S2.spin*34)*f2*dt;
      c.v[1]+=44*f2*dt;
      c.w[1]+=S2.spin*3*f2*dt;
      // 巻き上げの速さに上限。瓦礫が砲弾になって街を薙ぎ払わないように
      { const sp=Math.hypot(c.v[0],c.v[1],c.v[2]); if(sp>26){ const k=26/sp; c.v[0]*=k; c.v[1]*=k; c.v[2]*=k; } }
      if(c.src!=='nuke') c.src=(S2.src==='nuke'?'nuke':'fire');          // 旋風が投げた瓦礫の被害は「延焼」扱い（核起因なら核）
    }
    // 中心で建物を焼く
    if(chance(.3)){ KSRC=S2.src||'fire'; damageSphere(S2.x, 8+Math.random()*40, S2.z, S2.r*0.5, 60); KSRC='wpn'; }
    if(chance(.05)) Snd.rumble();
    shake(.10);
  }
}

function shell(x,y,z,r,col){

function updShells(dt){
