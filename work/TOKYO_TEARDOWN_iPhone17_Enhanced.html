<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TOKYO TEARDOWN — 東京解体</title>
<style>
:root{
  --ink:#e6eef5; --dim:#8da2b4; --cyan:#4fe3f0; --mag:#ff3d7f; --amber:#ffb53d;
  --panel:rgba(6,10,16,.78); --line:rgba(79,227,240,.30);
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px);
  --sa-l:env(safe-area-inset-left,0px); --sa-r:env(safe-area-inset-right,0px);
  --barH:64px;                 /* 下部のクイック武器バーの高さ */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:#05070c;}
body{font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:var(--ink);
     user-select:none;-webkit-user-select:none;touch-action:none;
     overscroll-behavior:none;-webkit-touch-callout:none;}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;}
button{font-family:inherit;color:inherit;}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;}

/* ══ 起動画面 ══ */
#boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:14px;background:#05070c;z-index:50;text-align:center;padding:24px;}
#boot .t{font-size:24px;font-weight:900;letter-spacing:.26em;color:var(--cyan);}
#boot .s{font-size:11px;color:var(--dim);letter-spacing:.16em;line-height:2;}
#boot .bar{width:210px;height:3px;background:rgba(79,227,240,.15);overflow:hidden;}
#boot .bar i{display:block;height:100%;width:0;background:var(--cyan);transition:width .2s;}
#boot .tip{font-size:11px;color:var(--dim);line-height:1.9;margin-top:10px;}
#bootRetry{display:none;margin-top:8px;}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
     padding:30px;text-align:center;font-size:13px;line-height:2;color:var(--amber);z-index:60;}

/* ══ HUD（ゲーム画面を覆わない：上部の数値と、下部の操作だけ） ══ */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10;}
#top{position:absolute;left:calc(var(--sa-l) + 12px);right:calc(var(--sa-r) + 12px);top:calc(var(--sa-t) + 8px);
     display:flex;align-items:flex-start;justify-content:space-between;}
#dmg{min-width:120px;}
#dmgNum{font-size:30px;font-weight:900;color:var(--amber);letter-spacing:-.03em;line-height:1;
        font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(255,181,61,.45),0 2px 0 rgba(0,0,0,.7);}
#dmgNum small{font-size:12px;color:var(--dim);margin-left:2px;letter-spacing:.1em;}
#dmgWrap{margin-top:5px;width:118px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;}
#dmgWrap i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b3560f,var(--amber));}
#dmgSub{margin-top:5px;font-size:10px;color:var(--dim);letter-spacing:.08em;font-variant-numeric:tabular-nums;}
#dmgSub b{color:var(--ink);font-weight:800;}
#runHud{text-align:center;display:none;}
#runHud.on{display:block;}
#runBig{font-size:30px;font-weight:900;line-height:1;letter-spacing:-.03em;color:#fff;
  font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(79,227,240,.55),0 2px 0 rgba(0,0,0,.7);}
#runBig.urg{color:#ff5a6a;text-shadow:0 0 20px rgba(255,61,127,.9),0 2px 0 rgba(0,0,0,.7);}
#runLbl{font-size:9px;letter-spacing:.3em;color:var(--dim);font-weight:800;margin-top:3px;}
#mapName{text-align:center;font-size:10px;font-weight:800;letter-spacing:.24em;color:var(--cyan);opacity:.85;
  text-shadow:0 0 10px rgba(79,227,240,.5);margin-top:4px;}
#scoreWrap{text-align:right;padding-right:52px;}
#scoreBig{font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:#fff;
  text-shadow:0 0 16px rgba(255,181,61,.45),0 2px 0 rgba(0,0,0,.7);transform-origin:100% 50%;}
#scoreBig span{font-size:12px;letter-spacing:.06em;margin-left:3px;color:var(--dim);}
#scoreBig.hot{color:#ffd98a;text-shadow:0 0 28px rgba(255,190,60,.95),0 0 60px rgba(255,120,20,.6),0 2px 0 rgba(0,0,0,.6);}
#bldCount{margin-top:5px;font-size:13px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--cyan);
  text-shadow:0 0 12px rgba(79,227,240,.6);transform-origin:100% 50%;}
#bldCount span{font-size:10px;color:var(--dim);margin-left:3px;letter-spacing:.04em;}
#scoreSub{margin-top:5px;font-size:12px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--amber);}
#scoreSub small{font-size:9px;color:var(--amber);}
#scoreSub span{font-size:8px;color:var(--dim);margin-left:4px;letter-spacing:.24em;font-weight:800;}
#bPause{position:absolute;right:calc(var(--sa-r) + 8px);top:calc(var(--sa-t) + 6px);width:44px;height:44px;border-radius:12px;
  border:1px solid rgba(255,255,255,.14);background:rgba(6,10,16,.55);color:var(--ink);font-size:18px;
  display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;}
#bPause:active{background:rgba(79,227,240,.25);}
#pops{position:absolute;right:calc(var(--sa-r) + 14px);top:calc(var(--sa-t) + 84px);width:240px;height:300px;pointer-events:none;}
.pop{position:absolute;right:0;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em;will-change:transform,opacity;}

/* 連鎖・帯・原因トースト */
#chain{position:absolute;left:50%;top:17%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .12s;}
#chainN{font-size:56px;font-weight:900;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:#fff;
  text-shadow:0 0 28px rgba(255,90,31,.95),0 0 64px rgba(255,61,127,.7),0 4px 0 rgba(0,0,0,.7);}
#chainL{font-size:10px;letter-spacing:.42em;font-weight:900;color:var(--amber);margin-top:2px;}
#chainBar{margin:6px auto 0;width:140px;height:3px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;}
#chainBar i{display:block;height:100%;width:100%;transform-origin:0 50%;background:linear-gradient(90deg,var(--amber),var(--mag));}
#chainRank{font-size:11px;font-weight:900;letter-spacing:.3em;margin-top:3px;}
#banner{position:absolute;left:0;right:0;top:27%;text-align:center;opacity:0;}
#banner .t{font-size:36px;font-weight:900;letter-spacing:.16em;color:#fff;text-shadow:0 0 30px var(--mag),0 0 64px rgba(255,61,127,.6),0 4px 0 rgba(0,0,0,.8);}
#banner .u{font-size:9px;letter-spacing:.34em;color:var(--dim);font-weight:800;margin-top:4px;}
#banner.lm .t{color:#ffd166;font-size:28px;letter-spacing:.08em;text-shadow:0 0 30px rgba(255,190,60,.9),0 0 70px rgba(255,120,20,.6),0 4px 0 rgba(0,0,0,.8);}
#banner.lm .u{color:var(--amber);}
#cause{position:absolute;left:50%;top:calc(50% + 46px);transform:translateX(-50%);font-size:11px;font-weight:800;letter-spacing:.08em;
  color:#ffd98a;text-shadow:0 1px 0 #000,0 0 10px rgba(255,170,60,.5);opacity:0;white-space:nowrap;pointer-events:none;}

/* 照準と標的情報 */
#xh{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;}
#xh div{position:absolute;background:var(--cyan);opacity:.92;box-shadow:0 0 4px rgba(0,0,0,.6);}
#xh .a{left:0;top:16px;width:9px;height:1.5px;} #xh .b{right:0;top:16px;width:9px;height:1.5px;}
#xh .c{left:16px;top:0;width:1.5px;height:9px;} #xh .d{left:16px;bottom:0;width:1.5px;height:9px;}
#xh .dot{left:16px;top:16px;width:2px;height:2px;background:var(--mag);}
#xh.cut{width:160px;height:3px;}
#xhInfo{position:absolute;left:50%;top:calc(50% + 24px);transform:translateX(-50%);text-align:center;white-space:nowrap;}
#xhDist{font-size:10px;color:var(--dim);letter-spacing:.12em;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #000;}
#xhTgt{font-size:11px;color:var(--ink);font-weight:800;letter-spacing:.06em;margin-top:2px;text-shadow:0 1px 0 #000,0 0 8px rgba(0,0,0,.8);opacity:.9;}
#xhTgt.lm{color:#ffd166;}
#cutline{position:absolute;left:0;top:0;height:2px;width:0;background:var(--cyan);transform-origin:0 50%;opacity:0;pointer-events:none;z-index:12;
  box-shadow:0 0 10px var(--cyan),0 0 28px rgba(79,227,240,.55);}
#cutline::after{content:"";position:absolute;right:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--mag);box-shadow:0 0 12px var(--mag);}

/* ══ 操作系 ══ */
#stick{position:absolute;left:calc(var(--sa-l) + 18px);bottom:calc(var(--sa-b) + var(--barH) + 22px);
       width:120px;height:120px;border-radius:50%;border:1px solid var(--line);
       background:rgba(8,14,20,.36);pointer-events:auto;opacity:.6;}
#stick i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;
         background:rgba(79,227,240,.30);border:1px solid var(--cyan);}
#stick.on{opacity:.95;}
#stick.boost i{background:rgba(255,181,61,.42);border-color:var(--amber);}
#alt{position:absolute;left:calc(var(--sa-l) + 148px);bottom:calc(var(--sa-b) + var(--barH) + 22px);
     display:flex;flex-direction:column;gap:10px;pointer-events:auto;}
.ab{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel);
    color:var(--cyan);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.ab.on{background:rgba(79,227,240,.28);}
#fire{position:absolute;right:calc(var(--sa-r) + 16px);bottom:calc(var(--sa-b) + var(--barH) + 20px);
      width:112px;height:112px;border-radius:50%;border:2px solid var(--mag);
      background:rgba(255,61,127,.16);color:#fff;font-size:13px;font-weight:900;letter-spacing:.14em;
      pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
      box-shadow:0 0 0 6px rgba(255,61,127,.06);}
#fire small{font-size:8.5px;letter-spacing:.08em;color:rgba(255,255,255,.7);font-weight:700;}
#fire.on{background:rgba(255,61,127,.46);}
#fire.cool{opacity:.5;border-color:var(--dim);}
#fire.cut{border-color:var(--cyan);background:rgba(79,227,240,.14);}
#fire.cut.on{background:rgba(79,227,240,.40);}
#det{position:absolute;right:calc(var(--sa-r) + 134px);bottom:calc(var(--sa-b) + var(--barH) + 40px);
     width:72px;height:72px;border-radius:50%;border:2px solid var(--amber);
     background:rgba(255,181,61,.18);color:#fff;font-size:11px;font-weight:900;letter-spacing:.08em;line-height:1.25;
     pointer-events:auto;cursor:pointer;display:none;}
#det.on{display:block;}
#det.hot{background:rgba(255,181,61,.5);}
#det span{font-size:17px;color:var(--amber);display:block;}

/* 下部中央：クイック武器バー */
#qbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sa-b) + 6px);height:var(--barH);
      display:flex;gap:6px;align-items:stretch;pointer-events:auto;}
.q{width:62px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:var(--panel);color:var(--dim);
   display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative;overflow:hidden;}
.q .ic{font-size:22px;}
.q .n{font-size:8.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap;}
.q.sel{border-color:var(--cyan);color:var(--cyan);background:rgba(79,227,240,.16);box-shadow:0 0 14px rgba(79,227,240,.22);}
.q.cool::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--cd,0%);background:rgba(255,255,255,.10);pointer-events:none;}
.q.list{color:var(--ink);}
.q.list .n{letter-spacing:.06em;}
#wtoast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sa-b) + var(--barH) + 12px);
  font-size:11px;color:var(--ink);background:rgba(6,10,16,.7);border:1px solid rgba(255,255,255,.1);border-radius:10px;
  padding:6px 12px;max-width:min(92vw,380px);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;line-height:1.5;}
#wtoast.on{opacity:1;}

/* ══ オーバーレイ：武器一覧／ポーズ ══ */
.ov{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;pointer-events:auto;
    background:rgba(3,5,9,.55);}
.ov.on{display:flex;}
.sheet{width:100%;max-width:560px;background:rgba(8,12,18,.96);border:1px solid rgba(255,255,255,.1);border-radius:22px 22px 0 0;
       padding:14px 14px calc(var(--sa-b) + 14px);}
.sheet h3{margin:0 0 10px;font-size:11px;letter-spacing:.3em;color:var(--dim);font-weight:800;display:flex;justify-content:space-between;align-items:center;}
.sheet h3 button{border:0;background:transparent;color:var(--dim);font-size:16px;padding:8px 10px;cursor:pointer;}
#wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.w{min-height:62px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:var(--dim);
   display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:6px 2px;}
.w .ic{font-size:24px;}
.w .n{font-size:9.5px;font-weight:800;white-space:nowrap;}
.w.sel{border-color:var(--cyan);color:var(--cyan);background:rgba(79,227,240,.16);}
.w.nosc .n::after{content:" ·0pt";color:var(--mag);}
#wdesc{margin-top:10px;min-height:38px;font-size:11.5px;line-height:1.6;color:var(--ink);text-align:center;}
#wdesc b{color:var(--cyan);}
#pmenu .sheet{border-radius:22px;margin-bottom:auto;margin-top:auto;max-height:calc(100% - 40px);overflow:auto;}
#pmenu{align-items:center;}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.row.lbl{margin-top:14px;font-size:10px;letter-spacing:.24em;color:var(--dim);font-weight:800;}
.pb{flex:1 1 auto;min-width:72px;min-height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);
    color:var(--ink);font-size:12.5px;font-weight:800;letter-spacing:.04em;cursor:pointer;padding:8px 10px;}
.pb.on{border-color:var(--cyan);color:var(--cyan);background:rgba(79,227,240,.14);}
.pb.hi{border-color:var(--mag);background:rgba(255,61,127,.2);color:#fff;min-height:54px;font-size:14px;}
.pb.sub{flex:0 0 auto;min-width:0;color:var(--dim);font-weight:700;}
#pmSeed{font-size:10px;color:var(--dim);letter-spacing:.1em;margin-top:10px;text-align:center;font-variant-numeric:tabular-nums;}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sa-b) + var(--barH) + 150px);
  background:rgba(6,10,16,.72);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 14px;
  font-size:11.5px;line-height:1.8;color:var(--ink);text-align:center;opacity:0;transition:opacity .4s;pointer-events:none;z-index:11;
  white-space:nowrap;}
#hint.on{opacity:1;}
#hint b{color:var(--cyan);}
#ctxov{position:absolute;inset:0;z-index:55;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  background:rgba(3,5,9,.86);text-align:center;padding:30px;font-size:13px;line-height:1.9;color:var(--ink);}
#ctxov.on{display:flex;}

/* ══ リザルト ══ */
#result{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(10,6,14,.72) 0%,rgba(4,2,6,.94) 78%);}
#result.on{display:flex;pointer-events:auto;}
#rBox{width:min(88vw,470px);text-align:center;max-height:calc(100% - 30px);overflow:auto;padding:10px 0;}
#rTop{font-size:10px;letter-spacing:.46em;color:var(--dim);font-weight:800;opacity:0;}
#rTitle{font-size:42px;font-weight:900;letter-spacing:.14em;line-height:1.05;margin-top:4px;color:#fff;
  text-shadow:0 0 40px var(--mag),0 0 90px rgba(255,61,127,.55),0 4px 0 rgba(0,0,0,.8);opacity:0;}
#rMap{font-size:12px;letter-spacing:.24em;color:var(--cyan);font-weight:800;margin-top:6px;opacity:0;text-shadow:0 0 14px rgba(79,227,240,.6);}
#rRows{margin:18px auto 0;width:100%;}
.rRow{display:flex;align-items:baseline;justify-content:space-between;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.09);opacity:0;}
.rRow .k{font-size:11px;letter-spacing:.16em;color:var(--dim);font-weight:800;}
.rRow .v{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:#fff;text-shadow:0 0 16px rgba(255,181,61,.5);}
.rRow .v small{font-size:12px;color:var(--dim);margin-left:3px;letter-spacing:.04em;}
#rBreak{margin-top:8px;font-size:10.5px;letter-spacing:.06em;color:var(--dim);font-weight:700;opacity:0;line-height:1.8;}
#rBreak b{color:var(--ink);font-weight:800;}
#rScoreWrap{margin-top:12px;opacity:0;}
#rScoreLbl{font-size:9px;letter-spacing:.42em;color:var(--dim);font-weight:800;}
#rScore{font-size:38px;font-weight:900;line-height:1;letter-spacing:-.03em;color:#fff;font-variant-numeric:tabular-nums;
  text-shadow:0 0 24px rgba(255,181,61,.6),0 3px 0 rgba(0,0,0,.7);}
#rBest{font-size:10px;letter-spacing:.2em;color:var(--dim);font-weight:800;margin-top:4px;}
#rBest.new{color:#ffd166;text-shadow:0 0 14px rgba(255,190,60,.8);}
#rRankWrap{margin-top:8px;opacity:0;}
#rRank{font-size:84px;font-weight:900;line-height:.86;letter-spacing:-.04em;text-shadow:0 0 60px currentColor,0 0 130px currentColor,0 5px 0 rgba(0,0,0,.75);}
#rRankName{font-size:12px;letter-spacing:.42em;font-weight:900;margin-top:2px;}
#rBtns{margin-top:16px;display:flex;gap:8px;justify-content:center;opacity:0;flex-wrap:wrap;}
.rBtn{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(10,16,22,.9);color:var(--ink);
  font-size:12.5px;font-weight:800;letter-spacing:.08em;cursor:pointer;min-height:48px;}
.rBtn.hi{border-color:var(--mag);color:#fff;background:rgba(255,61,127,.18);}
.rBtn:active{transform:translateY(1px);}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;}
#vig{position:absolute;inset:0;pointer-events:none;z-index:9;background:radial-gradient(ellipse at center,transparent 46%,rgba(0,0,0,.5) 100%);}
#perf{position:absolute;left:calc(var(--sa-l) + 8px);top:calc(var(--sa-t) + 92px);z-index:45;font:10px/1.35 Menlo,monospace;color:#9fe;
  background:rgba(0,0,0,.5);padding:5px 8px;border-radius:6px;pointer-events:none;white-space:pre;display:none;}
#perf.on{display:block;}

/* ══ 横持ち ══ */
@media (orientation:landscape){
  :root{--barH:52px;}
  #dmgNum,#scoreBig,#runBig{font-size:24px;}
  #stick{width:104px;height:104px;bottom:calc(var(--sa-b) + 18px);left:calc(var(--sa-l) + 22px);}
  #stick i{width:44px;height:44px;margin:-22px 0 0 -22px;}
  #alt{left:calc(var(--sa-l) + 138px);bottom:calc(var(--sa-b) + 18px);flex-direction:row;}
  .ab{width:48px;height:48px;}
  #fire{width:96px;height:96px;bottom:calc(var(--sa-b) + 18px);right:calc(var(--sa-r) + 22px);}
  #det{right:calc(var(--sa-r) + 126px);bottom:calc(var(--sa-b) + 30px);width:64px;height:64px;}
  #qbar{bottom:calc(var(--sa-b) + 6px);}
  .q{width:56px;}
  .q .ic{font-size:19px;}
  #wgrid{grid-template-columns:repeat(10,1fr);}
  .w .n{font-size:8.5px;}
  .sheet{max-width:820px;}
  #pops{top:calc(var(--sa-t) + 64px);}
  #chain{top:12%;}
  #hint{bottom:calc(var(--sa-b) + 120px);}
}
@media (max-width:360px){ .q{width:56px;} .q .n{font-size:8px;} }
</style>
</head>
<body>
<div id="boot">
  <div class="t">TOKYO TEARDOWN</div>
  <div class="s" id="bootMsg">初期化中…</div>

<script>
/* ══════════════════════════════════════════════════════════════
   TOKYO TEARDOWN
   ボクセル構造破壊シミュレーション（three.js + 自作剛体）
   ──────────────────────────────────────────────────────────────
   2026-10-02 iPhone 17 向け改修（Enhanced）：
   ・整合性：耐久値を16bitに（620/260の丸め解消）、特異点の剥離予算と二重減算、区画境界の再生成、
     再生成時の資源解放、核・破壊球のゼロ加点を迂回する経路（車・ランドマーク・延焼・誘爆）の遮断
   ・時間：レールガン等の固定刻み、減衰と確率の時間比例、実時間／シミュレーション／モードの時計の分離、
     ポーズ・バックグラウンド・WebGLコンテキスト喪失への対応
   ・見た目：マップごとの初期視点、空と露出の再調整、素材ごとの表面と損傷の表現（頂点属性 aM）、
     欠けた縁の損傷帯、実寸の駐車車両、距離で薄れる濡れた路面、壊れた看板の光の除去
   ・破壊：転倒は「軋んで傾き始める→切断→形を保った塊が倒れ込む」の時間設計、分割で塊を蒸発させない
   ・UI：上部の数値／下部中央のクイック武器バー＋一覧／ポーズメニュー、指ごとの所有権、FIREドラッグ照準、
     カッターはFIREからのドラッグで切断線
   ・音：マスター（コンプレッサー）・同時発音上限・距離減衰と左右定位・素材別の破片音・軋み・胴鳴り
   ・その他：街の seed（同じ街に再挑戦／新しい街）、ゲーム用乱数の分離、記録の版管理、検証フックの拡張
   ──────────────────────────────────────────────────────────────
   2026-10-02 改修：
   ① 評価軸「どう壊したか」：壊した要因（直撃/倒壊/誘爆/巻き込み/延焼/核）を集計し、
      技巧率（平均倍率）でランク。核・破壊球は加算なし・連鎖も進まない
   ② モード：自由／60秒／3発（MODEボタン）。ベスト記録はマップ×モードで端末に保存
   ③ ランドマーク：実在の建物が落ちた瞬間に名前・スローモ・ボーナス
   ④ 延焼：火が可燃材を焼いて隣へ移る。木造（ゴールデン街）は燃え落ちる
   ⑤ 大きな建物が傾き始めた瞬間の自動スローモーション
   付随修正：火の寿命がコメントに飲まれて永遠に消えなかったバグ／火災旋風の発生条件と
   瓦礫の巻き上げ速度（旋風が街を薙ぎ払う連鎖の原因）／屋上で静止した塊が毎フレーム建物を削る挙動
   ══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

const bootMsg=document.getElementById('bootMsg'), bootBar=document.getElementById('bootBar');
function boot(p,m){ bootBar.style.width=(p*100)+'%'; if(m) bootMsg.textContent=m; }
function fail(m){
  document.getElementById('boot').style.display='none';
  const d=document.createElement('div'); d.id='err'; d.innerHTML=m; document.body.appendChild(d);
}

/* three.js（0.128.0 UMD 版。onBeforeCompile・色管理・WebGLMultisampleRenderTarget の挙動をこの版で検証済み）
   同じ版を複数の CDN から順に試す。別の版へは落とさない（API 差で描画が壊れるため）。
   ※ CDN 依存のため完全オフラインでは動かない */
const THREE_URLS=[
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
  'https://unpkg.com/three@0.128.0/build/three.min.js',
];
function loadThree(){
  return new Promise((res,rej)=>{
    if(window.THREE&&String(window.THREE.REVISION)==='128') return res();
    let i=0;
    (function next(){
      if(i>=THREE_URLS.length) return rej();
      boot(.04+i*.03,'3Dライブラリを読み込み中…'+(i?'（別の配信元で再試行 '+i+'）':''));
      const s=document.createElement('script');
      s.src=THREE_URLS[i++];
      s.onload=()=>{ (window.THREE&&String(window.THREE.REVISION)==='128') ? res() : next(); };
      s.onerror=()=>{ s.remove(); next(); };
      document.head.appendChild(s);
    })();
  });
}
let _started=false;
function bootLoad(){
  loadThree().then(function(){
    if(_started) return; _started=true;
    try { start(); }
    catch(e){
      console.error(e);
      fail('起動時にエラーが発生した。<br>'+((e&&e.message)||e)+'<br><br><button class="pb hi" onclick="location.reload()">再読み込み</button>');
    }
  }, function(){
    boot(0,'3Dライブラリ（three.js）を読み込めなかった。通信環境を確認して再試行してほしい。');
    const rb=document.getElementById('bootRetry');
    if(rb){ rb.style.display=''; rb.onclick=()=>{ rb.style.display='none'; bootLoad(); }; }
  });
}
bootLoad();

function start(){
const THREE=window.THREE;
boot(.12,'素材を生成中…');

/* ══════════ 定数 ══════════ */
const VOX=1.4;                    // 1ボクセルの一辺（ワールド単位）
const MAXCHUNK=84;                // 同時に物理演算する塊の上限
const MAXMESH=170;                // 塊メッシュの総数上限
const GRAV=42, MAXW=8.5;
/* 毎フレームの確率や減衰を「60fps基準」で書いてあった箇所を、実際の刻み幅に比例させるための係数 */
let dtK=1;
function chance(p){ return Math.random()<p*dtK; }                       // 1フレームあたり p（60fps基準）の確率
function nK(n){ const v=n*dtK; let k=v|0; if(Math.random()<v-k) k++; return k; }   // 個数を刻みに比例させる（端数は確率で）
function dampK(k){ return Math.pow(k,dtK); }                            // 毎フレーム k 倍の減衰
/* ループの状態（起動時に resetWorld/resize から触るので先頭で宣言） */
let last=0, paused=false, ctxLost=false, runElapsed=0, realDt=.016, needFrame=true;
let onPauseChange=null, onCtxLost=null;   // UI 側が差し替える（ポーズメニュー／描画中断の表示）
/* ══════════ 空と大気の色 ══════════
   東京の夜空は黒くない。地上の光が大気と雲に散乱し、地平線付近が琥珀色に光る。
   ・光る空（地平線の光のドーム）は空のシェーダーが描く
   ・霧は「大気の霞」。光る空より暗くしておくと、手前〜中景の建物は
     光る空を背にくっきりシルエットになり、遠景だけが霞に溶ける
   ここを唯一の定義とし、空・霧・地面がすべてこの値から導出される */
const SKY_TOP=[0.022,0.028,0.060];   // 天頂：暗い藍。ネオンとキノコ雲が映える
const SKY_MID=[0.105,0.082,0.125];   // 中空：紫がかった灰
const SKY_HOR=[0.33,0.235,0.175];   // 地平線の光のドーム（光害の琥珀）
const HAZE   =[0.105,0.080,0.082];   // 大気の霞：霧と遠景の地面の色
const FOG_NEAR=850, FOG_FAR=2950;    // 線形の霧。街の中は澄み、地平線でだけ霞む
const rgb2hex=(c)=>((Math.round(c[0]*255)<<16)|(Math.round(c[1]*255)<<8)|Math.round(c[2]*255));
const FOGC=rgb2hex(HAZE);
/* 素材の種類をシェーダーへ伝える印。頂点色に「種類×2.0」を足して渡し、シェーダーで復号する
   0:通常 1:弱い発光(街灯) 2:強い発光(ネオン・看板・灯火) 3:灯った窓(奥に部屋を描く) 4:ガラス(空を映す) */
const EM_OFS=2.0;
const M_CLS=new Uint8Array(64);
[27,28].forEach(i=>M_CLS[i]=1);
[7,8,11,16,17,19,38,39].forEach(i=>M_CLS[i]=2);
[3,4].forEach(i=>M_CLS[i]=3);
[2,37].forEach(i=>M_CLS[i]=4);
const IS_SIGN=new Uint8Array(64); [7,8,11,16,17].forEach(i=>IS_SIGN[i]=1);   // 看板の素材

/* ══════════ 空（シェーダー） ══════════ */
const SKYU={
  uTop:{value:new THREE.Color(SKY_TOP[0],SKY_TOP[1],SKY_TOP[2])},
  uMid:{value:new THREE.Color(SKY_MID[0],SKY_MID[1],SKY_MID[2])},
  uHor:{value:new THREE.Color(SKY_HOR[0],SKY_HOR[1],SKY_HOR[2])},
  uHaze:{value:new THREE.Color(HAZE[0],HAZE[1],HAZE[2])},
  uTime:{value:0}, uGlow:{value:1}, uFlash:{value:0}, uFire:{value:0},
  uMoon:{value:new THREE.Vector3(.34,.44,-.83).normalize()},
};
const SKY_FRAG=`
uniform vec3 uTop,uMid,uHor,uHaze,uMoon;
uniform float uTime,uGlow,uFlash,uFire;
varying vec3 vDir;
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(h21(i),h21(i+vec2(1.0,0.0)),f.x), mix(h21(i+vec2(0.0,1.0)),h21(i+vec2(1.0,1.0)),f.x), f.y); }
float fbm(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<5;i++){ s+=a*vn(p); p=p*2.03+vec2(17.1,9.3); a*=0.5; } return s; }
void main(){
  vec3 d=normalize(vDir);
  float e=d.y;
  float t=pow(clamp(e,0.0,1.0),0.42);            // 雲・星の配置用（従来どおり）
  // 光のドーム：仰角で決める。遠景の建物の輪郭はほぼ0〜10度に並ぶので、
  // その帯は建物より明確に明るく保つ。空と建物の明度が交差する高さを
  // 約15度まで押し上げ、輪郭が消える帯を遠景から外す
  float a=degrees(asin(clamp(e,0.0,1.0)));
  vec3 sky=mix(uHor,uMid,smoothstep(2.0,14.0,a));
  sky=mix(sky,uTop,smoothstep(12.0,50.0,a));
  sky=mix(uTop,sky,0.55+0.45*uGlow);                              // 停電でわずかに弱まる
  sky*=mix(vec3(1.0),vec3(1.30,0.80,0.60),uFire*(1.0-smoothstep(0.0,0.5,t)));  // 火災で赤らむ
  float cov=0.0;
  if(e>0.0){
    // 雲：街の光を下から受けて、雲底が橙に光る
    vec2 uv=d.xz/(e+0.08)*0.9+vec2(uTime*0.004,uTime*0.0015);
    float n=fbm(uv*1.6);
    cov=smoothstep(0.50,0.78,n)*smoothstep(0.0,0.10,e)*(1.0-0.35*smoothstep(0.35,1.0,e));
    vec3 cl=mix(uHor*1.05,uMid*1.55,smoothstep(0.0,0.6,t));
    cl=mix(cl,vec3(dot(cl,vec3(0.33))),0.25);                 // 雲は少し灰色がかる
    cl*=(0.55+0.45*uGlow)*mix(vec3(1.0),vec3(1.30,0.80,0.60),uFire*0.8);
    cl*=1.0-0.35*smoothstep(0.55,0.95,n);                        // 厚い所は暗く
    sky=mix(sky,cl,cov*0.85);
    // 月
    float md=dot(d,normalize(uMoon));
    float disc=smoothstep(0.99972,0.99982,md);
    float maria=0.82+0.18*vn(d.xz*820.0);
    float halo=pow(max(md,0.0),900.0)*0.30+pow(max(md,0.0),60.0)*0.05;
    sky+=vec3(1.0,0.97,0.9)*disc*1.7*maria*(1.0-cov*0.9)+vec3(0.9,0.85,0.8)*halo*(1.0-cov*0.6);
    // 星：光害でほとんど見えない。天頂付近にわずかに
    vec2 sp=floor(d.xz/(e+0.2)*300.0);
    float st=step(0.9965,h21(sp))*smoothstep(0.35,0.8,e)*(1.0-cov);
    st*=0.5+0.5*sin(uTime*2.0+h21(sp+3.0)*40.0);
    sky+=vec3(st)*0.45*(1.0-0.6*uGlow);
  }
  sky=mix(uHaze,sky,smoothstep(-0.015,0.02,e));                   // 地平線の下は霞（遠景の地面と一致）
  sky+=vec3(1.0,0.92,0.80)*uFlash*1.4;                            // 核の閃光で空が焼ける
  gl_FragColor=vec4(sky,1.0);
}`;
let skyMesh=null;
function makeSky(){
  const g=new THREE.SphereGeometry(2400,48,32);
  const m=new THREE.ShaderMaterial({
    uniforms:SKYU, side:THREE.BackSide, depthWrite:false, depthTest:false, fog:false,
    vertexShader:`varying vec3 vDir;
void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:SKY_FRAG,
  });
  const sk=new THREE.Mesh(g,m);
  sk.renderOrder=-1000; sk.frustumCulled=false;
  return sk;
}

/* ══════════ 動的ライティング ══════════
   建物は照明計算のない材質で描かれていたため、爆発も火災も周りを照らさなかった。
   共有材質に照明を注入し、路面の光・空の環境光・動的な点光源を足す */
const NLIT=10;
const LITU={
  uLP:{value:Array.from({length:NLIT},()=>new THREE.Vector4(0,-1e4,0,1))},
  uLC:{value:Array.from({length:NLIT},()=>new THREE.Vector4(0,0,0,0))},
  uCam:{value:new THREE.Vector3()},
  uStreet:{value:0.40}, uStreetFall:{value:1/19},
  uStreetCol:{value:new THREE.Color(1.0,0.60,0.33)},
  uSkyAmb:{value:0.58}, uSkyCol:{value:new THREE.Color(0.62,0.56,0.58)},   // 光害の空の薄明かり
  uEmLo:{value:1.0}, uEmHi:{value:1.0},
  uTop:SKYU.uTop, uMid:SKYU.uMid, uHor:SKYU.uHor, uHaze:SKYU.uHaze,   // ガラスに映す空
  // 看板（壁面に描く文字）：原点・幅／右方向・高さ／字形の範囲／種類・粒の間隔・損傷
  uSgO:{value:Array.from({length:6},()=>new THREE.Vector4())},
  uSgR:{value:Array.from({length:6},()=>new THREE.Vector4())},
  uSgA:{value:Array.from({length:6},()=>new THREE.Vector4())},
  uSgP:{value:Array.from({length:6},()=>new THREE.Vector4())},
  uSgN:{value:0}, uSignTex:{value:null}, uTime:{value:0}, uSignPow:{value:1},
  uSignTex2:{value:null},                                  // 一般の看板の字形
  uWB:{value:Array.from({length:46},()=>new THREE.Vector4(0,0,1,1))},   // 言葉ごとの字形の範囲（文字にぴったり合わせた箱）
  uLM:{value:null}, uLMo:{value:new THREE.Vector4(0,0,1,0)}, uLMGain:{value:1.25},   // 看板の照り返し（光の地図）
  uFlip:{value:1},                                         // 反射（上下反転）の描画中は -1
  uHot:{value:Array.from({length:8},()=>new THREE.Vector4(0,-1e4,0,1))}, uHotK:{value:[0,0,0,0,0,0,0,0]},   // 赤熱

const LIT_PRE=`#define NLIT ${NLIT}

function addScreensAtCrossing(){
  const X=XL[2], Z=ZL[2];
  const corners=[[X-XW[2]/2,Z-ZW[2]/2],[X+XW[2]/2,Z-ZW[2]/2],[X-XW[2]/2,Z+ZW[2]/2],[X+XW[2]/2,Z+ZW[2]/2]];
  const used=new Set();
  for(const [qx,qz] of corners){
    if(SIGNS.length>=6) break;
    let best=null, bd=1e9;
    for(const b of blds){
      if(used.has(b)||b.noScr||b.H*VOX<30||b.style==='tree'||b.style==='gate'||b.style==='car') continue;
      const bx=Math.max(b.ox,Math.min(qx,b.ox+b.W*VOX)), bz=Math.max(b.oz,Math.min(qz,b.oz+b.D*VOX));
      const d=Math.hypot(bx-qx,bz-qz);
      if(d<bd&&d<30){ bd=d; best=b; }
    }
    if(!best) continue;
    used.add(best);
    const b=best, cx=b.ox+b.W*VOX/2, cz=b.oz+b.D*VOX/2;
    // 交差点の中心を向く面（x か z のどちらか）
    const dx=X-cx, dz=Z-cz;
    const alongX=Math.abs(dx)*b.D>Math.abs(dz)*b.W;               // 東西どちらかの面を使う
    const n=alongX?[Math.sign(dx),0]:[0,Math.sign(dz)];
    // 実際の壁の位置を、ボクセルから測る（張り出した看板の分は除くため中央の列で見る）
    const y0v=Math.max(6,(b.H*.30)|0), y1v=Math.min(b.H-2,y0v+12);
    let ext=-1e9;
    for(let y=y0v;y<y1v;y++){
      if(alongX){ const z=(b.D/2)|0; for(let x=0;x<b.W;x++) if(b.vox[x+b.W*(y+b.H*z)]){ const e=n[0]>0?x+1:-x; if(e>ext) ext=e; } }
      else { const x=(b.W/2)|0; for(let z=0;z<b.D;z++) if(b.vox[x+b.W*(y+b.H*z)]){ const e=n[1]>0?z+1:-z; if(e>ext) ext=e; } }
    }
    if(ext<-1e8) continue;
    const plane=alongX?b.ox+(n[0]>0?ext:-ext)*VOX:b.oz+(n[1]>0?ext:-ext)*VOX;
    const faceW=(alongX?b.D:b.W)*VOX, w=Math.min(24,faceW-3), h=Math.min(16,(y1v-y0v)*VOX);
    if(w<8) continue;
    const R=[n[1],-n[0]];                                         // 正面から見た右方向
    const mid=alongX?cz:cx;
    const o=alongX?[plane,y0v*VOX,mid-R[1]*w/2]:[mid-R[0]*w/2,y0v*VOX,plane];
    addSign(o,R,w,h,SIGN_ATLAS.vision,2,0,b);
  }
}
/* ══════════ 東急歌舞伎町タワー ══════════
   地上48階・約225m。低層・中層・高層の3段にセットバック。外装のモチーフは「噴水」：
   低層は波模様、中高層は波のような窓、先端の白い部分が水しぶき（遠くから白波が立って見える）。
   シネシティ広場をはさんで新宿東宝ビルと向き合い、広場側に大型ディスプレイ */
function mkKabukiTower(fx,fz){
  const W=42, D=42, H=153, HH=165, T1=77, T2=124;
  const b=mkProp(fx,fz,W,HH,D,'tower',(set,fill)=>{
    for(let y=0;y<H;y++){
      const ins=y<T1?0:(y<T2?4:8);
      const x0=ins, x1=W-1-ins, z0=ins, z1=D-1-ins;
      const slab=(y%6===0);
      for(let z=z0;z<=z1;z++) for(let x=x0;x<=x1;x++){
        const edge=(x===x0||x===x1||z===z0||z===z1);
        if(!edge&&!slab) continue;
        if(!edge){ set(x,y,z,1); continue; }
        const u=(x===x0||x===x1)?z:x, face=(x===x0?0:(x===x1?1:(z===z0?2:3)));
        const wv=y+2.2*Math.sin(u*0.32+face*1.7+y*0.05);
        const dens=y<T1?11:(y<T2?8:5);
        const isWave=(((wv%dens)+dens)%dens)<(y<T1?1.2:(y<T2?1.6:2.3));    // 上へ行くほど白い波が密になる
        let m;
        if(y<3) m=(u%4===0)?5:3;                                         // 1F：ガラスの入口
        else if(y<9) m=((u+y)%3===0)?22:25;                              // 低層：アルミの波模様
        else if(isWave) m=((u+y)%7===0)?28:22;                           // 白い波（一部は夜に光る）
        else if(y<T1) m=((u*3+y)%5===0)?4:2;                             // 劇場・映画館：窓は少なめ
        else m=(((u+y*2)%4)<2)?officeWin(x,y,z,7,3):2;                   // ホテル：灯った窓
        set(x,y,z,m);
      }
      if(y===T1-1||y===T2-1){ const i2=y===T1-1?0:4; for(let z=i2;z<=D-1-i2;z++) for(let x=i2;x<=W-1-i2;x++) set(x,y+1,z,22); }
    }
    for(let z=8;z<=D-9;z++) for(let x=8;x<=W-9;x++){                    // 先端：水しぶきの白いギザギザの冠
      if(!(x===8||x===W-9||z===8||z===D-9)) continue;
      const hg=2+(((Math.sin(x*1.3+z*0.7)*0.5+0.5)*9)|0);
      for(let k=0;k<hg;k++) set(x,H+k,z,(k===hg-1||((x+z+k)%5===0))?28:22);
    }
    set(W>>1,H+10,D>>1,19); set(8,H+1,8,19); set(W-9,H+1,D-9,19);      // 航空障害灯
  });
  if(b) addSign([fx,9,fz+D*VOX/2-11],[0,1],22,13,SIGN_ATLAS.vision,2,0,b);   // 広場側の大型ディスプレイ
  return b;
}
/* ══════════ QFRONT ══════════
   交差点の角に建つ地上8階の商業ビル。駅側の正面全体がガラスの壁面ビジョン（19m×約24m）、
   交差点側の側面は大型広告。スクランブル交差点のランドマーク */
function mkQFront(fx,fz){
  const W=22, D=16, H=28, HH=32;
  const b=mkProp(fx,fz,W,HH,D,'office',(set,fill)=>{
    for(let y=0;y<H;y++){
      const slab=(y%3===0);
      for(let z=0;z<D;z++) for(let x=0;x<W;x++){
        const edge=(x===0||x===W-1||z===0||z===D-1);
        if(!edge&&!slab) continue;
        let m=1;
        if(edge){
          if(z===0) m=(y<3)?3:2;                                        // 正面（駅側）：全面ガラス
          else if(x===0) m=(y<3)?3:25;                                  // 交差点側の側面：広告の面
          else m=(y%3===1&&x%3===1)?officeWin(x,y,z,5,2):25;
        }
        set(x,y,z,m);
      }
    }
    fill(0,H,0,W-1,H,D-1,1);
    fill(2,H+1,3,W-3,H+3,D-5,25);
  });
  if(b){
    b.noScr=true;
    addSign([fx+W*VOX/2+9.5,6,fz],[-1,0],19,24,SIGN_ATLAS.vision,2,0,b);          // 正面の壁面ビジョン
    addSign([fx,5,fz+D*VOX/2-9],[0,1],18,20,SIGN_ATLAS.vision,2,0,b);             // 側面の大型広告
  }

}
/* ══════════ 渋谷センター街の入口アーチ ══════════
   QFRONTの脇がセンター街の入口。入口のアーチに「渋谷センター街」の看板と、
   バスケットボールのモニュメント（2011年にメイン通りを「バスケットボールストリート」と改名） */
function mkCenterGaiGate(fx,fz,span){
  const fw=span+2, D=3, H=13, X0=2, X1=fw+1, W=fw+4;
  const b=mkProp(fx,fz,W,H,D,'gate',(set,fill)=>{
    for(let y=0;y<4;y++){ set(X0,y,1,26); set(X1,y,1,26); }      // 柱
    fill(X0,4,0,X1,5,D-1,26);                                      // 看板の面（暗い地。文字と電球はシェーダーで描く）
    // バスケットボールのモニュメント（看板の上の中央）
    const cx=(X0+X1)/2, cy=7.3, r=1.35;                           // 直径約2.7m
    for(let y=5;y<=10;y++) for(let z=0;z<D;z++) for(let x=Math.floor(cx-r-1);x<=Math.ceil(cx+r+1);x++){
      const dx=x+.5-cx-.5, dy=y+.5-cy, dz=(z-1)*1.0;
      if(dx*dx+dy*dy+dz*dz<=r*r) set(x,y,z,45);
    }

  });
  if(b){
    const y0=4*VOX, w=(X1-X0+1)*VOX, h=2*VOX;
    addSign([fx+(X1+1)*VOX,y0,fz],[-1,0],w,h,SIGN_ATLAS.center,1,0,b);   // 交差点側（北向きの面）
  }
  return b;
}
/* 看板を登録する。o＝正面から見て左下の点、rgt＝正面から見た右方向(x,z) */
function addSign(o,rgt,w,h,atlas,kind,pitch,bld){
  if(SIGNS.length>=6) return;
  SIGNS.push({o:o,r:rgt,w:w,h:h,a:atlas,k:kind,p:pitch,b:bld});
}
function updSigns(dt){
  LITU.uTime.value+=dt;
  LITU.uSignPow.value=blackout?0:1;                        // 停電で消える
  LITU.uSgN.value=SIGNS.length;
  for(let i=0;i<SIGNS.length;i++){
    const G2=SIGNS[i];
    const dmg=G2.b&&G2.b.init?Math.max(0,1-G2.b.live/G2.b.init):0;
    const gone=G2.b&&(G2.b.toppled||G2.b.toppling||dmg>0.45);          // 倒れた・大破した壁の看板は描かない
    LITU.uSgO.value[i].set(G2.o[0],G2.o[1],G2.o[2],gone?0:G2.w);
    LITU.uSgR.value[i].set(G2.r[0],G2.r[1],G2.h,0);
    LITU.uSgA.value[i].set(G2.a[0],G2.a[1],G2.a[2],G2.a[3]);
    LITU.uSgP.value[i].set(G2.k,G2.p,dmg,i*1.37);

}
const HOT=[];
function addHot(x,y,z,r,k,tau){
  for(const h of HOT){
    if(Math.abs(h.x-x)+Math.abs(h.y-y)+Math.abs(h.z-z)<Math.min(h.r,r)*.5){
      h.k=Math.min(1.4,h.k+k*.5); h.r=Math.max(h.r,r); h.tau=Math.max(h.tau,tau); return; }
  }
  if(HOT.length>=24){ let wi=0; for(let i=1;i<HOT.length;i++) if(HOT[i].k<HOT[wi].k) wi=i; HOT.splice(wi,1); }
  HOT.push({x:x,y:y,z:z,r:r,k:k,tau:tau,s:0});
}
function updHot(dt){
  for(let i=HOT.length-1;i>=0;i--){ const h=HOT[i]; h.k*=Math.exp(-dt/h.tau); if(h.k<.02) HOT.splice(i,1); }
  const cx=camera.position.x, cz=camera.position.z;
  for(const h of HOT) h.s=h.k*h.r/(Math.hypot(h.x-cx,h.z-cz)+30);
  HOT.sort((a,b)=>b.s-a.s);
  const P=LITU.uHot.value, K=LITU.uHotK.value;
  for(let i=0;i<8;i++){ const h=HOT[i];
    if(h){ P[i].set(h.x,h.y,h.z,h.r); K[i]=h.k; } else { P[i].set(0,-1e4,0,1); K[i]=0; } }
}
let LITQ=[], cityPower=1, cityPowerT=1, litT=0;
const _litCand=[], _fireLs=[];
/* 一時的な光を足す。近くに同じ光があれば統合し、動く光源（噴射炎）を1灯として扱う */
function addLight(x,y,z,r,col,inten,tau){
  for(let i=0;i<LITQ.length;i++){
    const L=LITQ[i];
    if(Math.abs(L.x-x)+Math.abs(L.y-y)+Math.abs(L.z-z) < Math.min(L.r,r)*0.3){
      L.x=x; L.y=y; L.z=z; L.r=Math.max(L.r,r);
      if(inten>L.i){ L.i=inten; L.c=col; L.tau=tau; }
      return;
    }
  }
  if(LITQ.length>=48){
    let wi=0, wv=1e9;
    for(let i=0;i<LITQ.length;i++){ const v=LITQ[i].i*LITQ[i].r; if(v<wv){ wv=v; wi=i; } }
    if(inten*r<=wv) return;
    LITQ.splice(wi,1);
  }
  LITQ.push({x:x,y:y,z:z,r:r,c:col,i:inten,tau:tau,s:0});
}
function updLights(dt){

/* ══════════ 走る車 ══════════

const TRF={body:null, cabin:null, lamp:null, cars:[], lanes:[]};

const CAR_COLS=[[.80,.80,.82],[.09,.09,.10],[.52,.07,.07],[.16,.22,.34],[.60,.61,.63],[.86,.85,.81],[.10,.18,.12],[.80,.80,.82]];

let trfT=0, trfChk=0;

  const C=TRF.cars;
  trfT+=dt;
  // 車線ごとに、前の車との車間を保つ
  for(let i=0;i<C.length;i++){ const c=C[i]; if(c.dead||c.parked) continue;
    const L=TRF.lanes[c.l];
    let gap=1e9;
    for(let j=0;j<C.length;j++){ if(i===j||C[j].dead||C[j].parked||C[j].l!==c.l) continue;
      let d=(C[j].t-c.t)*L.dir; if(d<=0) d+=(L.b-L.a); if(d<gap) gap=d; }
    let want=Math.min(c.vmax,Math.max(0,(gap-11)*.9));
    for(const I of SIG.list){                                   // 信号：赤と黄では交差点の手前で止まる
      const through=L.ax===2?Math.abs(L.c-I.x)<I.hw:Math.abs(L.c-I.z)<I.hd;
      if(!through) continue;
      const lo=L.ax===2?I.z-I.hd:I.x-I.hw, hi=L.ax===2?I.z+I.hd:I.x+I.hw;
      const dd=L.dir>0?lo-c.t:c.t-hi;
      if(dd<=0||dd>34) continue;
      const st=sigState(I), g=L.ax===2?st[0]:st[1];
      if(g<.4||(g<.6&&dd>9)) want=Math.min(want,Math.max(0,(dd-4)*.8));
    }
    c.v+=(want-c.v)*Math.min(1,dt*(want<c.v?3.5:1.2));
    c.t+=c.v*L.dir*dt;
    if(c.t>L.b) c.t=L.a; else if(c.t<L.a) c.t=L.b;
  }
  // 落ちてくる塊に当たると吹き飛ぶ（負荷を抑えて数フレームに1回）
  trfChk+=dt;
  if(trfChk>=1/15){ trfChk=0; for(const c of C){ if(c.dead) continue;
    const xz=carXZ(c), cx=xz[0], cz=xz[1];
    for(let k=0;k<chunks.length;k++){ const q=chunks[k];
      if(q.p[1]<14&&Math.abs(q.p[0]-cx)<6&&Math.abs(q.p[2]-cz)<6){ wreckCar(c, q.src==='nuke'?'nuke':'domino'); break; } } } }
  for(let i=C.length-1;i>=0;i--) if(C[i].dead) C.splice(i,1);
  // 描画
  const MB=TRF.body.instanceMatrix.array, MC=TRF.cabin.instanceMatrix.array, ML=TRF.lamp.instanceMatrix.array;
  const CB=TRF.body.instanceColor.array, CC=TRF.cabin.instanceColor.array, CL=TRF.lamp.instanceColor.array;
  const put=(M,o,cs,sn,x,y,z)=>{ M[o]=cs;M[o+1]=0;M[o+2]=-sn;M[o+3]=0; M[o+4]=0;M[o+5]=1;M[o+6]=0;M[o+7]=0;
    M[o+8]=sn;M[o+9]=0;M[o+10]=cs;M[o+11]=0; M[o+12]=x;M[o+13]=y;M[o+14]=z;M[o+15]=1; };
  for(let i=0;i<C.length;i++){
    const c=C[i];
    const xz=carXZ(c), x=xz[0], z=xz[1];
    const ang=carAng(c);                                 // 車体は x 軸向きに作ってある。進行方向へ回す
    const cs=Math.cos(ang), sn=Math.sin(ang);
    put(MB,i*16,cs,sn,x,0,z); put(MC,i*16,cs,sn,x,0,z);
    CB[i*3]=c.col[0]; CB[i*3+1]=c.col[1]; CB[i*3+2]=c.col[2];
    CC[i*3]=8.08; CC[i*3+1]=8.10; CC[i*3+2]=8.13;                  // ガラスの印（種類4）
    const brake=c.v<c.vmax*.6, prk=!!c.parked;
    const lp=[[2.22,.62,.62,1],[2.22,.62,-.62,1],[-2.22,.66,.62,0],[-2.22,.66,-.62,0]];
    for(let k=0;k<4;k++){ const q=lp[k], lx=q[0]*cs+q[2]*sn, lz=-q[0]*sn+q[2]*cs, o=(i*4+k);
      put(ML,o*16,cs,sn,x+lx,q[1],z+lz);
      if(prk){ CL[o*3]=q[3]?.30:.22; CL[o*3+1]=q[3]?.30:.05; CL[o*3+2]=q[3]?.30:.04; }              // 駐車中は消灯
      else if(q[3]){ CL[o*3]=5.0; CL[o*3+1]=4.95; CL[o*3+2]=4.82; }                        // ヘッドライト（強い発光の印）
      else { const b=brake?1.0:.55; CL[o*3]=4+b; CL[o*3+1]=4+.06*b; CL[o*3+2]=4+.04*b; } }   // テールランプ（減速で明るく）
  }
  let nr=0;
  const MR=TRF.roof.instanceMatrix.array, CR=TRF.roof.instanceColor.array;
  for(let i=0;i<C.length;i++){ const c=C[i]; if(!c.taxi||c.parked) continue;
    const xz=carXZ(c), x=xz[0], z=xz[1];
    const ang=carAng(c);
    put(MR,nr*16,Math.cos(ang),Math.sin(ang),x-.3*Math.cos(ang),2.12,z+.3*Math.sin(ang));
    CR[nr*3]=4.98; CR[nr*3+1]=4.82; CR[nr*3+2]=4.45; nr++; }       // 行灯（強い発光の印）
  TRF.roof.count=nr; TRF.roof.instanceMatrix.needsUpdate=true; TRF.roof.instanceColor.needsUpdate=true;
  TRF.body.count=C.length; TRF.cabin.count=C.length; TRF.lamp.count=C.length*4;
  for(const m of [TRF.body,TRF.cabin,TRF.lamp]){ m.instanceMatrix.needsUpdate=true; m.instanceColor.needsUpdate=true; }
}

/* ══════════ 歩く人・赤提灯 ══════════
   街に人がいないと、生活の気配がない。歩道を行き交う人と、渋谷のスクランブル交差点を渡る人の波、
   細い通りの店先の赤提灯を置く。爆発が起きると周りの人は逃げ去る（傷つく描写はしない） */
const PED={body:null, head:null, list:[], t:0, scr:false};
const PED_MAX=900;
// 服の色：夜の路面に沈まないよう、明るい色を多めにする（白・ベージュ・デニム・赤など）
const CLOTH=[[.86,.86,.88],[.78,.72,.62],[.36,.44,.62],[.62,.58,.52],[.66,.18,.20],[.30,.46,.34],[.84,.76,.60],[.20,.20,.22],[.50,.54,.64],[.92,.90,.86]];
function initPeds(){
  const box=(w,h,d,y)=>{ const g=new THREE.BoxGeometry(w,h,d).toNonIndexed(); g.translate(0,y,0);
    g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*3).fill(1),3)); return g; };
  const mat=new THREE.MeshBasicMaterial({vertexColors:true,fog:true}); setupLitMaterial(mat);
  const mk=(geo)=>{ const m=new THREE.InstancedMesh(geo,mat,PED_MAX); m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(PED_MAX*3),3); m.count=0; m.frustumCulled=false; scene.add(m); return m; };
  PED.body=mk(box(.46,1.34,.28,.67));
  PED.head=mk(box(.22,.26,.24,1.49));
}
function buildPeds(){
  PED.list.length=0; PED.t=0; PED.scr=false;
  if(!PED.body) return;
  const dens=(MAPID===0?.030:(MAPID===1?.032:.008))*QUAL.pedK;
  const put=(x,z,o)=>{ if(PED.list.length>=PED_MAX||bldAt(x,1,z)) return; o.x=x; o.z=z;
    o.col=CLOTH[(Math.random()*CLOTH.length)|0]; o.hair=Math.random()<.85?.06:.32; o.hs=rf(.92,1.08); o.ph=Math.random()*6.28; PED.list.push(o); };
  const z0=CITY.z0+6, z1=CITY.z1-6, x0=CITY.x0+6, x1=CITY.x1-6;
  for(let i=0;i<XL.length;i++) for(const sd of [-1,1]){
    const c=XL[i]+sd*(XW[i]/2-1.5), n=((z1-z0)*dens)|0;
    for(let k=0;k<n;k++){ const t=rf(z0,z1); put(c+rf(-.5,.5),t,{m:0,ax:2,c:c,t:t,dir:Math.random()<.5?-1:1,v:rf(1.05,1.55),a:z0,b:z1}); }
  }
  for(let j=0;j<ZL.length;j++) for(const sd of [-1,1]){
    const c=ZL[j]+sd*(ZW[j]/2-1.5), n=((x1-x0)*dens)|0;
    for(let k=0;k<n;k++){ const t=rf(x0,x1); put(t,c+rf(-.5,.5),{m:0,ax:0,c:c,t:t,dir:Math.random()<.5?-1:1,v:rf(1.05,1.55),a:x0,b:x1}); }
  }
  if(MAPID===1&&CGAI){                                      // センター街は人通りが多い
    for(let k=0;k<90;k++){ const x=rf(CGAI.x0+1,CGAI.x1-1), t=rf(CGAI.z0+3,CGAI.z1-2);
      put(x,t,{m:0,ax:2,c:x,t:t,dir:Math.random()<.5?-1:1,v:rf(1.0,1.45),a:CGAI.z0+3,b:CGAI.z1-2}); }
  }
  if(MAPID===1){                                            // スクランブル交差点の四つ角で信号を待つ人
    PED.corners=[[-1,-1],[1,-1],[-1,1],[1,1]].map(([sx,sz])=>[XL[2]+sx*(XW[2]/2-1.2),ZL[2]+sz*(ZW[2]/2-1.2),sx,sz]);
    PED.corners.forEach((q,ci)=>{ for(let k=0;k<34;k++) put(q[0]+q[2]*rf(0,4),q[1]+q[3]*rf(0,4),{m:2,ci:ci,v:rf(1.3,1.9)}); });
  }
}
function pedsBlast(x,z,r){                                  // 爆発の近くの人は逃げ去る
  for(const p of PED.list){ if(p.m===9) continue;
    const dx=p.x-x, dz=p.z-z, d=Math.hypot(dx,dz);
    if(d<r) p.m=8;                                          // 爆心のすぐ近く：その場から消える
    else if(d<r+85){ p.m=9; const sp=rf(4.5,7)/(d||1); p.vx=dx*sp; p.vz=dz*sp; p.life=rf(2.5,4.5); }
  }
}
function updPeds(dt){
  if(!PED.body) return;
  PED.t+=dt;
  const L=PED.list;
  if(MAPID===1&&PED.corners){                               // 50秒周期：26秒は車、24秒は人がスクランブルで渡る
    const scr=(PED.t%50)>26;
    if(scr&&!PED.scr) for(const p of L) if(p.m===2){
      let tc=(Math.random()*4)|0; if(tc===p.ci) tc=3-p.ci;
      const q=PED.corners[tc]; p.tc=tc; p.tx=q[0]+q[2]*rf(0,4); p.tz=q[1]+q[3]*rf(0,4); p.m=3; }
    PED.scr=scr;
  }
  let w=0;
  for(let i=0;i<L.length;i++){ const p=L[i];
    if(p.m===8) continue;
    if(p.m===9){ p.x+=p.vx*dt; p.z+=p.vz*dt; p.life-=dt; if(p.life<=0) continue; }
    else if(p.m===0){
      p.t+=p.dir*p.v*dt;
      if(p.t>p.b) p.t=p.a; else if(p.t<p.a) p.t=p.b;
      if(p.ax===2) p.z=p.t; else p.x=p.t;
      if(((PED.t*4+i)|0)%40===0&&bldAt(p.ax===2?p.x:p.x+p.dir*1.5,1,p.ax===2?p.z+p.dir*1.5:p.z)) p.dir*=-1;   // 建物にぶつかったら引き返す
    } else if(p.m===3){
      const dx=p.tx-p.x, dz=p.tz-p.z, d=Math.hypot(dx,dz);
      if(d<.4){ p.m=2; p.ci=p.tc; } else { p.x+=dx/d*p.v*dt; p.z+=dz/d*p.v*dt; }
    }
    L[w++]=p;
  }
  L.length=w;
  const MB=PED.body.instanceMatrix.array, MH=PED.head.instanceMatrix.array, CB=PED.body.instanceColor.array, CH=PED.head.instanceColor.array;
  for(let i=0;i<w;i++){ const p=L[i];
    let hx=0, hz=1;
    if(p.m===0){ if(p.ax===2) hz=p.dir; else { hx=p.dir; hz=0; } }
    else if(p.m===3){ hx=p.tx-p.x; hz=p.tz-p.z; }
    else if(p.m===9){ hx=p.vx; hz=p.vz; }
    const hl=Math.hypot(hx,hz)||1, cs=hz/hl, sn=hx/hl;
    const moving=p.m!==2, bob=moving?Math.abs(Math.sin(PED.t*(p.m===9?13:8)+p.ph))*.05:0;
    const o=i*16, hs=p.hs;
    for(const M of [MB,MH]){ M[o]=cs;M[o+1]=0;M[o+2]=-sn;M[o+3]=0; M[o+4]=0;M[o+5]=hs;M[o+6]=0;M[o+7]=0;
      M[o+8]=sn;M[o+9]=0;M[o+10]=cs;M[o+11]=0; M[o+12]=p.x;M[o+13]=bob;M[o+14]=p.z;M[o+15]=1; }
    CB[i*3]=p.col[0]; CB[i*3+1]=p.col[1]; CB[i*3+2]=p.col[2];
    CH[i*3]=p.hair; CH[i*3+1]=p.hair*.9; CH[i*3+2]=p.hair*.85;
  }
  for(const m of [PED.body,PED.head]){ m.count=w; m.instanceMatrix.needsUpdate=true; m.instanceColor.needsUpdate=true; }
}
const LAN={mesh:null, list:[], t:0, dirty:false};
function initLanterns(){
  const g=new THREE.SphereGeometry(1,12,10);
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*3).fill(1),3));
  const mat=new THREE.MeshBasicMaterial({vertexColors:true,fog:true}); setupLitMaterial(mat);
  LAN.mesh=new THREE.InstancedMesh(g,mat,220);
  LAN.mesh.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(220*3),3);
  LAN.mesh.count=0; LAN.mesh.frustumCulled=false; scene.add(LAN.mesh);
}
function buildLanterns(){
  LAN.list.length=0; LAN.dirty=true;
  if(!LAN.mesh||MAPID===2) return;
  const push=(x,z,sx,sz,red)=>{ if(LAN.list.length<218){ LAN.list.push({x:x,z:z,sx:sx,sz:sz,red:red}); } };
  for(let i=0;i<XL.length;i++) if(XW[i]<=16) for(const sd of [-1,1]){
    const c=XL[i]+sd*(XW[i]/2-0.6);
    for(let z=CITY.z0+10;z<CITY.z1-10;z+=rf(7,13)){
      if(Math.random()>.55||!bldAt(c+sd*1.9,3,z)) continue;
      const red=Math.random()<.8; push(c,z,sd,0,red); push(c,z+.95,sd,0,red); }
  }
  for(let j=0;j<ZL.length;j++) if(ZW[j]<=16) for(const sd of [-1,1]){
    const c=ZL[j]+sd*(ZW[j]/2-0.6);
    for(let x=CITY.x0+10;x<CITY.x1-10;x+=rf(7,13)){
      if(Math.random()>.55||!bldAt(x,3,c+sd*1.9)) continue;
      const red=Math.random()<.8; push(x,c,0,sd,red); push(x+.95,c,0,sd,red); }

}
function lanternsBlast(x,z,r){
  for(const q of LAN.list) if(!q.dead&&Math.hypot(q.x-x,q.z-z)<r*1.2){ q.dead=true; LAN.dirty=true;
    for(let k=0;k<6;k++) spark(q.x,2.9,q.z,rf(-8,8),rf(2,9),rf(-8,8),rf(.2,.5),1,.4,.2); }
}
function updLanterns(dt){
  if(!LAN.mesh) return;
  LAN.t+=dt;
  if(LAN.t>2){ LAN.t=0;                                     // 支えのビルが崩れたら落ちて消える
    for(const q of LAN.list) if(!q.dead&&!bldAt(q.x+q.sx*1.9,3,q.z+q.sz*1.9)){ q.dead=true; LAN.dirty=true; } }
  if(!LAN.dirty) return;
  LAN.dirty=false;
  const L=LAN.list.filter(q=>!q.dead); LAN.list=L;
  const M=LAN.mesh.instanceMatrix.array, C=LAN.mesh.instanceColor.array;
  for(let i=0;i<L.length;i++){ const q=L[i], o=i*16;
    M[o]=.34;M[o+1]=0;M[o+2]=0;M[o+3]=0; M[o+4]=0;M[o+5]=.48;M[o+6]=0;M[o+7]=0; M[o+8]=0;M[o+9]=0;M[o+10]=.34;M[o+11]=0;
    M[o+12]=q.x;M[o+13]=2.9;M[o+14]=q.z;M[o+15]=1;
    if(q.red){ C[i*3]=4.95; C[i*3+1]=4.14; C[i*3+2]=4.07; } else { C[i*3]=4.98; C[i*3+1]=4.9; C[i*3+2]=4.72; }   // 強い発光の印
  }
  LAN.mesh.count=L.length; LAN.mesh.instanceMatrix.needsUpdate=true; LAN.mesh.instanceColor.needsUpdate=true;
}

/* ══════════ 信号機 ══════════
   幹線道路どうしの交差点に信号を立てる。車は赤と黄で交差点の手前に止まり、列を作る。
   渋谷のスクランブル交差点は、人が渡る間は全方向が赤になる */
const SIG={list:[], t:0, pole:null, head:null, lamp:null};
function initSignals(){
  const box=(w,h,d,y)=>{ const g=new THREE.BoxGeometry(w,h,d).toNonIndexed(); g.translate(0,y,0);
    g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*3).fill(1),3)); return g; };
  const mat=new THREE.MeshBasicMaterial({vertexColors:true,fog:true}); setupLitMaterial(mat);
  const mk=(geo,n)=>{ const m=new THREE.InstancedMesh(geo,mat,n); m.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(n*3),3);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); m.count=0; m.frustumCulled=false; scene.add(m); return m; };
  SIG.pole=mk(box(.22,5.6,.22,2.8),160);
  SIG.head=mk(box(1.15,.36,.26,0),320);
  SIG.lamp=mk(box(.26,.26,.06,0),960);
}
function sigState(I){                                        // [南北の車, 東西の車]：1青 0.5黄 0赤
  if(I.scr){ const c=PED.t%50; return c<12?[1,0]:(c<13?[.5,0]:(c<25?[0,1]:(c<26?[0,.5]:[0,0]))); }
  const t=(SIG.t+I.off)%50;
  return t<22?[1,0]:(t<25?[.5,0]:(t<47?[0,1]:[0,.5]));
}
function buildSignals(){
  SIG.list.length=0; SIG.t=0;
  if(!SIG.pole) return;
  for(let i=0;i<XL.length;i++) for(let j=0;j<ZL.length;j++){
    if(XW[i]<20||ZW[j]<20) continue;
    SIG.list.push({x:XL[i],z:ZL[j],hw:XW[i]/2,hd:ZW[j]/2,scr:(MAPID===1&&i===2&&j===2),off:((i*7+j*13)%5)*9});
  }
  const MP=SIG.pole.instanceMatrix.array, CP=SIG.pole.instanceColor.array;
  let n=0;
  for(const I of SIG.list) for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
    const o=n*16;
    MP.fill(0,o,o+16); MP[o]=1;MP[o+5]=1;MP[o+10]=1;MP[o+15]=1; MP[o+12]=I.x+sx*(I.hw-.6); MP[o+13]=0; MP[o+14]=I.z+sz*(I.hd-.6);
    CP[n*3]=.16; CP[n*3+1]=.17; CP[n*3+2]=.18; n++;
  }
  SIG.pole.count=n; SIG.pole.instanceMatrix.needsUpdate=true; SIG.pole.instanceColor.needsUpdate=true;
}
function updSignals(dt){
  if(!SIG.head) return;
  SIG.t+=dt;
  const MH=SIG.head.instanceMatrix.array, CH=SIG.head.instanceColor.array, ML=SIG.lamp.instanceMatrix.array, CL=SIG.lamp.instanceColor.array;
  let nh=0, nl=0;
  const put=(M,o,rot,x,y,z)=>{ const cs=Math.cos(rot), sn=Math.sin(rot);
    M[o]=cs;M[o+1]=0;M[o+2]=-sn;M[o+3]=0; M[o+4]=0;M[o+5]=1;M[o+6]=0;M[o+7]=0; M[o+8]=sn;M[o+9]=0;M[o+10]=cs;M[o+11]=0; M[o+12]=x;M[o+13]=y;M[o+14]=z;M[o+15]=1; };
  const LC=[[.10,.95,.72],[1,.72,.05],[1,.08,.05]];          // 青・黄・赤（日本の信号の青は青緑）
  for(const I of SIG.list){
    const st=sigState(I);
    // 各角に2つの灯器：南北の車に向けたものと、東西の車に向けたもの（交差点の向こう側に立つ）
    for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
      const px=I.x+sx*(I.hw-.6), pz=I.z+sz*(I.hd-.6);
      for(const ax of [2,0]){
        const rot=ax===2?(sz<0?0:Math.PI):(sx<0?Math.PI/2:-Math.PI/2);   // 向こうから来る車の方を向く
        const g=ax===2?st[0]:st[1];
        const hx=px+(ax===0?0:-sx*.7), hz=pz+(ax===2?0:-sz*.7);
        put(MH,nh*16,rot,hx,5.3,hz); CH[nh*3]=.14; CH[nh*3+1]=.15; CH[nh*3+2]=.16; nh++;
        for(let k=0;k<3;k++){
          const on=(k===0&&g>.99)||(k===1&&g>.4&&g<.6)||(k===2&&g<.4);
          const off=(k-1)*.36, cs=Math.cos(rot), sn=Math.sin(rot);
          const lx=hx+off*cs+.14*sn, lz=hz-off*sn+.14*cs;
          put(ML,nl*16,rot,lx,5.3,lz);
          const c=LC[k];
          if(on){ CL[nl*3]=c[0]+4; CL[nl*3+1]=c[1]+4; CL[nl*3+2]=c[2]+4; }   // 点いている灯は強い発光
          else { CL[nl*3]=c[0]*.10; CL[nl*3+1]=c[1]*.10; CL[nl*3+2]=c[2]*.10; }
          nl++;
        }
      }
    }
  }
  SIG.head.count=nh; SIG.lamp.count=nl;
  for(const m of [SIG.head,SIG.lamp]){ m.instanceMatrix.needsUpdate=true; m.instanceColor.needsUpdate=true; }
}

/* ══════════ 濡れた路面の反射 ══════════
   雨上がりの歌舞伎町は、路面にネオンが映り込む。
   世界を上下反転して半分の解像度で描き、それを路面と地面に映す（平面反射）。
   同じカメラで反転した世界を描くと、反射は画面上のちょうど路面の位置に来る */
const WET={on:false, rt:null, ground:null,
  u:{uRefl:{value:null}, uScreen:{value:new THREE.Vector2(1,1)}, uWet:{value:0.0}, uWTime:{value:0}}};
const WET_LEVEL=0.85;
const WET_PRE=`uniform sampler2D uRefl; uniform vec2 uScreen; uniform float uWet, uWTime, uWetK; uniform vec3 uCam;
uniform sampler2D uLM; uniform vec4 uLMo; uniform float uLMGain, uSignPow;
varying vec3 vWPos;
float wH(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float wN(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(wH(i),wH(i+vec2(1.0,0.0)),f.x), mix(wH(i+vec2(0.0,1.0)),wH(i+vec2(1.0,1.0)),f.x), f.y); }
`;
const WET_MAIN=`
{ vec4 lm=texture2D(uLM,(vWPos.xz-uLMo.xy)*uLMo.z); outgoingLight+=lm.rgb*(0.10*uLMGain*uSignPow); }   // 看板の色の光だまり
if(uWet>0.001){
  vec2 suv=gl_FragCoord.xy/uScreen;
  float pn=wN(vWPos.xz*0.045)*0.65+wN(vWPos.xz*0.19)*0.35;
  float pud=smoothstep(0.50,0.66,pn);                       // 水たまり
  float wdist=1.0-smoothstep(150.0,460.0,length(vWPos.xz-uCam.xz));   // 遠くは反射を弱める
  float wet=mix(0.45,1.0,pud)*uWet*uWetK*wdist;
  vec2 rip=vec2(wN(vWPos.xz*1.3+vec2(uWTime*0.35,0.0))-0.5, wN(vWPos.xz*1.3-vec2(0.0,uWTime*0.3))-0.5);
  vec2 dist=rip*mix(0.010,0.003,pud);                       // 水面のゆらぎ
  float rough=mix(0.045,0.005,pud);                         // 乾き気味の所は反射が縦に伸びる
  vec3 rr=vec3(0.0);
  for(int i=0;i<6;i++){
    float o=(float(i)/5.0-0.5)*2.0*rough;
    rr+=texture2D(uRefl,suv+dist+vec2(0.0,o)).rgb;
  }
  rr/=6.0;
  vec3 V=normalize(uCam-vWPos);
  float F=0.02+0.98*pow(1.0-clamp(V.y,0.0,1.0),5.0);       // 浅い角度ほど強く映る
  outgoingLight=outgoingLight*(1.0-0.45*wet*pud)+rr*(mix(0.20,0.92,F)*wet);
}
`;
function setupWetMaterial(mat){
  mat.onBeforeCompile=(sh)=>{
    for(const k in WET.u) sh.uniforms[k]=WET.u[k];
    sh.uniforms.uWetK={value:(mat.userData&&mat.userData.wetK!==undefined)?mat.userData.wetK:1};
    sh.uniforms.uCam=LITU.uCam;
    sh.uniforms.uLM=LITU.uLM; sh.uniforms.uLMo=LITU.uLMo; sh.uniforms.uLMGain=LITU.uLMGain; sh.uniforms.uSignPow=LITU.uSignPow;
    sh.vertexShader='varying vec3 vWPos;\n'+sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n  vWPos=(modelMatrix*vec4(transformed,1.0)).xyz;');
    sh.fragmentShader=WET_PRE+sh.fragmentShader.replace('vec3 outgoingLight = reflectedLight.indirectDiffuse;',
      'vec3 outgoingLight = reflectedLight.indirectDiffuse;\n'+WET_MAIN);
  };
  mat.customProgramCacheKey=()=>'tt_wet_2';
  mat.needsUpdate=true;
}
function renderReflection(dt){
  WET.u.uWTime.value+=dt;
  if(!WET.on||!WET.rt){ WET.u.uWet.value=0; return; }
  WET.u.uWet.value=WET_LEVEL;
  WET.frame=(WET.frame|0)+1;
  if((WET.every|0)>1 && (WET.frame%WET.every)!==0 && WET.u.uRefl.value){ return; }   // 中画質では隔フレームで更新（前の結果を使い回す）
  const hide=[WET.ground,roadMesh,glowFloor,VFX.smoke,VFX.fire,DEB.mesh];   // 煙・火球・破片は反射に描かない（半透明の重なりが重い）
  const prev=[];
  for(let i=0;i<hide.length;i++){ const m=hide[i]; prev[i]=m?m.visible:false; if(m) m.visible=false; }
  const P=LITU.uLP.value;
  const flip=(s)=>{
    // 点光源・赤熱・看板も上下反転する（地面の下に写る世界を、正しい側から照らすため）
    for(let i=0;i<NLIT;i++) P[i].y=-P[i].y;
    for(const h of LITU.uHot.value) h.y=-h.y;
    for(let i=0;i<SIGNS.length;i++){ const u=LITU.uSgO.value[i]; u.y = s<0 ? -(u.y+LITU.uSgR.value[i].z) : -u.y-LITU.uSgR.value[i].z; }
    scene.scale.y=s; LITU.uFlip.value=s;
  };
  try{
    flip(-1);
    renderer.setRenderTarget(WET.rt);
    renderer.render(scene,camera);
    WET.u.uRefl.value=WET.rt.texture;
  }catch(e){ WET.u.uWet.value=0; }
  finally{
    if(scene.scale.y<0) flip(1);
    for(let i=0;i<hide.length;i++) if(hide[i]) hide[i].visible=prev[i];   // 元の可視状態へ（元々非表示だったものは非表示のまま）
    renderer.setRenderTarget(null);
  }
}

/* ══════════ 爆発・火花・衝撃波の演出（VFX） ══════════
   爆発は「色つきの球が膨らんで消える」だけだった。実際の爆発の構造で描き直す：
   ・火球：表面がうねる球。中心ほど高温（白→黄→橙→赤）で、冷えながら上昇する
   ・黒煙：うねる球。爆発や炎の光で照らされ、若い煙は内側の炎で赤く光る
   ・火花：速度の方向に伸びる光の筋
   いずれも1回の描画でまとめて描く */
const VFX={fire:null, smoke:null, spark:null, fa:[], sa:[], pa:[], dist:[], pops:[], popEl:null, lastStop:0};
const VFX_FMAX=72, VFX_PMAX=1400;
let VFX_SMAX=120;                                          // 画質プリセットで下げられる（描画先は120で確保）
let hitStopT=0, caPulse=0;
const VFX_VERT=`attribute vec4 aState;
uniform float uTime, uAmp;
varying float vN; varying vec3 vNrm; varying vec3 vView; varying vec4 vS; varying vec3 vWp;
float vh(vec3 p){ p=fract(p*0.3183099+vec3(0.1,0.2,0.3)); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(vh(i),vh(i+vec3(1.0,0.0,0.0)),f.x),mix(vh(i+vec3(0.0,1.0,0.0)),vh(i+vec3(1.0,1.0,0.0)),f.x),f.y),
             mix(mix(vh(i+vec3(0.0,0.0,1.0)),vh(i+vec3(1.0,0.0,1.0)),f.x),mix(vh(i+vec3(0.0,1.0,1.0)),vh(i+vec3(1.0,1.0,1.0)),f.x),f.y),f.z); }
float fbm3(vec3 p){ float s=0.0,a=0.5; for(int i=0;i<3;i++){ s+=a*vn3(p); p=p*2.03+vec3(3.1,1.7,5.3); a*=0.5; } return s/0.875; }
void main(){
  vS=aState;
  float t=uTime*0.8+aState.y*17.0;
  float n=fbm3(position*1.6+vec3(0.0,-t*0.7,t*0.2)+aState.y*9.0);
  vN=n;
  vec3 d=position*(1.0+(n-0.5)*2.0*(uAmp+0.22*aState.x));
  vec4 wp=modelMatrix*instanceMatrix*vec4(d,1.0);
  vWp=wp.xyz;
  vNrm=normalize(mat3(modelMatrix)*mat3(instanceMatrix)*normal);
  vView=normalize(cameraPosition-wp.xyz);
  gl_Position=projectionMatrix*viewMatrix*wp;
}`;
const FIRE_FRAG=`varying float vN; varying vec3 vNrm; varying vec3 vView; varying vec4 vS; varying vec3 vWp;
void main(){
  float fres=clamp(dot(normalize(vNrm),normalize(vView)),0.0,1.0);
  float T=vS.z*(1.0-vS.x*0.9)*(0.50+0.95*vN)*(0.40+0.60*fres);      // 温度
  vec3 c=mix(vec3(0.25,0.04,0.01),vec3(1.0,0.30,0.05),smoothstep(0.12,0.42,T));
  c=mix(c,vec3(1.0,0.64,0.18),smoothstep(0.42,0.72,T));
  c=mix(c,vec3(1.0,0.94,0.78),smoothstep(0.72,1.05,T));
  c*=1.0+2.4*smoothstep(0.55,1.25,T);                                 // 芯は強く光る
  float a=vS.w*smoothstep(0.0,0.4,fres)*smoothstep(0.06,0.28,T);
  gl_FragColor=vec4(c,a);
}`;
const SMOKE_FRAG=`#define NLIT ${NLIT}
uniform vec4 uLP[NLIT]; uniform vec4 uLC[NLIT];
uniform vec3 uStreetCol, uFogC, uCamP; uniform float uStreet, uStreetFall, uFogN, uFogF;
uniform sampler2D uLM; uniform vec4 uLMo; uniform float uLMGain, uSignPow;
varying float vN; varying vec3 vNrm; varying vec3 vView; varying vec4 vS; varying vec3 vWp;
void main(){
  float fres=clamp(dot(normalize(vNrm),normalize(vView)),0.0,1.0);
  bool dust=vS.z<-0.5;                                               // 崩落の土煙（砂色）
  vec3 base=dust?mix(vec3(0.44,0.42,0.39),vec3(0.64,0.61,0.57),vN):mix(vec3(0.15,0.14,0.135),vec3(0.30,0.28,0.26),vN);   // 粉塵は砕けたコンクリートと石膏の灰色（白く飛ばない）
  vec3 L=vec3(0.62,0.55,0.52)+uStreetCol*(uStreet*1.5*exp(-abs(vWp.y)*uStreetFall));   // 夜空の薄明かりと路面の光
  vec4 lm=texture2D(uLM,(vWp.xz-uLMo.xy)*uLMo.z);
  L+=lm.rgb*(uLMGain*uSignPow*1.6*exp(-abs(abs(vWp.y)-lm.a*100.0)/24.0));            // 看板の色に染まる
  for(int i=0;i<NLIT;i++){ vec3 dv=uLP[i].xyz-vWp; float d=length(dv); float at=clamp(1.0-d/uLP[i].w,0.0,1.0); L+=uLC[i].rgb*(uLC[i].a*at*at*1.3); }
  vec3 col=base*L;
  if(!dust) col+=vec3(1.0,0.34,0.06)*(vS.z*(1.0-vS.x)*(1.0-vS.x)*smoothstep(0.35,0.95,vN)*2.2);   // 内側の炎に照らされる
  float fg=clamp((length(vWp-uCamP)-uFogN)/(uFogF-uFogN),0.0,1.0);
  col=mix(col,uFogC,fg);
  float a=vS.w*smoothstep(0.0,0.6,fres)*(0.65+0.35*vN);
  gl_FragColor=vec4(col,a);
}`;
const SPARK_VERT=`attribute vec3 aP; attribute vec3 aV; attribute vec4 aC;
uniform float uLen; uniform vec2 uRes;
varying vec4 vC; varying float vU;
void main(){
  vC=aC; vU=position.x;
  vec4 hw=modelMatrix*vec4(aP,1.0);
  vec3 vw=mat3(modelMatrix)*aV;
  vec4 ch=projectionMatrix*viewMatrix*hw;
  vec4 ct=projectionMatrix*viewMatrix*vec4(hw.xyz-vw*uLen,1.0);
  if(ch.w<0.1||ct.w<0.1){ gl_Position=vec4(2.0,2.0,2.0,1.0); return; }
  vec2 ph=ch.xy/ch.w*0.5*uRes, pt=ct.xy/ct.w*0.5*uRes;
  vec2 d=ph-pt; float len=length(d);
  vec2 dn=len>0.5?d/len:vec2(0.0,1.0);
  vec2 nn=vec2(-dn.y,dn.x);
  float w=clamp(90.0/ch.w,1.0,6.0);
  vec2 p=mix(pt,ph,position.x)+nn*position.y*w*0.5+dn*(position.x-0.5)*w;
  float cw=mix(ct.w,ch.w,position.x), cz=mix(ct.z/ct.w,ch.z/ch.w,position.x);
  gl_Position=vec4(p/(0.5*uRes)*cw,cz*cw,cw);
}`;
const SPARK_FRAG=`varying vec4 vC; varying float vU;
void main(){ gl_FragColor=vec4(vC.rgb*(0.25+0.75*vU)*vC.a,1.0); }`;
function initVFX(){
  const mkS=(max)=>{ const g=new THREE.SphereGeometry(1,24,16);
    g.setAttribute('aState',new THREE.InstancedBufferAttribute(new Float32Array(max*4),4)); return g; };
  const mF=new THREE.ShaderMaterial({vertexShader:VFX_VERT,fragmentShader:FIRE_FRAG,
    uniforms:{uTime:SKYU.uTime,uAmp:{value:0.22}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  VFX.fire=new THREE.InstancedMesh(mkS(VFX_FMAX),mF,VFX_FMAX);
  const mS=new THREE.ShaderMaterial({vertexShader:VFX_VERT,fragmentShader:SMOKE_FRAG,
    uniforms:{uTime:SKYU.uTime,uAmp:{value:0.34},uLP:LITU.uLP,uLC:LITU.uLC,uStreet:LITU.uStreet,
      uStreetFall:LITU.uStreetFall,uStreetCol:LITU.uStreetCol,uFogC:{value:new THREE.Color(FOGC)},
      uFogN:{value:FOG_NEAR},uFogF:{value:FOG_FAR},uCamP:LITU.uCam,
      uLM:LITU.uLM,uLMo:LITU.uLMo,uLMGain:LITU.uLMGain,uSignPow:LITU.uSignPow},transparent:true,depthWrite:false});
  VFX.smoke=new THREE.InstancedMesh(mkS(120),mS,120);
  for(const m of [VFX.fire,VFX.smoke]){ m.count=0; m.frustumCulled=false; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(m); }
  VFX.smoke.renderOrder=4; VFX.fire.renderOrder=5;
  const gP=new THREE.InstancedBufferGeometry();
  gP.setAttribute('position',new THREE.BufferAttribute(new Float32Array([0,-1,0, 1,-1,0, 1,1,0, 0,1,0]),3));
  gP.setIndex([0,1,2,0,2,3]);
  gP.setAttribute('aP',new THREE.InstancedBufferAttribute(new Float32Array(VFX_PMAX*3),3));
  gP.setAttribute('aV',new THREE.InstancedBufferAttribute(new Float32Array(VFX_PMAX*3),3));
  gP.setAttribute('aC',new THREE.InstancedBufferAttribute(new Float32Array(VFX_PMAX*4),4));
  gP.instanceCount=0;
  const mP=new THREE.ShaderMaterial({vertexShader:SPARK_VERT,fragmentShader:SPARK_FRAG,
    uniforms:{uLen:{value:0.045},uRes:{value:new THREE.Vector2(800,1600)}},
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  VFX.spark=new THREE.Mesh(gP,mP); VFX.spark.frustumCulled=false; VFX.spark.renderOrder=6;
  scene.add(VFX.spark);
}
function vfxFire(x,y,z,size,life,heat,vx,vy,vz){
  if(!VFX.fire) return;
  if(VFX.fa.length>=VFX_FMAX) VFX.fa.shift();
  VFX.fa.push({x:x,y:y,z:z,vx:vx||0,vy:vy||0,vz:vz||0,s0:size*.28,s1:size,life:life,t:0,heat:heat,seed:Math.random()});
}
function vfxSmoke(x,y,z,size,life,vx,vy,vz,heat){
  if(!VFX.smoke) return;
  if(VFX.sa.length>=VFX_SMAX) VFX.sa.shift();
  VFX.sa.push({x:x,y:y,z:z,vx:vx||0,vy:vy||0,vz:vz||0,s0:size*.35,s1:size,life:life,t:0,heat:heat||0,seed:Math.random(),d:0});
}
function spark(x,y,z,vx,vy,vz,life,r,g,b){
  if(VFX.pa.length>=VFX_PMAX) return;
  VFX.pa.push({x:x,y:y,z:z,vx:vx,vy:vy,vz:vz,life:life,l0:life,r:r||1,g:g||.62,b:b||.24});
}
function hitStop(sec){
  sec*=QUAL.fxK;
  const now=performance.now();
  if(now-VFX.lastStop<260) return;                        // 連鎖爆発で止まり続けないように
  VFX.lastStop=now; hitStopT=Math.max(hitStopT,sec);
}
function distort(x,y,z,maxR,dur,str){
  VFX.dist.push({x:x,y:y,z:z,maxR:maxR,dur:dur,str:str,t:0});
  if(VFX.dist.length>4) VFX.dist.shift();
}
function updVFX(dt){
  if(!VFX.fire) return;
  // 火球
  let A=VFX.fa, w=0;
  for(let i=0;i<A.length;i++){ const o=A[i]; o.t+=dt; if(o.t>=o.life) continue;
    const dr=Math.exp(-dt*2.6); o.vx*=dr; o.vz*=dr; o.vy=o.vy*dr+dt*9;
    o.x+=o.vx*dt; o.y+=o.vy*dt; o.z+=o.vz*dt; A[w++]=o; }
  A.length=w;
  let M=VFX.fire.instanceMatrix.array, St=VFX.fire.geometry.attributes.aState.array;
  for(let i=0;i<w;i++){ const o=A[i], k=o.t/o.life;
    const sc=o.s0+(o.s1-o.s0)*(1-Math.pow(1-k,2.4));
    const al=k<.08?k/.08:Math.pow(1-(k-.08)/.92,1.2);
    const q=i*16; M[q]=sc;M[q+1]=0;M[q+2]=0;M[q+3]=0;M[q+4]=0;M[q+5]=sc;M[q+6]=0;M[q+7]=0;
    M[q+8]=0;M[q+9]=0;M[q+10]=sc;M[q+11]=0;M[q+12]=o.x;M[q+13]=o.y;M[q+14]=o.z;M[q+15]=1;
    St[i*4]=k; St[i*4+1]=o.seed; St[i*4+2]=o.heat; St[i*4+3]=al; }
  VFX.fire.count=w; VFX.fire.instanceMatrix.needsUpdate=true; VFX.fire.geometry.attributes.aState.needsUpdate=true;
  // 黒煙（奥から描くために距離で並べる）
  A=VFX.sa; w=0;
  const cx=camera.position.x, cy=camera.position.y, cz=camera.position.z;
  for(let i=0;i<A.length;i++){ const o=A[i]; o.t+=dt; if(o.t>=o.life) continue;
    const dr=Math.exp(-dt*1.1); o.vx*=dr; o.vz*=dr; o.vy=o.vy*Math.exp(-dt*.5)+dt*1.5;
    o.x+=o.vx*dt; o.y+=o.vy*dt; o.z+=o.vz*dt;
    o.d=(o.x-cx)*(o.x-cx)+(o.y-cy)*(o.y-cy)+(o.z-cz)*(o.z-cz); A[w++]=o; }
  A.length=w; A.sort((a,b)=>b.d-a.d);
  M=VFX.smoke.instanceMatrix.array; St=VFX.smoke.geometry.attributes.aState.array;
  for(let i=0;i<w;i++){ const o=A[i], k=o.t/o.life;
    const sc=o.s0+(o.s1-o.s0)*(1-Math.pow(1-k,1.8));
    const al=(k<.12?k/.12:Math.pow(1-(k-.12)/.88,1.3))*.92;
    const q=i*16; M[q]=sc;M[q+1]=0;M[q+2]=0;M[q+3]=0;M[q+4]=0;M[q+5]=sc;M[q+6]=0;M[q+7]=0;
    M[q+8]=0;M[q+9]=0;M[q+10]=sc;M[q+11]=0;M[q+12]=o.x;M[q+13]=o.y;M[q+14]=o.z;M[q+15]=1;
    St[i*4]=k; St[i*4+1]=o.seed; St[i*4+2]=o.heat; St[i*4+3]=al; }
  VFX.smoke.count=w; VFX.smoke.instanceMatrix.needsUpdate=true; VFX.smoke.geometry.attributes.aState.needsUpdate=true;
  // 火花
  A=VFX.pa; w=0;
  for(let i=0;i<A.length;i++){ const o=A[i]; o.life-=dt; if(o.life<=0) continue;
    o.vy-=30*dt; const dr=Math.exp(-dt*1.2); o.vx*=dr; o.vy*=dr; o.vz*=dr;
    o.x+=o.vx*dt; o.y+=o.vy*dt; o.z+=o.vz*dt;
    if(o.y<.15){ o.y=.15; if(o.vy<0) o.vy*=-.32; o.vx*=.55; o.vz*=.55; o.life*=.85; }   // 地面で跳ねる
    A[w++]=o; }
  A.length=w;
  const g=VFX.spark.geometry, P=g.attributes.aP.array, V=g.attributes.aV.array, C=g.attributes.aC.array;
  for(let i=0;i<w;i++){ const o=A[i], f=o.life/o.l0;
    P[i*3]=o.x; P[i*3+1]=o.y; P[i*3+2]=o.z; V[i*3]=o.vx; V[i*3+1]=o.vy; V[i*3+2]=o.vz;
    const e=2.6*f+0.4; C[i*4]=o.r*e; C[i*4+1]=o.g*e; C[i*4+2]=o.b*e; C[i*4+3]=Math.min(1,f*1.6); }
  g.instanceCount=w;
  g.attributes.aP.needsUpdate=true; g.attributes.aV.needsUpdate=true; g.attributes.aC.needsUpdate=true;
}
/* 得点：着弾点に数字が浮かび、崩れていく間カウントアップする */
function popAt(x,y,z){
  if(typeof document==='undefined'||!document.body) return;
  if(!VFX.popEl){ const d=document.createElement('div');
    d.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:40;overflow:hidden;';
    document.body.appendChild(d); VFX.popEl=d; }
  // 連鎖爆発で数字が乱立しないよう、画面全体で0.6秒に1個・同時に3個まで
  for(const q of VFX.pops) if(q.t<.6) return;
  if(VFX.pops.length>=3){ const o=VFX.pops.shift(); if(o.el.remove) o.el.remove(); }
  const el=document.createElement('div');
  el.style.cssText='position:absolute;left:0;top:0;font:900 22px "Hiragino Sans","Noto Sans JP",sans-serif;color:#ffd27a;'+
    'text-shadow:0 0 10px rgba(255,120,40,.9),0 2px 0 #000;white-space:nowrap;opacity:0;will-change:transform,opacity;';
  VFX.popEl.appendChild(el);
  VFX.pops.push({el:el,x:x,y:y,z:z,t:0,base:S.score,last:-1});
}
function updPops(dt){
  for(let i=VFX.pops.length-1;i>=0;i--){
    const q=VFX.pops[i]; q.t+=dt;
    if(q.t>1.6){ if(q.el.remove) q.el.remove(); VFX.pops.splice(i,1); continue; }
    const v=Math.max(0,S.score-q.base);
    if(v!==q.last){ q.last=v; q.el.textContent='+'+v.toLocaleString(); }
    _pv.set(q.x,q.y+q.t*6,q.z).project(camera);
    if(_pv.z>1||v<=0){ q.el.style.opacity='0'; continue; }
    const sx=(_pv.x*.5+.5)*window.innerWidth, sy=(-_pv.y*.5+.5)*window.innerHeight;
    const sc=q.t<.12?.6+q.t/.12*.6:(q.t<.3?1.2-(q.t-.12)/.18*.2:1.0);
    q.el.style.opacity=String(q.t<1.1?1:Math.max(0,1-(q.t-1.1)/.5));
    q.el.style.transform='translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px) translate(-50%,-50%) scale('+sc.toFixed(3)+')';
  }
}

/* ══════════ 性能表示と画質プリセット ══════════
   実機で重さを測れるように、画面上にFPS・描画時間・画質を出す。
   画質は自動（重ければ段階的に落とす）／高／中／低を切り替えられる */
const QUAL={mode:'auto', level:0, applied:false, smokeMax:120, pedK:1, pr:1, el:null, acc:0, n:0, worst:0, t:0,
  hist:[], settleUntil:0, downT:0, showPerf:false, ring:new Float32Array(180), ri:0, fxK:1, minDt:1};
/* 段階ごとの設定：3D内部解像度（目標画素数, MP）／反射の更新間隔（0=切る）／煙・人の上限／ブルーム段数／MSAA */
const QLV=[
  {mp:1.00, refl:1, smoke:120, ped:1.0,  mips:5, msaa:true },   // 高
  {mp:0.72, refl:2, smoke:84,  ped:0.6,  mips:4, msaa:true },   // 中
  {mp:0.48, refl:0, smoke:56,  ped:0.35, mips:4, msaa:false},   // 低
  {mp:0.36, refl:0, smoke:40,  ped:0.2,  mips:3, msaa:false},   // 最低（自動のみ）

const QNAME=['高','中','低','最低'];
function prForLevel(L){
  const w=Math.max(1,window.innerWidth), h=Math.max(1,window.innerHeight);
  const dpr=Math.min(3,window.devicePixelRatio||1);
  return Math.max(0.75, Math.min(dpr, Math.sqrt(QLV[L].mp*1e6/(w*h))));
}
function applyLevel(L,force){
  L=Math.max(0,Math.min(QLV.length-1,L|0));
  if(!force && QUAL.applied && QUAL.level===L) return;
  QUAL.level=L; QUAL.applied=true;
  const Q=QLV[L];
  QUAL.smokeMax=Q.smoke; VFX_SMAX=Q.smoke;
  if(VFX.sa.length>VFX_SMAX) VFX.sa.splice(0,VFX.sa.length-VFX_SMAX);
  const pedUp=Q.ped>QUAL.pedK; QUAL.pedK=Q.ped;
  QUAL.pr=prForLevel(L);
  if(renderer) renderer.setPixelRatio(QUAL.pr);
  POST.level=L; POST.mipsN=Q.mips; POST.wantMsaa=Q.msaa;
  WET.every=Q.refl;
  if(typeof resize==='function' && renderer) resize();      // RT も作り直す
  WET.on=POST.on&&Q.refl>0;
  if(PED.list.length>PED_MAX*QUAL.pedK) PED.list.length=Math.floor(PED_MAX*QUAL.pedK);
  else if(pedUp && blds.length && typeof buildPeds==='function') buildPeds();
  QUAL.settleUntil=performance.now()+3000; QUAL.hist.length=0;
  updQualLabel();
}
function updQualLabel(){
  const b=document.getElementById('bQual');
  const name=(QUAL.mode==='auto')?('自動('+QNAME[QUAL.level]+')'):({high:'高',mid:'中',low:'低'})[QUAL.mode];
  if(b) b.textContent='画質: '+name;
  const b2=document.getElementById('pmQual'); if(b2) b2.textContent=name;
}
function setQuality(mode){
  QUAL.mode=mode;
  if(mode==='auto') applyLevel(QUAL.level,true);
  else applyLevel({high:0,mid:1,low:2}[mode]||0,true);
}
/* 性能計測：実フレーム間隔を蓄積し、1秒ごとに集計。自動画質は3秒の傾向で下げ、12秒以上余裕が続いたら1段戻す */
function updPerf(rawDt){
  QUAL.acc+=rawDt; QUAL.n++; if(rawDt>QUAL.worst) QUAL.worst=rawDt; QUAL.t+=rawDt;
  if(rawDt<QUAL.minDt) QUAL.minDt=rawDt;
  QUAL.ring[QUAL.ri]=rawDt*1000; QUAL.ri=(QUAL.ri+1)%QUAL.ring.length;
  if(QUAL.t<1.0) return;
  const avg=QUAL.acc/QUAL.n*1000, worst=QUAL.worst*1000, base=Math.max(4,QUAL.minDt*1000);
  QUAL.lastAvg=avg; QUAL.lastWorst=worst;
  QUAL.acc=0; QUAL.n=0; QUAL.worst=0; QUAL.t=0;
  if(QUAL.showPerf && typeof drawPerf==='function') drawPerf(avg,worst);
  const now=performance.now();
  if(QUAL.mode!=='auto' || now<QUAL.settleUntil || document.hidden || paused) return;
  QUAL.hist.push(avg); if(QUAL.hist.length>3) QUAL.hist.shift();
  if(QUAL.hist.length<3) return;
  const m=(QUAL.hist[0]+QUAL.hist[1]+QUAL.hist[2])/3;
  if(m>25 && QUAL.level<QLV.length-1){ QUAL.downT=now; applyLevel(QUAL.level+1); }
  else if(QUAL.level>0 && m<=base*1.2+1.0 && now-QUAL.downT>12000){ applyLevel(QUAL.level-1); QUAL.settleUntil=now+6000; }
}

/* ══════════ ポストプロセス ══════════
   4倍MSAA → ブルーム（しきい値＋デュアルKawase） → フィルム調トーンカーブ →
   色調・周辺減光・粒子・衝撃波の屈折。非対応や描画が重い端末では自動で段階的に下げる */
const POST={on:false,hdr:false,gl2:false,msaa:false,type:0,w:1,h:1,rt:null,mips:[],ups:[],
  q:null,sc:null,cam:null,mats:{},level:0,lastT:0,acc:0,frames:0,warm:0};
const FS_VERT=`varying vec2 vUv;
void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`;
const PRE_FRAG=`uniform sampler2D tSrc; uniform vec2 uTexel; uniform float uThr, uKnee;
varying vec2 vUv;
vec3 lin(vec3 c){ return pow(max(c,vec3(0.0)),vec3(2.2)); }
void main(){
  vec3 c=lin(texture2D(tSrc,vUv+uTexel*vec2(-1.0,-1.0)).rgb)+lin(texture2D(tSrc,vUv+uTexel*vec2(1.0,-1.0)).rgb)

const DOWN_FRAG=`uniform sampler2D tSrc; uniform vec2 uTexel; varying vec2 vUv;

  s+=texture2D(tSrc,vUv+uTexel*vec2(-1.0,1.0)).rgb;  s+=texture2D(tSrc,vUv+uTexel*vec2(1.0,1.0)).rgb;
  gl_FragColor=vec4(s*0.125,1.0);

const UP_FRAG=`uniform sampler2D tSrc, tHi; uniform vec2 uTexel; uniform float uScatter; varying vec2 vUv;
void main(){

  vec3 s=texture2D(tSrc,vUv+vec2(-2.0*o.x,0.0)).rgb+texture2D(tSrc,vUv+vec2(2.0*o.x,0.0)).rgb
        +texture2D(tSrc,vUv+vec2(0.0,2.0*o.y)).rgb+texture2D(tSrc,vUv+vec2(0.0,-2.0*o.y)).rgb
        +(texture2D(tSrc,vUv+vec2(-o.x,o.y)).rgb+texture2D(tSrc,vUv+vec2(o.x,o.y)).rgb

  gl_FragColor=vec4(texture2D(tHi,vUv).rgb+s*(uScatter/12.0),1.0);

const COMP_FRAG=`uniform sampler2D tScene, tBloom;
uniform float uBloom, uExposure, uTone, uTime, uVig, uGrain, uCA;
uniform vec2 uRes; uniform vec4 uShock; uniform vec4 uShk[4]; uniform vec4 uLens;
varying vec2 vUv;

vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }

    vec2 dd=uv-uShock.xy; dd.x*=asp;

    vec4 S=uShk[i];

      vec2 dd=uv-S.xy; dd.x*=asp;
      float r=length(dd);
      float ring=exp(-pow((r-S.z)/(0.010+S.z*0.08),2.0));
      vec2 dir=dd/max(r,0.0001); dir.x/=asp;

    }
  }
  float lensR=0.0;
  if(uLens.w>0.001){                          // 特異点：重力レンズで周りの景色が引き込まれる
    vec2 dd=uv-uLens.xy; dd.x*=asp;

    vec2 dir=dd/max(r,0.0001); dir.x/=asp;
    uv-=dir*(uLens.w*uLens.z*uLens.z/(r+uLens.z*0.35))*0.9*smoothstep(0.0,uLens.z*0.6,r);

  col=lin(col)*uExposure+texture2D(tBloom,uv).rgb*uBloom;

  col+=vec3(-0.004,0.0,0.012)*(1.0-smoothstep(0.0,0.45,l));      // 影はわずかに青く
  col+=vec3(0.018,0.006,-0.014)*smoothstep(0.45,1.0,l);            // 明部はわずかに暖かく
  col=max(col-0.014,0.0)*1.014;                                    // 黒を締める（夜の写真の黒）
  col=mix(col,col*col*(3.0-2.0*col),0.16);                         // 中間調のコントラスト

function fsMat(frag,uni){

}
function initPost(){

    try{ hdr=POST.gl2&&!!(gl&&gl.getExtension&&(gl.getExtension('EXT_color_buffer_float')||gl.getExtension('EXT_color_buffer_half_float'))); }catch(e){}

    POST.q.frustumCulled=false;

    POST.mats.pre=fsMat(PRE_FRAG,{tSrc:{value:null},uTexel:{value:new THREE.Vector2()},uThr:{value:1.38},uKnee:{value:0.36}});
    POST.mats.down=fsMat(DOWN_FRAG,{tSrc:{value:null},uTexel:{value:new THREE.Vector2()}});
    POST.mats.up=fsMat(UP_FRAG,{tSrc:{value:null},tHi:{value:null},uTexel:{value:new THREE.Vector2()},uScatter:{value:0.62}});
    POST.mats.comp=fsMat(COMP_FRAG,{tScene:{value:null},tBloom:{value:null},uBloom:{value:0.30},
      uExposure:{value:1.06},uTone:{value:0.72},uTime:{value:0},uRes:{value:new THREE.Vector2(1,1)},
      uVig:{value:0.38},uGrain:{value:0.028},uCA:{value:0.0035},uShock:{value:new THREE.Vector4(0,0,0,0)},
      uShk:{value:[0,1,2,3].map(()=>new THREE.Vector4())},uLens:{value:new THREE.Vector4()}});

  }catch(e){ POST.on=false; }
}
function resizePost(){
  if(!POST.on) return;
  const v=renderer.getDrawingBufferSize(new THREE.Vector2());
  const w=Math.max(1,v.x|0), h=Math.max(1,v.y|0);
  POST.w=w; POST.h=h;

  for(const t of POST.mips) t.dispose();
  for(const t of POST.ups) t.dispose();

    POST.rt=new THREE.WebGLMultisampleRenderTarget(w,h,{type:POST.type,format:THREE.RGBAFormat,depthBuffer:true,stencilBuffer:false});

  for(let i=0;i<nm;i++){ mw=Math.max(1,mw>>1); mh=Math.max(1,mh>>1); POST.mips.push(mkRT(mw,mh,false)); }
  for(let i=0;i<nm-1;i++) POST.ups.push(mkRT(POST.mips[i].width,POST.mips[i].height,false));
  POST.mats.comp.uniforms.uRes.value.set(w,h);
  if(WET.rt){ WET.rt.dispose(); WET.rt=null; WET.u.uRefl.value=null; }
  if((WET.every|0)>0){ const dv=(WET.every|0)>1?3:2; WET.rt=mkRT(Math.max(1,(w/dv)|0),Math.max(1,(h/dv)|0),true); }
  WET.u.uScreen.value.set(w,h);
  WET.on=(WET.every|0)>0 && !!WET.rt;

  // （HDR → 8bit、MSAA → なし、最後はポストプロセスごと切る）。黒画面を防ぐため
  if(!postFbOk()){
    if(POST.hdr){ POST.hdr=false; POST.type=THREE.UnsignedByteType;
      LITU.uEmLo.value=1.0; LITU.uEmHi.value=1.0; resizePost(); return; }

function postFbOk(){
  try{

    for(const t of [POST.rt, POST.mips[0], WET.rt]){ if(!t) continue;
      renderer.setRenderTarget(t);
      if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE){ renderer.setRenderTarget(null); return false; }

function fsPass(mat,target){ POST.q.material=mat; renderer.setRenderTarget(target); renderer.render(POST.sc,POST.cam); }
const _pv=new THREE.Vector3(), _pr=new THREE.Vector3();
function renderFrame(dt){

  SKYU.uGlow.value=0.72+0.28*cityPower;
  SKYU.uFire.value+=(Math.min(1,fires.length/16)-SKYU.uFire.value)*Math.min(1,dt*0.8);
  if(skyMesh) skyMesh.position.copy(camera.position);

  updHot(dt);
  updSigns(dt);
  updPops(dt);
  if(VFX.spark) VFX.spark.material.uniforms.uRes.value.set(POST.w||800,POST.h||1600);
  if(!POST.on){ WET.u.uWet.value=0; renderer.render(scene,camera); return; }
  renderReflection(dt);
  renderer.setRenderTarget(POST.rt);
  renderer.render(scene,camera);
  const M=POST.mats;
  M.pre.uniforms.tSrc.value=POST.rt.texture;
  M.pre.uniforms.uTexel.value.set(1/POST.w,1/POST.h);
  fsPass(M.pre,POST.mips[0]);
  for(let i=1;i<POST.mips.length;i++){
    const src=POST.mips[i-1];
    M.down.uniforms.tSrc.value=src.texture;
    M.down.uniforms.uTexel.value.set(1/src.width,1/src.height);
    fsPass(M.down,POST.mips[i]);
  }
  let lo=POST.mips[POST.mips.length-1];
  for(let i=POST.ups.length-1;i>=0;i--){
    M.up.uniforms.tSrc.value=lo.texture;
    M.up.uniforms.tHi.value=POST.mips[i].texture;
    M.up.uniforms.uTexel.value.set(1/lo.width,1/lo.height);
    fsPass(M.up,POST.ups[i]);

  }
  const C=M.comp.uniforms;

      _pr.setFromMatrixColumn(camera.matrixWorld,0).multiplyScalar(Math.max(1,S.r));

  for(let i=0;i<4;i++){
    const D=VFX.dist[i], U=C.uShk.value[i];

/* get(x,y,z) は 0（空）または mat*4+damageStage を返す */
function greedy(get,dims,emit,yLo,yHi,top){
  // yLo..yHi の高さ帯だけを対象にする（メッシュを階層で分けるため）。
  // get は全体を見るので、帯の境界に余計な面は出ない。
  const useY = (yLo!==undefined);
  for(let d=0;d<3;d++){
    const u=(d+1)%3, v=(d+2)%3;
    const x=[0,0,0], q=[0,0,0]; q[d]=1;
    const uxa=(u===0?1:0), uya=(u===1?1:0), uza=(u===2?1:0);
    const vxa=(v===0?1:0), vya=(v===1?1:0), vza=(v===2?1:0);
    const du=dims[u], dv=dims[v];
    const mask=new Int32Array(du*dv);
    // n は (uE-uS) 幅で詰めて使う
    // 走査範囲：Yが「面の向き」なら平面の範囲、Yが面内の軸ならその範囲を絞る
    let dS=-1, dE=dims[d], uS=0, uE=du, vS=0, vE=dv;
    if(useY){
      if(d===1){ dS=yLo-1; dE=(top?yHi:yHi-1); }
      else if(u===1){ uS=yLo; uE=yHi; }
      else if(v===1){ vS=yLo; vE=yHi; }
    }
    for(x[d]=dS; x[d]<dE; ){
      let n=0;
      for(x[v]=vS;x[v]<vE;x[v]++) for(x[u]=uS;x[u]<uE;x[u]++,n=(x[v]-vS)*(uE-uS)+(x[u]-uS)){
        const a=(x[d]>=0)?get(x[0],x[1],x[2]):0;
        const b=(x[d]<dims[d]-1)?get(x[0]+q[0],x[1]+q[1],x[2]+q[2]):0;
        if(a&&b){ mask[n]=0; continue; }
        if(!a&&!b){ mask[n]=0; continue; }
        // 面の「空いている側」の周囲4マスを見て、囲まれているほど暗くする
        const ex=a?(x[0]+q[0]):x[0], ey=a?(x[1]+q[1]):x[1], ez=a?(x[2]+q[2]):x[2];
        const cd0=a||b;
        let occ=0;
        if(!M_EMIS[cd0>>2]){                     // 発光面はAOを掛けない（分割を防ぐ）
          if(get(ex+uxa,ey+uya,ez+uza)) occ++;
          if(get(ex-uxa,ey-uya,ez-uza)) occ++;
          if(occ<2){
            if(get(ex+vxa,ey+vya,ez+vza)) occ++;
            if(get(ex-vxa,ey-vya,ez-vza)) occ++;
          }
          occ = occ>=2 ? 1 : 0;                  // 2段階に留めてマージを保つ
        }
        mask[n] = a ? ((a<<1)|occ) : -((b<<1)|occ);
      }
      x[d]++;
      n=0;
      for(let j=vS;j<vE;j++){
        for(let i=uS;i<uE;){
          const c=mask[n];
          if(c){
            let w=1;
            while(i+w<uE && mask[n+w]===c) w++;
            let h=1, stop=false;
            while(j+h<vE){
              for(let k=0;k<w;k++) if(mask[n+k+h*(uE-uS)]!==c){ stop=true; break; }
              if(stop) break; h++;
            }
            x[u]=i; x[v]=j;
            const a=[0,0,0], b=[0,0,0]; a[u]=w; b[v]=h;
            emit(x[0],x[1],x[2], a,b, c, d);
            for(let l=0;l<h;l++) for(let k=0;k<w;k++) mask[n+k+l*(uE-uS)]=0;
            i+=w; n+=w;
          } else { i++; n++; }
        }
      }
    }
  }
}
