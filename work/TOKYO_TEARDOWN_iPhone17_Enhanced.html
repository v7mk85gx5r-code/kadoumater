/* ══════════ 音 ══════════
   役割：発射／着弾／素材ごとの破片／構造の軋み／崩落の胴鳴り／瓦礫の余韻／街の環境音。
   スマートフォンのスピーカーでも分かる中低域と短い立ち上がりを使い、マスター（コンプレッサー）で
   連鎖中の音割れを防ぐ。同時発音数と時間あたりの発音予算で鳴りっぱなしを抑える。
   距離で減衰し、カメラから見た左右で定位する */
const Snd=(()=>{
  let ac=null,nb=null,bud=0,hum=null,master=null,comp=null,voices=0;
  const MAXV=30;
  function A(){ if(!S.sound) return null;
    try{ if(!ac){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
      ac=new C(); const L=ac.sampleRate*2, b=ac.createBuffer(1,L,ac.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<L;i++) d[i]=Math.random()*2-1; nb=b;
      comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.knee.value=18; comp.ratio.value=6; comp.attack.value=.004; comp.release.value=.18;
      master=ac.createGain(); master.gain.value=.85;
      master.connect(comp); comp.connect(ac.destination); }
      if(ac.state==='suspended') ac.resume(); return ac; }catch(e){ return null; } }
  const LAT=0.025;
  /* 距離減衰と左右の定位。位置が無ければそのまま */
  function sp(x,y,z){
    if(x===undefined||x===null||typeof camera==='undefined'||!camera) return {g:1,pan:0};
    const dx=x-camera.position.x, dy=y-camera.position.y, dz=z-camera.position.z;
    const d=Math.hypot(dx,dy,dz);
    const g=1/(1+d/150);
    const rx=Math.cos(cam.yaw), rz=-Math.sin(cam.yaw);          // カメラの右方向（水平）
    const pan=d>1?Math.max(-1,Math.min(1,(dx*rx+dz*rz)/d))*0.7:0;
    return {g:g,pan:pan};
  }
  function out(a,g,pos){
    const s=sp(pos&&pos[0],pos&&pos[1],pos&&pos[2]);
    let node=g;
    if(s.pan!==0 && a.createStereoPanner){ const pn=a.createStereoPanner(); pn.pan.value=s.pan; g.connect(pn); node=pn; }
    node.connect(master);
    return s.g;
  }
  function track(n){ voices++; n.onended=()=>{ voices--; }; }
  function N(dur,vol,ty,f0,f1,q,pos){ const a=A(); if(!a||bud<=0||voices>=MAXV) return; bud--;
    const t0=a.currentTime+LAT;
    const s=a.createBufferSource(); s.buffer=nb; s.playbackRate.value=.5+Math.random()*.8;
    const f=a.createBiquadFilter(); f.type=ty; f.Q.value=q||1;
    f.frequency.setValueAtTime(f0,t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(28,f1),t0+dur);

let shockMesh=null, shockMat=null, shockFx=null;
function initShockMesh(){
  shockMat=new THREE.MeshBasicMaterial({
    color:0xffffff, transparent:true, opacity:0,
    side:THREE.BackSide, depthWrite:false, fog:false,
    blending:THREE.AdditiveBlending});

function startShockFront(x,y,z,maxR,dur){
  shockFx={x:x,y:y,z:z,r:1,max:maxR,t:0,dur:dur};
}
function updShockFront(dt){
  if(!shockFx) return;
  const S2=shockFx;
  S2.t+=dt;
  const k=Math.min(1,S2.t/S2.dur);
  // 最初は速く、離れるほど減速する（実際の衝撃波と同じ）
  S2.r = S2.max*(1-Math.pow(1-k,2.2));
  shockMesh.visible=true;
  shockMesh.position.set(S2.x,S2.y,S2.z);
  shockMesh.scale.setScalar(Math.max(1,S2.r));
  // 膨張するほど薄くなる
  shockMat.opacity = 0.34*(1-k)*(1-k) + 0.04*(1-k);
  if(k>=1){ shockFx=null; shockMesh.visible=false; shockMat.opacity=0; }

function aimRay(maxD){

  camera.getWorldDirection(dir);

  // 地面との交点
  let tg=Infinity;
  if(dir.y<-1e-6){ const t=(0-o.y)/dir.y; if(t>0) tg=t; }
  // 街のAABBと交わる区間 [t0,t1] を求める（外側は当たり得ないので刻まない）
  const bx0=CITY.x0-60, bx1=CITY.x1+60, bz0=CITY.z0-60, bz1=CITY.z1+60;
  const by0=0, by1=cityTop+30;
  let t0=0, t1=Math.min(maxD, tg);
  const slab=(p,d,lo,hi)=>{
    if(Math.abs(d)<1e-9) return (p>=lo&&p<=hi);
    let a=(lo-p)/d, b=(hi-p)/d;
    if(a>b){ const c=a; a=b; b=c; }
    if(a>t0) t0=a;
    if(b<t1) t1=b;
    return t0<=t1;
  };
  let inside = slab(o.x,dir.x,bx0,bx1) && slab(o.y,dir.y,by0,by1) && slab(o.z,dir.z,bz0,bz1);
  if(inside && t1>0){
    const step=VOX*.7;
    const s0=Math.max(step,t0);
    for(let t=s0;t<=t1;t+=step){
      const px=o.x+dir.x*t, py=o.y+dir.y*t, pz=o.z+dir.z*t;
      if(py<=0) break;
      if(solidAt(px,py,pz)) return {x:px,y:py,z:pz,d:t,ground:false};
    }

  if(tg<maxD) return {x:o.x+dir.x*tg, y:0, z:o.z+dir.z*tg, d:tg, ground:true};

  // 破片を放射状に飛ばす（点の破片は減らし、火花の筋と立体の破片に任せる）
  for(let i=0;i<Math.min(8,2+rad*.06);i++){
    const a=Math.random()*6.283, e=Math.random()*3.14, sp=rad*(.6+Math.random()*1.4);
    fx.push({x:x,y:y,z:z, vx:Math.cos(a)*Math.sin(e)*sp, vy:Math.abs(Math.cos(e))*sp*.8+8,
      vz:Math.sin(a)*Math.sin(e)*sp, r:.9+Math.random()*2.2, gr:0,
      life:1, dec:.010+Math.random()*.016, grav:1, c:[.85,.62,.34]});
  }
  shake(shk||Math.min(2.4,rad*.02));
  fovPunch(Math.min(16,rad*.10));
  kick(-Math.min(.05,rad*.0004),(Math.random()-.5)*.02);
  flashDom(Math.min(.5,rad*.004));
  if(rad>70) fires.push({x:x,y:Math.max(1,y-rad*.3),z:z,t:2.4+Math.random()*2.2,r:rad*.45,src:(KSRC==='nuke'?'nuke':'fire')});
  setLeanFrom(x,y,z,Math.min(.9,rad*.006));
  Snd.blast(Math.min(1,rad/90),x,y,z);
  for(let k=0;k<chunks.length;k++){
    const c=chunks[k];
    const dx=c.p[0]-x, dy=c.p[1]-y, dz=c.p[2]-z;
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(d>rad*2.4) continue;
    const f=1-d/(rad*2.4);
    c.sleep=false; c.rest=0;
    const v=pow*.055*f;
    c.v[0]+=dx/(d||1)*v; c.v[1]+=dy/(d||1)*v+f*7; c.v[2]+=dz/(d||1)*v;
    c.w[0]+=(Math.random()-.5)*f*3; c.w[1]+=(Math.random()-.5)*f*3; c.w[2]+=(Math.random()-.5)*f*3;
    damageChunk(c,x,y,z,rad*.8,pow*f*.6);
  }
}
function fireWeapon(){
  if(cd>0) return;
  if(!canShoot()) return;
  const W=WPN.find(w=>w.id===wpn);
  cd=W.cd; cdMax=Math.max(.001,W.cd); Snd.kick(); hap(HAP.tap, 60);
  if(W.id!=='demo'){ S.shots++; noteShot(); }   // 装薬は「置く」では数えない。起爆1回＝1発
  const o=camera.position.clone(), dir=new THREE.Vector3();
  camera.getWorldDirection(dir);
  const hit=aimRay();

    case 'missile': {
      const rt=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();
      const mx=o.x+dir.x*8+rt.x*2.6, my=o.y+dir.y*8-2.6, mz=o.z+dir.z*8+rt.z*2.6;
      const tg = hit.miss

      missiles.push({
        p:[mx,my,mz],
        v:[dir.x*118, 52, dir.z*118],          // 前方へ。跳ね上げは控えめに
        tgt:tg, sp:132, age:0, boost:.34, sep:0, t:20, mp:null, gd:1
      });
      efx('ball',mx,my,mz, 1.4, 11, .12, 0xffeec0, 1);          // 発射炎
      vfxFire(mx,my,mz,4.5,.25,1.4,dir.x*10,4,dir.z*10);            // 発射の閃光
      for(let i=0;i<3;i++) vfxSmoke(mx-dir.x*3,my,mz-dir.z*3,rf(3,5),rf(1.5,2.4),rf(-5,5)-dir.x*8,rf(-2,3),rf(-5,5)-dir.z*8,.5);
      for(let i=0;i<14;i++) spark(mx,my,mz,-dir.x*rf(10,30)+rf(-10,10),rf(-4,10),-dir.z*rf(10,30)+rf(-10,10),rf(.2,.5),1,.75,.4);
      addLight(mx,my,mz,22,[1,.8,.5],1.2,.12);
      for(let i=0;i<14;i++)
        fx.length<FXCAP && fx.push({t:'smoke',x:mx,y:my,z:mz,
          vx:rf(-16,16), vy:rf(-16,4), vz:rf(-16,16),
          r:rf(2.5,6),gr:rf(1.4,3.4),life:1,dec:.016,c:[.46,.42,.40]});
      kick(-.020,(Math.random()-.5)*.010); fovPunch(2.6);
      Snd.rail(); break;
    }
    case 'rail': break;   // 押している間の連続照射（railTick）で処理する
    case 'cutter': {
      // FIRE は「照準の高さで水平に断つ」簡易切断
      const ca=Math.cos(-.30), sa=Math.sin(-.30), cb=Math.cos(.30), sb=Math.sin(.30);
      const dA=[dir.x*ca-dir.z*sa, dir.y, dir.x*sa+dir.z*ca];
      const dB=[dir.x*cb-dir.z*sb, dir.y, dir.x*sb+dir.z*cb];
      doCut(o,dA,dB);
      break;
    }
    case 'grav':
      attractor={x:hit.x,y:hit.y+10,z:hit.z,t:2.9,dur:2.9,q:null,qi:0,g:0,eaten:0};
      Snd.suck(); banner('重力爆弾','GRAVITY BOMB'); break;
    case 'orbit':
      orbitFx={x:hit.x,z:hit.z,t:0,dur:2.2};
      Snd.beam(); banner('軌道砲 照射','ORBITAL CANNON'); break;
    case 'demo': {
      if(hit.miss){ cd=0; break; }
      if(!placeCharge(hit.x,hit.y+1,hit.z)){ cd=0; }
      break;
    }
    case 'meteor': {
      // 斜めに落ちてくる。爆発せず質量で貫く
      const a=Math.random()*6.283;
      const sx=hit.x+Math.cos(a)*260, sz=hit.z+Math.sin(a)*260, sy=900;
      const dx=hit.x-sx, dy=Math.max(2,hit.y)-sy, dz=hit.z-sz;
      const dl=Math.hypot(dx,dy,dz)||1, sp=300;
      missiles.push({p:[sx,sy,sz], v:[dx/dl*sp,dy/dl*sp,dz/dl*sp],
                     t:9, met:1, e:7000, r:17, mp:null});
      Snd.woosh&&Snd.woosh(); Snd.rail();
      banner('隕石 落下','METEOR INBOUND');
      break;
    }
    case 'ball':
      swingBall();
      break;
    case 'orb':
      fireOrb(hit.miss?0:hit.x, hit.miss?0:hit.z);
      break;
    case 'nuke':
      // 実物のB-29は高度9600mから投下し43秒落下した。
      // その「静寂」が閃光を際立たせるので、落下に時間をかける
      nukePend={x:hit.x, y:Math.max(hit.y,6), z:hit.z, t:3.4, dur:3.4,
                dropY:520, mp:null};
      flashDom(.5); Snd.nuke(); banner('戦術核','TACTICAL NUKE'); break;
  }
  updWeaponUI();
}

/* いびつな岩塊。頂点の摂動は「向き」から決めるので、共有頂点がずれず穴が開かない */
function makeRockGeo(seed){
  const g=new THREE.IcosahedronGeometry(1,2);
  const p=g.attributes.position, col=[];
  for(let i=0;i<p.count;i++){
    let x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const l=Math.hypot(x,y,z)||1; x/=l; y/=l; z/=l;
    const n1=Math.sin(x*4.1+seed)*Math.cos(y*3.7-seed)*Math.sin(z*4.9+seed*.5);
    const n2=Math.sin(x*9.3-seed)*Math.sin(y*8.1+seed)*Math.cos(z*7.7);
    const k=1+n1*.30+n2*.12;
    p.setXYZ(i,x*k,y*k,z*k);
    const heat=Math.max(0,-n1)*1.15+Math.max(0,n2)*.35;   // 割れ目が赤熱
    col.push(.13+heat*1.5, .10+heat*.55, .09+heat*.16);
  }
  p.needsUpdate=true;
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  return g;
}

  }
  /* ── 消滅波：紫の球がゆっくり膨張し、触れたものを消す ── */

      c.w[0]+=rf(-2.4,2.4)*dt*8; c.w[2]+=rf(-2.4,2.4)*dt*8;
    }
    // 消滅の front：紫の光の輪と、散る細かな粒
    efx('ring',O.x,3,O.z, O.prev*.94, O.r*1.05, .6, 0xc47bff, .85, true);
    for(let i=0,kn=nK(14);i<kn && gxA.length<660;i++){

    }
    for(let i=0,kn=nK(7);i<kn && fx.length<FXCAP-30;i++){
      const a2=Math.random()*6.283, rr=O.prev+Math.random()*Math.max(1,O.r-O.prev);
      fx.push({t:'smoke',x:O.x+Math.cos(a2)*rr,y:2+Math.random()*26,z:O.z+Math.sin(a2)*rr,
        vx:Math.cos(a2)*rf(14,44),vy:rf(8,34),vz:Math.sin(a2)*rf(14,44),
        r:rf(14,34),gr:rf(5,13),life:1,dec:.0035,c:[.40,.32,.46]});
    }
    shake(1.5); flashDom(.09);

  }
  if(O.r>=1500 && O.t>5.5){
    for(let k=0;k<blds.length;k++) blds[k].orbHit=0;
    if(F){ F.style.background='#fff'; }
    orbShot=null;
  }
}
/* ══════════ 制御発破：装薬を置いてから順に起爆する ══════════ */
let charges=[];
const CHG_MAX=10;
function placeCharge(x,y,z){
  if(charges.length>=CHG_MAX) return false;
  let e=null;
  for(let i=0;i<chgPool.length;i++) if(!chgPool[i].busy){ e=chgPool[i]; break; }
  if(!e) return false;
  e.busy=true; e.o.visible=true; e.o.position.set(x,y,z); e.o.scale.setScalar(2.2);
  charges.push({x:x,y:y,z:z,e:e});
  Snd.crumble(.12);
  updDetBtn();
  return true;
}
function blowCharges(){
  if(!charges.length) return;
  if(resultOn) return;                    // 時間切れ後でも置いた装薬は起爆できる（締めは破壊が収まってから）
  S.shots++; noteShot();                  // 起爆1回＝1発
  // 置いた順に0.16秒ずつずらして起爆＝崩れる向きが順序で決まる
  for(let i=0;i<charges.length;i++){
    const c=charges[i];
    blasts.push({x:c.x,y:c.y,z:c.z,t:.05+i*.16,r:34,p:430,w:1});   // w:1＝兵装による爆発（誘爆ではない）
    c.e.busy=false; c.e.o.visible=false; c.e.mat.opacity=0;
  }
  // 全体としての倒す向きは「装薬の重心から外へ」
  let sx=0,sy=0,sz=0;
  for(const c of charges){ sx+=c.x; sy+=c.y; sz+=c.z; }
  const n=charges.length;
  setLeanFrom(sx/n, sy/n, sz/n, .75);
  banner('起爆','DETONATION');
  charges=[];
  updDetBtn();
}
function updCharges(dt){
  if(!charges.length) return;
  const b=.5+Math.abs(Math.sin(performance.now()*.006))*.55;
  for(const c of charges){ c.e.mat.opacity=b; c.e.o.scale.setScalar(2.0+b*.8); }
}
function updDetBtn(){
  const el=document.getElementById('det');
  if(!el) return;
  el.classList.toggle('on', charges.length>0);
  const n=document.getElementById('detN');
  if(n) n.textContent=charges.length;

/* ══════════ 熱線による焼灼 ══════════
   爆心を向いた露出面だけを焦がす。壊さず損傷段階だけ進めて黒くするので、
   影になった裏側は元の色のまま残り、核特有の「影」ができる */
let scorchJob=null;
function scorch(ox,oy,oz,rad){
  // 対象を予約するだけ。実処理は updScorch が数フレームに分けて行う。
  // 一度に全建物を焼くと1フレーム570msかかる
  const q=[];
  for(let k=0;k<blds.length;k++){
    const b=blds[k];
    if(ox+rad<b.ox || ox-rad>b.ox+b.W*VOX) continue;
    if(oz+rad<b.oz || oz-rad>b.oz+b.D*VOX) continue;
    q.push(b);
  }
  scorchJob={x:ox,y:oy,z:oz,r:rad,q:q,i:0};
  return q.length;
}
function updScorch(){
  if(!scorchJob) return;
  const J=scorchJob;
  let budget=3;                        // 1フレームあたり3棟まで
  while(J.i<J.q.length && budget-->0) scorchOne(J.q[J.i++], J.x, J.y, J.z, J.r);
  if(J.i>=J.q.length) scorchJob=null;
}
function scorchOne(b,ox,oy,oz,rad){
  let n=0;
  {
    const bw=b.W*VOX, bh=b.H*VOX, bd=b.D*VOX;
    if(ox+rad<b.ox || ox-rad>b.ox+bw) return 0;
    if(oz+rad<b.oz || oz-rad>b.oz+bd) return 0;
    if(oy-rad>bh) return 0;
    const x0=Math.max(0,((ox-rad-b.ox)/VOX)|0), x1=Math.min(b.W-1,((ox+rad-b.ox)/VOX)|0);
    const y1=Math.min(b.H-1,((oy+rad)/VOX)|0);
    const z0=Math.max(0,((oz-rad-b.oz)/VOX)|0), z1=Math.min(b.D-1,((oz+rad-b.oz)/VOX)|0);
    let touched=false;
    for(let z=z0;z<=z1;z++) for(let y=0;y<=y1;y++){
      const row=b.W*(y+b.H*z);
      for(let x=x0;x<=x1;x++){
        const i=row+x, m=b.vox[i];
        if(!m) continue;
        const M=MATS[m];
        if(M.emis) continue;
        const wx=b.ox+x*VOX+VOX/2, wy=y*VOX+VOX/2, wz=b.oz+z*VOX+VOX/2;
        const dx=wx-ox, dy=wy-oy, dz=wz-oz;
        const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
        if(d>rad) continue;
        const nx=(x>0&&b.vox[i-1])?1:0, px2=(x<b.W-1&&b.vox[i+1])?1:0;
        const ny=(y>0&&b.vox[i-b.W])?1:0, py2=(y<b.H-1&&b.vox[i+b.W])?1:0;
        const nz=(z>0&&b.vox[i-b.W*b.H])?1:0, pz2=(z<b.D-1&&b.vox[i+b.W*b.H])?1:0;
        if(nx&&px2&&ny&&py2&&nz&&pz2) continue;
        let ex=0, ey=0, ez=0;
        if(!nx) ex-=1; if(!px2) ex+=1;
        if(!ny) ey-=1; if(!py2) ey+=1;
        if(!nz) ez-=1; if(!pz2) ez+=1;
        const el=Math.hypot(ex,ey,ez);
        if(el>0){
          const dot=(ex*(-dx)+ey*(-dy)+ez*(-dz))/(el*(d||1));
          if(dot<0.05) continue;
        }
        const f=(1-d/rad);
        const burn=M.hp*(0.55+f*0.45);
        b.hp[i]=Math.max(1, b.hp[i]-burn);
        const nc=codeOf(m,b.hp[i]);
        if(nc!==b.code[i]){
          b.code[i]=nc; touched=true; n++;
          markSec(b,y);
        }
      }
    }
    if(touched) b.mdirty=true;
  }
  return n;
}

function swingBall(){

  const o=camera.position;
  const dir=new THREE.Vector3();
  camera.getWorldDirection(dir);
  // 照準の当たった点へ真っ直ぐ撃ち込む
  const hit=aimRay();
  const dist=Math.min(320, Math.max(30, hit.miss?200:hit.d));
  const tx=o.x+dir.x*dist, ty=o.y+dir.y*dist, tz=o.z+dir.z*dist;
  const rt=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();
  let cx=o.x+dir.x*14+rt.x*4, cy=o.y+dir.y*14-6, cz=o.z+dir.z*14+rt.z*4;
  if(cy<R+1) cy=R+1;
  let mx=tx-cx, my=ty-cy, mz=tz-cz;
  const ml=Math.hypot(mx,my,mz)||1;
  const spd=Math.max(150, Math.min(340, ml*1.7));   // 遠いほど速く飛ばす
  ball={
    x:cx, y:cy, z:cz,
    vx:mx/ml*spd, vy:my/ml*spd, vz:mz/ml*spd,
    r:R, t:0, life:2.4, power:1.25,
    ax:o.x, ay:o.y+26, az:o.z            // ワイヤーの吊り元
  };
  Snd.woosh&&Snd.woosh(); Snd.rail();
  kick(-.014,0);
  return 1;
}
function updBall(dt){
  if(!ball) return;
  const B=ball;
  B.t+=dt;
  B.vy-=GRAV*0.55*dt;                     // 振り子なので重力は弱め
  const steps=3;
  for(let s=0;s<steps;s++){
    B.x+=B.vx*dt/steps; B.y+=B.vy*dt/steps; B.z+=B.vz*dt/steps;
    if(B.y<B.r*0.6){ B.y=B.r*0.6; B.vy=Math.abs(B.vy)*0.25; }
    // 建物に当たったら削り、押した方向へ倒す
    const g=bldAt(B.x,B.y,B.z);
    if(g){
      const sp=Math.hypot(B.vx,B.vy,B.vz);
      const rad=B.r*(0.9+B.power*0.35);
      const n=damageSphere(B.x,B.y,B.z, rad, 900*B.power);
      if(n>0){
        // 押された向きへ倒す
        const hl=Math.hypot(B.vx,B.vz)||1;
        setLeanDir(B.vx/hl, B.vz/hl, Math.min(1,0.5+B.power*0.5));
        g.b.dirty=true;
        dustAt(B.x,B.y,B.z, Math.min(18,5+n*.25), 1.3);
        efx('ball',B.x,B.y,B.z, rad*.4, rad*1.5, .22, 0xffd8a0, .55);
        // 重い衝撃：火花の筋・土煙・一瞬のヒットストップ
        for(let i=0;i<Math.min(40,10+n*.3);i++){ const a=Math.random()*6.283;
          spark(B.x,B.y,B.z,Math.cos(a)*rf(8,30),rf(4,22),Math.sin(a)*rf(8,30),rf(.3,.8),1,.7,.4); }
        for(let i=0;i<4;i++) vfxSmoke(B.x+rf(-2,2),B.y+rf(-1,2),B.z+rf(-2,2),rad*rf(.6,1.0),rf(1.8,3.2),rf(-4,4),rf(1,4),rf(-4,4),0);
        if(n>30){ hitStop(.05); distort(B.x,B.y,B.z,rad*3,.35,.5); caPulse=Math.min(1,caPulse+.3); }
        // 近くの塊も突き飛ばす
        for(let k=0;k<chunks.length;k++){
          const c=chunks[k];
          const dx=c.p[0]-B.x, dy=c.p[1]-B.y, dz=c.p[2]-B.z;
          const d=Math.hypot(dx,dy,dz);
          if(d>rad*3.5) continue;
          c.sleep=false; c.rest=0; c.sleepT=0;
          const f=1-d/(rad*3.5);
          c.v[0]+=B.vx*.10*f; c.v[1]+=Math.abs(B.vy)*.05*f+16*f; c.v[2]+=B.vz*.10*f;
          c.w[0]+=rf(-2,2)*f; c.w[2]+=rf(-2,2)*f;
        }
        shake(Math.min(1.0,.25+B.power*.35));
        Snd.thud(Math.min(.5,.22+B.power*.2));
        // 減速する（貫通しすぎない）
        B.vx*=.72; B.vy*=.72; B.vz*=.72;
        if(Math.hypot(B.vx,B.vy,B.vz)<26) B.life=Math.min(B.life,.2);
      }
    }
  }
  // 見た目
  ballMesh.visible=true;
  ballMesh.position.set(B.x,B.y,B.z);
  ballMesh.scale.setScalar(B.r);
  const pa=ballChain.geometry.attributes.position;
  pa.array[0]=B.ax; pa.array[1]=B.ay; pa.array[2]=B.az;
  pa.array[3]=B.x;  pa.array[4]=B.y;  pa.array[5]=B.z;
  pa.needsUpdate=true;
  ballChain.visible=true;
  B.life-=dt;
  if(B.life<=0){
    ball=null;
    ballMesh.visible=false; ballChain.visible=false;
  }
}

const CUT_R=1600, CUT_T=4.2;   // 街の差し渡しは約470mなので実用上は無制限
function doCut(o,dA,dB){
  const n=damagePlane(o.x,o.y,o.z,dA,dB,CUT_R,CUT_T);
  // 切断面の法線 → 面上の最急降下方向 ＝ 上部が滑り落ちる向き
  let nx=dA[1]*dB[2]-dA[2]*dB[1], ny=dA[2]*dB[0]-dA[0]*dB[2], nz=dA[0]*dB[1]-dA[1]*dB[0];
  const nl=Math.hypot(nx,ny,nz)||1;
  nx/=nl; ny/=nl; nz/=nl;
  if(ny<0){ nx=-nx; ny=-ny; nz=-nz; }
  const hl=Math.hypot(nx,nz);
  if(hl>0.05) setLeanDir(nx/hl, nz/hl, Math.min(1,hl*1.7));
  else leanHint=null;
  // 可視化：平面上の扇形を1枚のポリゴンで光らせる

  p[0]=o.x+dA[0]*r0; p[1]=o.y+dA[1]*r0; p[2]=o.z+dA[2]*r0;
  p[3]=o.x+dB[0]*r0; p[4]=o.y+dB[1]*r0; p[5]=o.z+dB[2]*r0;
  p[6]=o.x+dB[0]*CUT_R; p[7]=o.y+dB[1]*CUT_R; p[8]=o.z+dB[2]*CUT_R;
  p[9]=o.x+dA[0]*CUT_R; p[10]=o.y+dA[1]*CUT_R; p[11]=o.z+dA[2]*CUT_R;
  cutMesh.geometry.attributes.position.needsUpdate=true;
  cutMesh.visible=true; cutT=1;

  for(let i=0;i<54;i++){
    const t=Math.random(), r=40+Math.random()*(CUT_R*.55);
    const dx=dA[0]+(dB[0]-dA[0])*t, dy=dA[1]+(dB[1]-dA[1])*t, dz=dA[2]+(dB[2]-dA[2])*t;
    const dl=Math.hypot(dx,dy,dz)||1;
    const px=o.x+dx/dl*r, py=o.y+dy/dl*r, pz=o.z+dz/dl*r;
    glow(px,py,pz,1,14,[.6,1,1]);

        r:.7+Math.random()*1.5, gr:0, life:1, dec:.010+Math.random()*.012,
        grav:1, c:[.85,1,1]});
  }
  // 遠端の切断線を光らせる
  beamFx.push({a:new THREE.Vector3(o.x+dA[0]*CUT_R*.85,o.y+dA[1]*CUT_R*.85,o.z+dA[2]*CUT_R*.85),
               b:new THREE.Vector3(o.x+dB[0]*CUT_R*.85,o.y+dB[1]*CUT_R*.85,o.z+dB[2]*CUT_R*.85),
               life:1,col:0xdaffff,w:1.6});
  shake(.85); fovPunch(6); kick(-.02,(Math.random()-.5)*.03); Snd.cut();
  if(n>60) causeToast('切断 → 上部が支えを失う');
  if(n>500) banner('切断','SEVERED');
  else if(n>60) banner('切断','CUT');

}

  const LIM=2400;
  cam.pos.x=Math.max(-LIM,Math.min(LIM,cam.pos.x));
  cam.pos.z=Math.max(-LIM,Math.min(LIM,cam.pos.z));
  camera.position.copy(cam.pos);
  if(shakeAmt>0.002){
    // カメラ位置を動かすと移動中に進路がぶれて操作の邪魔になるので、
    // 揺れは「向き」だけで表現する。位置は一切ずらさない
    shakeT+=dt;
    const w1=Math.sin(shakeT*29.0), w2=Math.sin(shakeT*23.7+1.9), w3=Math.sin(shakeT*37.1+3.4);
    camera.rotateX(w1*shakeAmt*.020);      // 縦の揺さぶり
    camera.rotateY(w3*shakeAmt*.014);      // 横の揺さぶり
    camera.rotateZ(w2*shakeAmt*.030);      // ロール（一番「効いて」見える）
    shakeAmt*=Math.pow(.004,dt);           // 素早く収まる
  } else shakeAmt=0;
}

/* 起動直後：予約されたメッシュを数フレームに分けて作る。
   近い建物から作るので、見えている所から街が現れる */
let booting=true, meshQTotal=1;
function finishBoot(){
  booting=false;
  const b=document.getElementById('boot'); if(b) b.style.display='none';
  needFrame=true;
}
function buildQueued(){
  if(!meshQ.length){ if(booting) finishBoot(); return; }
  if(meshQ.length>4){
    // カメラに近い順に並べ替える（1回だけ）
    const cx=camera.position.x, cz=camera.position.z;
    meshQ.sort((a,b)=>
      ((a.ox-cx)**2+(a.oz-cz)**2) - ((b.ox-cx)**2+(b.oz-cz)**2));
  }
  let budget=26000;                       // 1フレームに走査してよいセル数
  while(meshQ.length && budget>0){
    const b=meshQ.shift();
    budget-=b.W*b.H*b.D;
    remesh(b);
  }
  if(booting) boot(.6+.4*(1-meshQ.length/Math.max(1,meshQTotal)),'街を構築中…');
  if(!meshQ.length){ buildHalos(); buildGlowFloor(); if(booting) finishBoot(); }
}

        m.p[0]+=m.v[0]*dt/steps; m.p[1]+=m.v[1]*dt/steps; m.p[2]+=m.v[2]*dt/steps;
        if(m.p[1]<=1.5){ done=true; break; }

let beamPool=[];

function updBeams(){

    _d2.copy(_d1).divideScalar(len);
    const cx=railBeam.ax+_d1.x*.5, cy=railBeam.ay+_d1.y*.5, cz=railBeam.az+_d1.z*.5;
    const pulse=.85+Math.sin(perfNow()*.045)*.15;

    const g=beamPool[n++];
    g.o.visible=true; g.o.position.set(cx,cy,cz);
    g.o.quaternion.setFromUnitVectors(_up,_d2);
    const gw=1.05*pulse;
    g.o.scale.set(gw,len,gw);
    g.mat.color.setHex(0x2ab8ff); g.mat.opacity=.22;
    // 内芯
    const e=beamPool[n++];
    e.o.visible=true; e.o.position.set(cx,cy,cz);
    e.o.quaternion.setFromUnitVectors(_up,_d2);

    _d2.copy(_d1).divideScalar(len);

    e.o.position.copy(b.a).addScaledVector(_d1,.5);
    e.o.quaternion.setFromUnitVectors(_up,_d2);
    e.o.scale.set(b.w*b.life,len,b.w*b.life);
    e.mat.color.setHex(b.col);
    e.mat.opacity=b.life*.85;
  }
  if(orbitFx && n+1<beamPool.length){
    const pulse=1+Math.sin(perfNow()*.02)*.10;
    const outer=beamPool[n++];
    outer.o.visible=true;
    outer.o.position.set(orbitFx.x,450,orbitFx.z);

function targetLabel(h){
  if(!h||h.miss) return '';
  if(h.ground) return '地面';
  const q=bldAt(h.x,h.y,h.z);
  if(!q) return '';
  const b=q.b, m=b.vox[q.x+b.W*(q.y+b.H*q.z)];
  const lm=(b.lm!==undefined&&LMS[b.lm])?LMS[b.lm]:null;
  const name=lm?lm.name:(STYLE_NAME[b.style]||'建物');
  const mat=MATS[m]?MATS[m].n:'';
  const dmg=b.init?Math.round((1-b.live/b.init)*100):0;
  el.tgt.classList.toggle('lm',!!lm);
  return name+(mat?'　'+mat:'')+(dmg>0?'　損傷'+dmg+'%':'');
}

let shownScore=0, popBuf=0, popT=0, popSlot=0, scoreHotT=0;
let shownTon=0, downed=0, shownDowned=0, bldHotT=0;
const TON_PER_VOX=2.6;                 // ボクセル1個 ≒ 2.6トン
function fmtTon(t){
  if(t>=1e6) return (t/1e6).toFixed(2)+'<span>Mt</span>';
  if(t>=1e3) return (t/1e3).toFixed(1)+'<span>kt</span>';
  return Math.round(t)+'<span>t</span>';
}
const CHAINRANK=[
  [2,'#ffd166','GOOD'],[4,'#ffb03a','GREAT'],[7,'#ff8a2b','EXCELLENT'],
  [11,'#ff5a1f','AMAZING'],[16,'#ff2d78','UNREAL'],[24,'#c47bff','GODLIKE'],
  [34,'#a24bff','ANNIHILATOR'],[46,'#ff2020','CATACLYSM'],[60,'#ffffff','BEYOND']
];
let popVox=0;
function pushVox(n){ if(n>0) popVox+=n; }
function flushPops(dt){
  popT-=dt;
  if(popT>0 || popVox<=0) return;
  const v=popVox*TON_PER_VOX; popVox=0; popBuf=0;
  if(v<1) return;
  popT = v>9000?.055 : v>3000?.075 : v>900?.10 : .14;
  const big=v>9000, mid=v>2600;
  const d=document.createElement('div');
  d.className='pop';
  d.style.fontSize=(big?26:mid?20:(v>4000?16:13))+'px';
  d.style.color= big?'#fff' : mid?'#ffd98a' : (v>4000?'#ffb03a':'#e6b98a');
  d.style.textShadow = big
    ? '0 0 22px rgba(255,190,60,1),0 0 48px rgba(255,90,31,.8),0 2px 0 rgba(0,0,0,.7)'
    : '0 0 12px rgba(255,176,58,.7),0 2px 0 rgba(0,0,0,.6)';
  d.innerHTML='+'+fmtTon(v);
  popSlot=(popSlot+1)%7;
  d.style.top=(popSlot*13)+'px';
  elPops.appendChild(d);
  const dx=-8-Math.random()*26, dy=-46-Math.random()*40;
  const dur=big?1500:1050;
  d.animate([
    {transform:'translate(26px,10px) scale(.6)',opacity:0},
    {transform:'translate(0,0) scale('+(big?1.35:1.12)+')',opacity:1,offset:.13},
    {transform:'translate(0,0) scale(1)',opacity:1,offset:.30},
    {transform:'translate('+dx+'px,'+dy+'px) scale(.94)',opacity:0}
  ],{duration:dur,easing:'cubic-bezier(.16,.9,.3,1)'});
  setTimeout(()=>{ if(d.parentNode) d.parentNode.removeChild(d); },dur+60);
  if(mid){
    elScore.classList.add('hot'); scoreHotT=.42;
    elScore.animate([{transform:'scale(1.22)'},{transform:'scale(1)'}],{duration:280,easing:'cubic-bezier(.2,1.6,.4,1)'});
  }
}
function updScoreUI(dt){
  flushPops(dt);
  if(scoreHotT>0){ scoreHotT-=dt; if(scoreHotT<=0) elScore.classList.remove('hot'); }
  const ton=killedVox*TON_PER_VOX;
  if(Math.abs(shownTon-ton)>0.5){
    const d=ton-shownTon;
    shownTon += d*Math.min(1,dt*6) + Math.sign(d)*Math.min(Math.abs(d),Math.max(1,Math.abs(d)*.02));
    if(Math.abs(ton-shownTon)<1) shownTon=ton;
    elScore.innerHTML=fmtTon(shownTon);
  }
  let d2=0, tot2=0;
  for(let k=0;k<blds.length;k++){
    const b=blds[k];
    if(b.style==='pole'||b.style==='car'||b.style==='tree') continue;
    tot2++;
    if(b.live<=b.init*0.15) d2++;
  }
  if(d2!==downed){
    if(d2>downed && elBld){
      elBld.animate([{transform:'scale(1.45)',filter:'brightness(2.2)'},{transform:'scale(1)',filter:'brightness(1)'}],
        {duration:400,easing:'cubic-bezier(.2,1.7,.4,1)'});
      flashDom(.05);
    }
    downed=d2;
  }
  if(elBld) elBld.innerHTML=downed+'<span>/ '+tot2+' 棟</span>';
  if(elScoreSub && S.score!==shownScore){ shownScore=S.score; elScoreSub.innerHTML=fmtScore(S.score)+'<span>SCORE</span>'; }
  if(S.combo>1 && S.comboT>0){
    elChain.style.opacity='1';
    elChainN.textContent='×'+S.combo;
    elChainN.style.fontSize = S.combo>=100 ? '42px' : (S.combo>=10 ? '50px' : '56px');
    if(elChainBar) elChainBar.style.transform='scaleX('+Math.max(0,Math.min(1,S.comboT))+')';
    let col='#ffd166', nm='GOOD';
    for(const r of CHAINRANK) if(S.combo>=r[0]){ col=r[1]; nm=r[2]; }
    elChainN.style.color=col;
    elChainRank.textContent=nm;
    elChainRank.style.color=col;
  } else elChain.style.opacity='0';
}

  elChain.animate([

    {transform:'translateX(-50%) scale(1)',filter:'brightness(1)'}
  ],{duration:340,easing:'cubic-bezier(.2,1.7,.4,1)'});

function flashDom(v){ flashV=Math.max(flashV,v*QUAL.fxK); }

/* ══════════ 入力：指ごとの所有権を pointerId で管理する ══════════
   役割：stick（移動）／look（視点）／fire（発射。押しながら視点も動かせる）／cut（カッターの切断線）／alt（高度）
   pointercancel・キャプチャ喪失・メニュー表示では「攻撃確定」せず、安全に解除する */
const stickEl=document.getElementById('stick'), stickIn=stickEl.querySelector('i');
const cutLineEl=document.getElementById('cutline');
const PTR=new Map();
let stickC={x:0,y:0};
let fireHeld=false, fireId=null;
let btnUp=false, btnDn=false;
function hasRole(r){ for(const p of PTR.values()) if(p.role===r) return true; return false; }
function uiBlocked(){ return booting || paused || resultOn || document.getElementById('pmenu').classList.contains('on') || document.getElementById('wsheet').classList.contains('on'); }
function showCutLine(x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  cutLineEl.style.opacity='1';
  cutLineEl.style.left=x1+'px'; cutLineEl.style.top=y1+'px';
  cutLineEl.style.width=Math.hypot(dx,dy)+'px';
  cutLineEl.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';
}
function hideCutLine(){ cutLineEl.style.opacity='0'; cutLineEl.style.width='0px'; }
function setAlt(){ inp.up = btnUp?1:(btnDn?-1:0);
  document.getElementById('bUp').classList.toggle('on',btnUp); document.getElementById('bDn').classList.toggle('on',btnDn); }
function resetStick(){ inp.fwd=0; inp.side=0; inp.boost=0; stickIn.style.transform='translate(0,0)'; stickEl.classList.remove('on'); stickEl.classList.remove('boost'); }
function moveStick(e){
  const dx=e.clientX-stickC.x, dy=e.clientY-stickC.y;
  const d=Math.min(50,Math.hypot(dx,dy)), a=Math.atan2(dy,dx);
  const nx=Math.cos(a)*d, ny=Math.sin(a)*d;
  stickIn.style.transform='translate('+nx+'px,'+ny+'px)';
  // 中心付近は不感帯：止めたい時にすぐ止まる。外周は高速移動
  const k=d<7?0:(d-7)/43;
  inp.side=k*Math.cos(a); inp.fwd=-k*Math.sin(a);
  inp.boost = d>45;
  stickEl.classList.toggle('boost',inp.boost);
}
/* カッターの切断線：主操作ボタンから引いた指の動きを、照準を中心にした線として描く */
function cutPts(p){
  const cx=window.innerWidth/2, cy=window.innerHeight/2;
  const dx=p.x-p.x0, dy=p.y-p.y0;
  return {ax:cx-dx/2, ay:cy-dy/2, bx:cx+dx/2, by:cy+dy/2, len:Math.hypot(dx,dy)};
}
function endPtr(id,p,cancelled){
  if(!p) return;
  if(p.role==='stick') resetStick();
  else if(p.role==='fire'){ if(fireId===id){ fireHeld=false; fireId=null; } el.fire.classList.remove('on'); }
  else if(p.role==='cut'){
    el.fire.classList.remove('on'); hideCutLine(); el.xh.classList.remove('cut');
    if(!cancelled && cd<=0 && canShoot()){
      const c=cutPts(p);
      cd=WPN.find(w=>w.id===wpn).cd; cdMax=Math.max(.001,cd); S.shots++; noteShot(); Snd.kick();
      if(c.len>26) doCut(camera.position, screenRay(c.ax,c.ay), screenRay(c.bx,c.by));
      else { // 短いタップ：照準の高さで水平に断つ
        const dir=new THREE.Vector3(); camera.getWorldDirection(dir);
        const ca=Math.cos(-.30), sa=Math.sin(-.30), cb=Math.cos(.30), sb=Math.sin(.30);
        doCut(camera.position,[dir.x*ca-dir.z*sa, dir.y, dir.x*sa+dir.z*ca],[dir.x*cb-dir.z*sb, dir.y, dir.x*sb+dir.z*cb]);
      }
      updWeaponUI();
    }
  }
  else if(p.role==='altUp'){ btnUp=false; setAlt(); }
  else if(p.role==='altDn'){ btnDn=false; setAlt(); }
}
function releasePointers(){
  for(const [id,p] of PTR) endPtr(id,p,true);
  PTR.clear();
  resetStick(); fireHeld=false; fireId=null; btnUp=false; btnDn=false; setAlt(); hideCutLine();
  el.fire.classList.remove('on'); el.xh.classList.remove('cut');
}
function onDown(e){
  if(uiBlocked()) return;
  const t=e.target;
  if(t.closest && t.closest('button,.ov,#qbar,#alt,#fire,#det,#bPause')) return;
  if(PTR.has(e.pointerId)) return;
  const r=stickEl.getBoundingClientRect();
  const inStick = e.clientX>=r.left-36 && e.clientX<=r.right+36 && e.clientY>=r.top-36 && e.clientY<=r.bottom+36;
  if(inStick && !hasRole('stick')){
    stickC={x:r.left+r.width/2, y:r.top+r.height/2};
    PTR.set(e.pointerId,{role:'stick'}); stickEl.classList.add('on'); moveStick(e); return;
  }
  if(!hasRole('look')){ PTR.set(e.pointerId,{role:'look',x:e.clientX,y:e.clientY}); }
}
function lookDelta(p,e){
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  p.x=e.clientX; p.y=e.clientY;
  const sens=.0042*(430/Math.max(320,Math.min(window.innerWidth,window.innerHeight)));
  cam.yaw-=dx*sens;
  cam.pitch=Math.max(-1.45,Math.min(1.45,cam.pitch-dy*sens));
}
function onMove(e){
  const p=PTR.get(e.pointerId); if(!p) return;
  if(p.role==='stick') moveStick(e);
  else if(p.role==='look') lookDelta(p,e);
  else if(p.role==='fire'){ if(!hasRole('look')) lookDelta(p,e); }      // 押しながらドラッグで照準
  else if(p.role==='cut'){ p.x=e.clientX; p.y=e.clientY; const c=cutPts(p); if(c.len>26){ showCutLine(c.ax,c.ay,c.bx,c.by); el.xh.classList.add('cut'); } else { hideCutLine(); el.xh.classList.remove('cut'); } }
}
function onUp(e){ const p=PTR.get(e.pointerId); if(!p) return; PTR.delete(e.pointerId); endPtr(e.pointerId,p,false); }
function onCancel(e){ const p=PTR.get(e.pointerId); if(!p) return; PTR.delete(e.pointerId); endPtr(e.pointerId,p,true); }
let _sndUnlocked=false;
window.addEventListener('pointerdown',function(){
  if(_sndUnlocked) return;
  _sndUnlocked=true;
  Snd.kick();                     // 最初のタッチで AudioContext を起こしておく
},{capture:true});
window.addEventListener('pointerdown',onDown);
window.addEventListener('pointermove',onMove,{passive:true});
window.addEventListener('pointerup',onUp);
window.addEventListener('pointercancel',onCancel);
window.addEventListener('lostpointercapture',e=>{ const p=PTR.get(e.pointerId); if(p&&(p.role==='fire'||p.role==='cut'||p.role==='altUp'||p.role==='altDn')){ /* 指が離れた時も lostpointercapture が来るので、up/cancel 側で処理する */ } });
window.addEventListener('blur',()=>releasePointers());

  PTR.set(e.pointerId,{role:'fire',x:e.clientX,y:e.clientY});

bu.addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault(); if(uiBlocked()) return; try{ bu.setPointerCapture(e.pointerId); }catch(err){} PTR.set(e.pointerId,{role:'altUp'}); btnUp=true; setAlt(); });
bd.addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault(); if(uiBlocked()) return; try{ bd.setPointerCapture(e.pointerId); }catch(err){} PTR.set(e.pointerId,{role:'altDn'}); btnDn=true; setAlt(); });
const detB=document.getElementById('det');

/* ══════════ ポーズメニュー ══════════ */

function renderMenu(){
  document.getElementById('bSnd').textContent=S.sound?'🔊 音':'🔇 音 OFF';
  document.getElementById('bSnd').classList.toggle('on',S.sound);
  const bh=document.getElementById('bHap'); bh.textContent=HAP_VIB?(hapticOn?'振動':'振動 OFF'):'振動（非対応）'; bh.classList.toggle('on',hapticOn&&HAP_VIB); bh.style.opacity=HAP_VIB?'1':'.5';

onCtxLost=(lost)=>{ const o=document.getElementById('ctxov'); o.classList.toggle('on',lost);

/* 初回だけ短い操作ヒント */
let hintT=null;
function showHint(force){
  let seen=false; try{ seen=!!localStorage.getItem('tt2_hint'); }catch(e){}
  if(seen&&!force) return;
  try{ localStorage.setItem('tt2_hint','1'); }catch(e){}
  const h=document.getElementById('hint');
  h.innerHTML='左下 <b>スティック</b>＝移動（外周で高速）　画面 <b>ドラッグ</b>＝視点<br>右下 <b>FIRE</b>＝発射（押しながらドラッグで照準）　▲▼＝高度';
  h.classList.add('on');
  if(hintT) clearTimeout(hintT);
  hintT=setTimeout(()=>h.classList.remove('on'),7000);
}
// キーボード（PC）
const keys={};
window.addEventListener('keydown',e=>{
  keys[e.code]=1;
  if(e.code==='Escape'){ if(pmenu.classList.contains('on')) closeMenu(); else if(!resultOn) openMenu('menu'); }
  if(uiBlocked()) return;
  if(e.code==='Space'){ e.preventDefault(); fireHeld=true;
    const W=WPN.find(w=>w.id===wpn); if(!W.cont && cd<=0) fireWeapon(); }
  const n=parseInt(e.key,10);
  if(n>=1&&n<=WPN.length) selW(WPN[n-1].id,true);
  if(e.code==='Digit0') selW(WPN[9].id,true);
  if(e.code==='KeyX') blowCharges();
});
window.addEventListener('keyup',e=>{ keys[e.code]=0; if(e.code==='Space') fireHeld=false; });
function readKeys(){
  if(hasRole('stick')) return;
  const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0), s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  if(f||s||keys._any){ inp.fwd=f; inp.side=s; keys._any=(f||s)?1:0; }
  if(!btnUp && !btnDn) inp.up=(keys.KeyE?1:0)-(keys.KeyQ?1:0);
  if(keys.ShiftLeft!==undefined) inp.boost=keys.ShiftLeft?1:inp.boost&&0;
}

/* ══════════ 性能表示（検証用。通常は隠す） ══════════ */
function drawPerf(avg,worst){
  const d=document.getElementById('perf'); if(!d) return;
  const r=Array.from(QUAL.ring).filter(v=>v>0).sort((a,b)=>a-b);
  const q=(k)=>r.length?r[Math.min(r.length-1,(r.length*k)|0)].toFixed(1):'-';
  const info=renderer?renderer.info:null;
  d.textContent=
    'frame avg '+avg.toFixed(1)+'ms  p50 '+q(.5)+'  p95 '+q(.95)+'  worst '+worst.toFixed(0)+'ms\n'+
    'quality '+QUAL.mode+' L'+QUAL.level+' pr'+QUAL.pr.toFixed(2)+(POST.on?(POST.hdr?' HDR':' 8bit')+(POST.msaa?' MSAA':'')+(WET.on?' refl/'+WET.every:''):' noPost')+'\n'+
    'step wpn '+PROF.wpn.toFixed(1)+' chunk '+PROF.chunk.toFixed(1)+' bfs '+PROF.bfs.toFixed(1)+' mesh '+PROF.mesh.toFixed(1)+' fx '+PROF.fx.toFixed(1)+'ms\n'+
    'chunks '+chunks.length+' meshQ '+meshQ.length+' zoneQ '+zoneQ.length+' rubble '+rubMeshes.length+'/'+rubTris+'tri\n'+
    'smoke '+VFX.sa.length+' fire '+VFX.fa.length+' spark '+VFX.pa.length+' pts '+fx.length+'/'+gxA.length+' debris '+DEB.arr.length+' peds '+PED.list.length+' fires '+fires.length+'\n'+
    (info?('gpu geo '+info.memory.geometries+' tex '+info.memory.textures+' calls '+info.render.calls+' tris '+info.render.triangles):'');
}
/* ══════════ 初期化 ══════════ */
function initScene(){
  renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(prForLevel(0));
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setClearColor(FOGC,1);
  document.body.insertBefore(renderer.domElement,document.getElementById('hud'));
  renderer.domElement.addEventListener('webglcontextlost',(e)=>{
    e.preventDefault();                                   // 復元を許可する
    ctxLost=true; setPaused(true,'ctx');
    if(onCtxLost) onCtxLost(true);
  },false);
  renderer.domElement.addEventListener('webglcontextrestored',()=>{
    ctxLost=false;
    try{ resizePost(); }catch(e){}
    if(LITU.uLM.value) LITU.uLM.value.needsUpdate=true;
    last=performance.now(); needFrame=true;
    if(onCtxLost) onCtxLost(false);
  },false);

  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(FOGC,FOG_NEAR,FOG_FAR);
  const bt=blockTex();
  try{ bt.anisotropy=renderer.capabilities.getMaxAnisotropy(); }catch(e){}
  MAT_SOLID.map=bt; MAT_SOLID.needsUpdate=true;
  setupLitMaterial(MAT_SOLID);
  initPost();
  initDebris();
  initSigns();
  initVFX();
  initTraffic();
  initPeds();
  initLanterns();
  initSignals();
  camera=new THREE.PerspectiveCamera(72,window.innerWidth/window.innerHeight,.6,3000);

  // 空：光害で地平線が光る東京の夜空（雲・月・星はシェーダーで描く）
  skyMesh=makeSky(); scene.add(skyMesh);

  // 地面
  const gg=new THREE.PlaneGeometry(9000,9000,1,1);   // 端が見えないよう霧の届く先まで広げる
  const gm=new THREE.MeshBasicMaterial({color:0x090b0f,fog:true});
  gm.userData.wetK=0.30;
  const ground=new THREE.Mesh(gg,gm);
  setupWetMaterial(gm); WET.ground=ground;
  ground.rotation.x=-Math.PI/2; ground.position.y=-.06;
  scene.add(ground);

  initPools();
  initOrbMesh();
  initShockMesh();
  initHaptics();
  initBallMesh();
  initCutMesh();
  initFX();
}
function resize(){
  if(QUAL.applied) renderer.setPixelRatio(prForLevel(QUAL.level));   // 回転で画面の画素数が変わる
  renderer.setSize(window.innerWidth,window.innerHeight);
  needFrame=true;
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  resizePost();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,250));

selW('missile');
setMode('free');

last=performance.now();
function setPaused(v,reason){
  v=!!v;
  if(paused===v) return;
  paused=v;
  if(v){
    if(typeof releasePointers==='function') releasePointers();
    if(railOn){ railOn=false; Snd.humOff(); }
    fireHeld=false;
    Snd.pause();
  } else {
    last=performance.now();
    Snd.resume();
  }
  if(onPauseChange) onPauseChange(v,reason);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) setPaused(true,'bg');
  else last=performance.now();                      // 復帰後の最初の刻みを巨大にしない（再開はメニューから）
});
window.addEventListener('pagehide',()=>setPaused(true,'bg'));
function loop(now){
  requestAnimationFrame(loop);
  let raw=(now-last)/1000; last=now;
  if(!(raw>0)||raw>1) raw=.016;                     // 長い空白（バックグラウンド復帰など）はコマ送りにしない
  if(ctxLost) return;
  updPerf(raw);                                     // 実フレーム間隔（上限なし）で性能を見る
  if(paused){ if(needFrame){ needFrame=false; try{ renderFrame(0); }catch(e){} } return; }
  realDt=Math.min(.05,raw);                         // 入力・カメラ・UI 用：スローモーションの影響を受けない
  let dt=realDt;                                    // シミュレーション用：上限付き
  if(slowT>0){
    slowT-=realDt;
    slowK += ((slowT>0?.34:1)-slowK)*Math.min(1,realDt*9);
  } else if(slowK<1){
    slowK += (1-slowK)*Math.min(1,realDt*3.2);
    if(slowK>.99) slowK=1;
  }
  dt*=slowK;
  if(hitStopT>0){ hitStopT-=realDt; dt*=.05; }     // ヒットストップ：大きな着弾の瞬間だけ時間がほぼ止まる
  if(runStarted && !runOver && !resultOn) runElapsed+=raw;   // モードの時計は実時間
  Snd.f(realDt);
  readKeys();
  const CW=WPN.find(w=>w.id===wpn);
  // レールガンは照射の開始で1発。撃ち切った後は新たに照射できない（照射中のものは続く）
  const wantRail=fireHeld && !!CW.cont && (railOn || canShoot());
  if(wantRail!==railOn){ railOn=wantRail; railOn?Snd.humOn():Snd.humOff();
    if(railOn){ S.shots++; noteShot(); railAcc=RAIL_DT; } }
  if(fireHeld && !CW.cont && cd<=0 && CW.id!=='demo') fireWeapon();
  updCam(realDt);
  if(railOn) railTick(dt);
  step(dt);
  updHUD(realDt);
  updFlash(realDt); updScoreUI(realDt);
  renderFrame(dt);
  needFrame=false;
}
requestAnimationFrame(loop);
